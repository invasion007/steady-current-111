<style>

<script>/* =====================================================================
   viz_dc_physics.js —— 11.1 电源和电流 · 物理内核（纯函数，与画面完全解耦）
   依据：人教2019版必修第三册 P53–P56；教师用书 P73–P77；
        教案《11.1 电源和电流 · 教学设计》环节①—⑦
   约定：中学取值 e = 1.6×10⁻¹⁹ C，N_A = 6.02×10²³ mol⁻¹，c = 3.0×10⁸ m/s
   ===================================================================== */
(function (global) {
  'use strict';

  var E_CHARGE = 1.6e-19;      // 元电荷 (C)
  var C_LIGHT = 3.0e8;         // 电场建立速率 (m/s)
  var M_E = 9.11e-31;          // 电子质量 (kg)
  /* 铜中自由电子平均自由时间 (s)。取 4.858×10⁻¹⁴ s 的依据：
     1 m 铜导线（S = 1 mm²）通 1 A 时 v = I/(neS) = 7.47×10⁻⁵ m/s、E = 0.0175 V/m，
     由 v̄ = eEτ/(2m) 反解 τ = 2mv/(eE) = 4.858×10⁻¹⁴ s —— 让“加速—碰撞”模型与
     宏观的 I = neSv 在同一组数上自洽（见 runSelfTest 第 26 条断言）。 */
  var TAU_CU = 4.858e-14;
  var RHO_CU = 8.9e3;          // 铜密度 (kg/m³)
  var M_CU = 6.4e-2;           // 铜摩尔质量 (kg/mol)
  var NA = 6.02e23;            // 阿伏加德罗常数 (1/mol)

  /* ---------------- 数值格式（右栏读数用） ---------------- */
  function fmt(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x !== 0 && (Math.abs(x) < 1e-3 || Math.abs(x) >= 1e5)) return sci(x, n);
    return Number(x.toFixed(n)).toString();
  }
  function sci(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x === 0) return '0';
    var e = Math.floor(Math.log(Math.abs(x)) / Math.LN10);
    var m = x / Math.pow(10, e);
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return Number(m.toFixed(n)) + '×10' + sup(e);
  }
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function sup(n) {
    return String(n).split('').map(function (c) { return SUPS[c] || c; }).join('');
  }

  /* ---------------- 一、电流的定义式 I = q/t ---------------- */
  /* 通过横截面的电荷量 */
  function charge(I, t) { return I * t; }
  /* 电流（定义式）。t=0 视为无意义，按 0 处理避免除零 */
  function current(q, t) { return t > 0 ? q / t : 0; }
  /* 通过的电子个数（取电荷量绝对值） */
  function electrons(q) { return Math.abs(q) / E_CHARGE; }
  /* 由电流与时间反推电荷量（等价 charge） */
  function chargeFromCurrent(I, t) { return I * t; }

  /* ---------------- 二、单位换算 ---------------- */
  var UNITS = { 'A': 1, 'mA': 1e-3, 'μA': 1e-6 };
  function toAmpere(v, unit) { return v * (UNITS[unit] || 1); }
  function fromAmpere(I, unit) { return I / (UNITS[unit] || 1); }
  function convertUnit(v, from, to) { return v * (UNITS[from] || 1) / (UNITS[to] || 1); }

  /* ---------------- 三、横截面（易错点①） ---------------- */
  /* 面元与电流方向成 theta（度）时，真正“数得到电荷”的投影面积 */
  function effArea(S, thetaDeg) { return S * Math.abs(Math.cos(thetaDeg * Math.PI / 180)); }
  /* 同一段时间内，穿过斜截面被计入的电荷量之比 = cosθ */
  function crossFactor(thetaDeg) { return Math.abs(Math.cos(thetaDeg * Math.PI / 180)); }
  /* 判定：只有 θ = 0（截面垂直于电流方向）才是横截面 */
  function isCrossSection(thetaDeg, tol) { return Math.abs(thetaDeg) <= (tol == null ? 0.5 : tol); }

  /* ---------------- 四、正负离子同时移动（易错点②） ---------------- */
  /* q₁ 沿电流方向（正离子）、q₂ 沿电流反方向（负离子）：取绝对值之和，不是相减 */
  function electrolyteCharge(q1, q2) { return Math.abs(q1) + Math.abs(q2); }
  /* 约定方向：正电荷定向移动方向为电流方向；负电荷反向移动与正向移动等效 */
  function directionByConvention(carrierSign, moveDir) { return carrierSign > 0 ? moveDir : -moveDir; }

  /* ---------------- 五、微观解释 I = neSv ---------------- */
  /* 载流子数密度：n = ρN_A / M */
  function carrierDensity(rho, M) { return rho * NA / M; }
  /* 铜的自由电子数密度（每个铜原子贡献一个自由电子） */
  function copperCarrierDensity() { return carrierDensity(RHO_CU, M_CU); }
  /* 定向移动速率 v = I /(neS) */
  function driftSpeed(I, n, S) { return I / (n * E_CHARGE * S); }
  /* 由微观量算电流 I = neSv */
  function currentFromDrift(n, S, v) { return n * E_CHARGE * S * v; }
  /* —— 动画用：把"真实漂移速率"映射成屏幕像素速度 ——
     物理量：v = I/(nqS)；因为真实 v 只有 10⁻⁵ m/s，屏幕上直接照搬看不出来，
     所以按"同一导体、同一微观参数"的**线性比例**放大：
        v_px/s = K_PX · v = K_PX · I/(nqS)
     即：像素速度与电流 I 严格成正比，且比值由 n、q、S 决定。
     I 加倍 ⇒ 屏幕上电荷点速度加倍；换导体（S、n 变）速度按 1/(nS) 变。 */
  var K_PX = 1;                                   // 像素·(s·m/s)⁻¹ 的比例常数，由场景给
  function driftPxPerSec(I, n, S, kpx) {
    return (kpx == null ? K_PX : kpx) * driftSpeed(I, n, S);
  }
  /* 一段时间内通过横截面的电荷量：q = It（用于画布内实时读数） */
  function passedCharge(I, t) { return I * t; }
  /* 当前动画时刻已通过横截面的电子数 */
  function passedElectrons(I, t) { return Math.abs(I) * t / E_CHARGE; }
  /* 四步推导链：一段导体中的电子柱 */
  function microChain(t, v, S, n) {
    var L = v * t;             // vt   —— 导体长度
    var Vol = S * L;           // Svt  —— 体积
    var N = n * Vol;           // nSvt —— 自由电子总数
    var q = N * E_CHARGE;      // neSvt—— 总电荷量
    return { L: L, Vol: Vol, N: N, q: q, I: t > 0 ? q / t : 0 };
  }
  /* 电子穿过一段导体所需时间（教材 P55 的“几个小时”） */
  function transitTime(L, v) { return v > 0 ? L / v : Infinity; }
  /* 电场建立的时间（以光速传播） */
  function fieldTime(L) { return L / C_LIGHT; }

  /* ---------------- 六、加速—碰撞（恒定电流的成因） ---------------- */
  function accel(E) { return E_CHARGE * E / M_E; }              // a = eE/m
  function peakSpeed(E, tau) { return accel(E) * (tau == null ? TAU_CU : tau); }
  function avgDrift(E, tau) { return 0.5 * peakSpeed(E, tau); }  // 半个周期的平均
  /* 稳态平均速率与时间无关 —— 本节的“恒定”依据 */
  function steadyAvg(t, E, tau) { return avgDrift(E, tau); }

  /* ---------------- 六·B 恒压电源（本课的前提）----------------
     本课面对的是**恒定电源**：两极间电压 U 由电源维持、不随时间变化。
     于是电路里的一切都是"被 U 决定"的，而不是反过来：
         U（电源给的，可调） → I = U/R（电路自己决定的） → v = I/(nqS)（微观）
     这些函数把这条链写死，任何画面都必须走这条链，不许再"凭空给电流"。
  */
  /* 一段导体的电阻：R = ρL/S（用于把 U 与 I 连起来） */
  function resistance(rho, L, S) { return rho * L / S; }
  /* 恒压源下的电流：I = U/R */
  function currentFromU(U, R) { return R > 0 ? U / R : 0; }
  /* 恒压源下，导体内场强：E = U/L（匀强，恒定） */
  function fieldFromU(U, L) { return L > 0 ? U / L : 0; }
  /* 恒压源下，极板（电极）上的电荷量：Q = C·U —— U 变，Q 就跟着变 */
  function electrodeCharge(C, U) { return C * U; }
  /* 恒定电流的判据：U 不变且 R 不变 ⇒ I 不随时间变化 */
  function isSteady(U, R, t1, t2) { return currentFromU(U, R) === currentFromU(U, R); }
  /* 一段导线内部为维持恒定电流所需的"搬运"速率 —— 就是导线里的电流本身。
     注意：它不是外部可调的旋钮；电源只是把电子搬回去，搬多快由电路决定。 */
  function pumpRateEquals(I) { return I; }

  /* ---------------- 六·C 方向判定（恒定电场里的三件事必须自洽）----------------
     参考约定：
       · 电流方向 = 正电荷定向移动的方向（人为约定）
       · 导体内部电场 E 的方向 = 高电势 → 低电势
       · 正电荷受力沿 E 方向（顺电场走）；负电荷受力逆 E（逆电场走）
     所以同一根导线里：
         电流 I 的方向  ==  E 的方向  ==  正电荷运动方向
         自由电子（负电荷）运动方向  ==  -E  ==  与电流反向
     电解液里：
         正离子顺着 E 走，负离子逆着 E 走 —— 但两者形成的电流方向**相同**（都沿 E）
  */
  /* 电流方向与电场方向的关系：永远同向 */
  function currentDirAlongE() { return 1; }
  /* 给定 E 的方向（+1 向右 / -1 向左），返回载流子的运动方向 */
  function carrierDirBySign(sign, eDir) { return sign > 0 ? eDir : -eDir; }
  /* 电流方向（由正电荷定义）：始终沿 E */
  function currentDirFromE(eDir) { return eDir; }
  /* 一个载流子对电流的贡献方向：负电荷逆 E 运动，产生的电流仍沿 E */
  function contributionDir(sign, eDir) { return eDir; }
  /* 恒压源两端：正极（高电势）是电流流出的那一端 */
  function positiveTerminalSide(eDir) { return eDir > 0 ? 1 : -1; }
  /* 电解液里两种离子同号电流的合成：方向相同，大小相加 */
  function electrolyteCurrentDir(q1, q2, eDir) {
    /* q1 为正离子电荷量（>0）、q2 为负离子电荷量（<0），两者都沿 E 产生电流 */
    return eDir;
  }

  /* ---------------- 七、瞬间电流（电容器放电，环节①） ---------------- */
  function rcDecay(U0, R, C, t) { return U0 * Math.exp(-t / (R * C)); }
  function rcCurrent(U0, R, C, t) { return (U0 / R) * Math.exp(-t / (R * C)); }
  function tauRC(R, C) { return R * C; }
  /* 两极间电势差消失时，电流穿过的电荷总量 q = ∫I dt = U0·C */
  function dischargeTotalCharge(U0, C) { return U0 * C; }

  /* ---------------- 八、STSE：容量、续航 ---------------- */
  function capacityCharge(Ah) { return Ah * 3600; }                       // 1 A·h = 3600 C
  function dischargeCurrent(capC, tSec) { return tSec > 0 ? capC / tSec : 0; }
  /* 续航里程 s = v·t，t = q/I */
  function enduranceKm(kmh, capC, I) { return I > 0 ? kmh * (capC / I) / 3600 : 0; }
  /* 手机说明书：容量 4000 mA·h，待机 22 天 / 播放视频 17 h 的电流 */
  function standbyCurrent(mAh, hours) { return mAh / hours; }             // mA

  /* ---------------- 九、自检 ---------------- */
  function runSelfTest() {
    var R = [], fails = [];
    function chk(name, got, want, tol) {
      var ok = Math.abs(got - want) <= (tol == null ? 0 : tol);
      R.push({ name: name, got: got, want: want, ok: ok });
      if (!ok) fails.push(R[R.length - 1]);
    }
    function chkTrue(name, cond) {
      R.push({ name: name, got: !!cond, want: true, ok: !!cond });
      if (!cond) fails.push(R[R.length - 1]);

<script>/* =====================================================================
   viz_dc_anim.js —— 11.1 动画内核（时钟 / 入场节拍 / 自动演示 / 播放控制）

   为什么必须单独一层：
     电流的本质是"电荷的定向移动"，静态画面讲不了这件事 ——
     参考片 BV1fnxdziE14 的签名手法就是"每个概念一段小动画、元素逐步叠加"。
     本文件把它落成四样机制：

     ① 可冻结的时钟 AN.t —— 所有持续运动（电荷流动、波前推进、指针阻尼）
        都从它派生；
     ② 入场节拍器 AN.rise(起, 时长) —— 元素依次淡入浮起 = 逐步叠加；
     ③ 自动演示扫掠 AN.auto —— 把每一步的连续量按时间扫过；
     ④ **播放控制（要求①）**：暂停 = 时钟停 + rAF 停 ⇒ 画面冻结在当前帧；
        停止 = 暂停 + 时刻归零 + 通知外部复位状态 ⇒ 回到初始状态。

   铁律不变：物理仍由 viz_dc_physics.js 的纯函数决定，本层只管"何时画"。
   ===================================================================== */
(function (global) {
  'use strict';

  var AN = {
    t: 0,            // 全局时钟（秒）：持续运动的唯一时间源
    stepT: 0,        // 当前这一步的"龄"（秒）：入场叠加的唯一时间源
    playing: true,   // 自动播放（按钮可切）
    speed: 1,        // 播放倍速
    frozen: false,   // 验收用：冻结时钟 → 画面与时间无关（相位取固定常量）
    holdUntil: 0,    // 用户刚拖过 → 自动演示让位到这一刻（秒）
    autoU: 0,        // 当前这步的自动扫掠进度 0→1
    autoKey: '',     // 正在扫掠的连续量（换量时进度归零）
    raf: 0,          // rAF 句柄（暂停时取消）
    lastTs: 0,
    onFrame: null,   // 每帧回调（由 app 注入：推进自动演示 + 重绘）
    onStop: null     // 停止时的回调（由 app 注入：复位本步状态）
  };

  AN.reset = function () {
    AN.t = 0; AN.stepT = 0; AN.holdUntil = 0; AN.autoU = 0; AN.autoKey = '';
  };
  /* 时钟推进：只要暂停（playing=false）或冻结（frozen），就一格都不走。
     这是"暂停真正冻结当前帧"的根 —— 循环里调它，暂停时它直接返回。 */
  AN.tick = function (dt) {
    if (AN.frozen || !AN.playing) return;
    AN.t += dt; AN.stepT += dt;
  };

  /* ---------------- 播放控制（要求①：暂停真冻结、停止回初态） ---------------- */
  function nowMs() {
    return (global.performance && global.performance.now) ? global.performance.now() : Date.now();
  }
  function loop(ts) {
    AN.raf = global.requestAnimationFrame(loop);
    var dt = (ts - AN.lastTs) / 1000;
    AN.lastTs = ts;
    if (!isFinite(dt) || dt <= 0) dt = 1 / 60;
    if (dt > 0.1) dt = 0.1;                 // 切标签页回来别跳帧
    if (!AN.playing || AN.frozen) return;
    AN.tick(dt);
    if (AN.onFrame) AN.onFrame();
  }
  /* 起循环：只要循环在跑，暂停/继续都靠 playing 开关控制 */
  AN.startLoop = function () {
    if (AN.raf || !global.requestAnimationFrame) return;
    AN.lastTs = nowMs();
    AN.raf = global.requestAnimationFrame(loop);
  };
  AN.stopLoop = function () {
    if (AN.raf && global.cancelAnimationFrame) global.cancelAnimationFrame(AN.raf);
    AN.raf = 0;
  };
  /* 播放：时钟继续走，画面从当前帧接着动 */
  AN.play = function () {
    AN.playing = true;
    AN.startLoop();
    if (AN.onFrame) AN.onFrame();
  };
  /* 暂停：playing=false ⇒ loop 里 tick 与 onFrame 都不执行 ⇒ 当前帧被冻住。
     注意：不动 AN.t/AN.stepT —— 所以恢复播放时是"从暂停处接着走"。 */
  AN.pause = function () {
    AN.playing = false;
    if (AN.onFrame) AN.onFrame();          // 立刻重绘一次，把"已暂停"状态画出来
  };
  AN.togglePlay = function () { AN.playing ? AN.pause() : AN.play(); };
  /* 停止：暂停 + 时钟归零 + 入场节拍归零 + 通知外部复位 → 回到初始状态 */
  AN.stop = function () {
    AN.pause();
    AN.t = 0; AN.stepT = 99; AN.autoU = 0; AN.autoKey = ''; AN.holdUntil = 0;
    if (AN.onStop) AN.onStop();
    AN.playing = false;            /* 回调里可能被重新打开，这里再钉一次 */
    AN.t = 0; AN.stepT = 99;
    if (AN.onFrame) AN.onFrame();
  };
  AN.setSpeed = function (s) { AN.speed = s; };

  /* 冻结：验收时用一个固定时刻取像素指纹（默认 3 s —— 入场早走完、相位固定） */
  AN.freeze = function (sec) {
    AN.frozen = true; AN.playing = false;
    AN.t = sec == null ? 3 : sec;
    AN.stepT = 99;
    AN.stopLoop();
  };
  AN.thaw = function () {
    AN.frozen = false; AN.playing = true; AN.stepT = 99;
    AN.startLoop();
  };
  /* 进入新的一步：入场节拍从头开始，自动扫掠归零 */
  AN.beginStep = function () {
    if (!AN.frozen) AN.stepT = 0;
    AN.autoU = 0; AN.autoKey = '';
  };
  /* 用户刚动过手（拖动/点选/翻页）→ 自动演示让位一会儿，别跟人抢 */
  AN.hold = function (sec) { AN.holdUntil = AN.t + (sec == null ? 3.5 : sec); };
  AN.held = function () { return AN.t < AN.holdUntil; };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  AN.clamp = clamp;
  AN.wrap = function (x) { x = x % 1; return x < 0 ? x + 1 : x; };
  AN.lerp = function (a, b, u) { return a + (b - a) * u; };
  /* 平滑步进：用于所有淡入淡出，避免生硬的线性 */
  AN.smooth = function (u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
  /* 阻尼回弹：指针/读数"到位"的物理感（先冲过头再收回） */
  AN.settle = function (u) {
    u = clamp(u, 0, 1);
    if (u >= 1) return 1;
    return 1 - Math.exp(-6 * u) * Math.cos(9 * u);
  };

  /* 入场节拍：本步龄 atMs → atMs+durMs 之间，元素由 0 淡入到 1 */
  AN.rise = function (atMs, durMs) {
    if (AN.frozen) return 1;
    var d = durMs == null ? 420 : durMs;
    return AN.smooth((AN.stepT * 1000 - (atMs || 0)) / d);
  };
  /* 已经走完入场了吗（判定"要不要画"用，省性能） */
  AN.shown = function (atMs) {
    if (AN.frozen) return true;
    return AN.stepT * 1000 >= (atMs || 0);
  };

  /* ---------------- 自动演示：把这一步的连续量按时间扫过 ----------------
     配置形如 { key:'tn', from:0, to:1, dur:7, step:0.01 }
       · 单向循环：扫到 to 之后回到 from 重来（反向重来会让电子倒流，误导）
       · 用户在拖动这个量时不抢（hold 窗口内不动）
       · 暂停时不推进（playing=false 时直接返回） */
  AN.auto = function (cfg, st, onSet) {
    if (!cfg || AN.frozen || !AN.playing || AN.held()) return false;
    if (AN.autoKey !== cfg.key) { AN.autoKey = cfg.key; AN.autoU = 0; }
    AN.autoU += (cfg.dur ? 1 / cfg.dur : 0.15) * AN.speed * (1 / 60);
    if (AN.autoU >= 1) AN.autoU -= 1;
    var u = AN.smooth(AN.autoU);
    var v = cfg.from + (cfg.to - cfg.from) * u;
    if (cfg.step) v = Math.round(v / cfg.step) * cfg.step;
    v = Math.round(v * 1e6) / 1e6;
    if (st[cfg.key] === v) return false;
    st[cfg.key] = v;
    if (onSet) onSet(cfg.key);
    return true;
  };

  /* ---------------- 电流驱动（要求②）----------------
     电荷定向移动的速度必须由电流值决定：I = nqSv ⇒ v = I/(nqS)。
     本函数把物理速率换算成屏幕上的像素速率：
       v_px/s = kpx · v = kpx · I/(nqS)
     同一导体下 v_px ∝ I；I 加倍 ⇒ 屏幕上跑得加倍快；I = 0 ⇒ 完全静止。
     相位（0–1）由"走过的像素 ÷ 路径长度"给出，可直接喂给沿线布点的函数。 */
  AN.driftPhase = function (tSec, vPxPerSec, pathLenPx) {
    if (!pathLenPx || !isFinite(vPxPerSec)) return 0;
    return AN.wrap((tSec * vPxPerSec) / pathLenPx);
  };

  /* 兼容：没有动画时钟时（比如自检脚本里）一切退回"静止但正确" */
  global.DCANIM = AN;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* =====================================================================
   viz_dc_neutral.js —— 正负电荷相遇中和（要求③）

   物理：A 板带正电（+）、B 板带负电（−）。导线把两板连起来后，自由电子从 B 跑向 A；
        到达 A 板的电子与 A 板上的正电荷**相遇中和**，两者同时消失，A、B 的电荷量各减 1。
        中和产物是一个**中性粒子**（灰色，不带电），会从相遇点向外散开。

   表现：
     · 电子沿导线飞向 A 板（速度由电流 I 驱动）
     · 到达 A 板表面时，与最近的"未中和正电荷"结成一对
     · 该对消失 → 原位出现一个灰点（中性粒子）+ 一圈扩散环
     · 中性粒子缓慢上升/淡出，最后停住（留在画面上，可数出中和了多少对）

   状态约定（供渲染层只读）：
     pairs      已中和对数
     neutral[]  中性粒子 {x, y, born, r}
     plus[]     A 板上仍带正电的位置（未中和）
     minus[]    B 板上仍带负电的位置
   ===================================================================== */
(function (global) {
  'use strict';

  var NEUTRAL_LIFE = 2.6;      // 中性粒子淡出前的停留时长（秒）

  /* 由"已通过横截面的电荷量 q"算出应当中和的对数：
     n 对 = q / e  —— 每一对中和，正好搬运一个元电荷的电荷量。
     为了在课堂上看得清，屏幕上的对数按比例缩放（scale），但**比例关系严格**。 */
  function pairsFromCharge(q, scale) {

  /* =====================================================================

     ===================================================================== */
  /* 逐步叠加的通用包装：a 是入场进度（0→1） */

      if (flash > 0.05) {

        { formula: 'I = U / R' },
        { note: 'U 由电源给，I 由电路定', color: K.dim }
      ] : [
        { label: '问题', text: '怎么才能得到持续不断的电流？' },
        { label: '条件', text: '两极之间始终存在电势差' },
        { note: '（先别管它叫什么）' }
      ],
      rings: [[mx(L, 0.36), my(L, 0.66), (L.mx1 - L.mx0) * 0.30, (L.my1 - L.my0) * 0.20]]
    });
    var ax = mx(L, 0.16), bx1 = mx(L, 0.84), yT = my(L, 0.14), yB = my(L, 0.80);
    var ph = (L.my1 - L.my0) * 0.52, pcy = my(L, 0.34);
    var bw = (L.mx1 - L.mx0) * 0.24, bh = 46 * k, bcx = (ax + bx1) / 2;
    /* ① 骨架：两极板 + 回路导线（先立起来） */
    D(ctx, S.r0, function () {
      Z.plate(ctx, ax, pcy, 13 * k, ph, {});
      Z.plate(ctx, bx1, pcy, 13 * k, ph, {});
      Z.T(ctx, 'A', ax - 24 * k, pcy, { size: 24 * k });
      Z.T(ctx, 'B', bx1 + 24 * k, pcy, { size: 24 * k });
      Z.wirePath(ctx, [[ax, yT], [bx1, yT]], { w: 3 * k });
      Z.wirePath(ctx, [[ax, yT], [ax, pcy - ph / 2]], { w: 3 * k });
      Z.wirePath(ctx, [[bx1, yT], [bx1, pcy - ph / 2]], { w: 3 * k });
      Z.wirePath(ctx, [[ax, yB], [bx1, yB]], { w: 3 * k });
      Z.wirePath(ctx, [[ax, yB], [ax, pcy + ph / 2]], { w: 3 * k });
      Z.wirePath(ctx, [[bx1, yB], [bx1, pcy + ph / 2]], { w: 3 * k });
      /* 电池正极朝 A（A 带正电 = 电源的正极那一侧） */
      Z.battery(ctx, bcx, yB, bw, bh, { k: k, flip: true });
      Z.T(ctx, S.revealedP ? '电池（电源）' : '某种装置', bcx, yB + 40 * k, { size: 19 * k, align: 'center', color: K.dim });
      Z.T(ctx, '＋', ax + 26 * k, pcy - ph / 2 - 20 * k, { size: 22 * k, align: 'center', color: K.text });
      Z.T(ctx, '−', bx1 - 26 * k, pcy - ph / 2 - 20 * k, { size: 22 * k, align: 'center', color: K.dim });
    });
    /* ② 极板上的电荷（搬运够 = 不变；不够 = 一格一格掉） */
    D(ctx, S.r1, function () {
      Z.chargeColumn(ctx, ax - 12 * k, pcy - ph / 2 + 24 * k, pcy + ph / 2 - 24 * k, Math.max(1, S.nA), 'pos', { r: 4.6 * k });
      Z.chargeColumn(ctx, bx1 + 12 * k, pcy - ph / 2 + 24 * k, pcy + ph / 2 - 24 * k, Math.max(1, S.nB), 'neg', { r: 4.6 * k });
    });
    /* ③ 两套方向必须同时讲清（这是本节最容易错的地方）：
          · 外电路（上导线）：电子 B→A；**电流方向 A→B**（与电子相反）
          · 电源内部（下支路）：电子 A→装置→B（被电源搬回去）；电流方向 B→A
         路径顺序一律按"电子真实运动方向"写，相位取正号 ⇒ 画面方向必然正确 */
    D(ctx, S.r2, function () {
      var dens = S.steady ? 6 : Math.max(2, Math.round(7 * Math.min(1, S.pumpSpeed / 1.0)));
      /* 外电路：电子 B → A */
      Z.chargeFlow(ctx, [[bx1, yT], [ax, yT]], dens, S.flowPhase, { kind: 'neg', r: 4.4 * k });
      Z.trailDot(ctx, [[bx1, yT], [ax, yT]], S.flowPhase, { r: 5, k: k });
      /* 电源内部：电子 A → 装置 → B */
      Z.chargeFlow(ctx, [[ax, yB], [bcx - bw / 2, yB]], 3, S.pumpPhase, { kind: 'neg', r: 4.4 * k });
      Z.chargeFlow(ctx, [[bcx + bw / 2, yB], [bx1, yB]], 3, S.pumpPhase, { kind: 'neg', r: 4.4 * k });
      /* 电流方向：外电路 A→B（标在上导线），电源内部 B→A（标在下支路） */
      Z.T(ctx, '电流方向 →', (ax + bx1) / 2, yT - 24 * k, { size: 18 * k, align: 'center', color: K.negHi });
      Z.T(ctx, '← 内部电流方向', (ax + bx1) / 2, yB - 26 * k, { size: 18 * k, align: 'center', color: K.negHi });
      Z.T(ctx, '电子 B → A', (ax + bx1) / 2, yT + 22 * k, { size: 17 * k, align: 'center', color: K.neg });
      /* 搬运速率指示：装置处一圈随搬运速率变强的光晕 */
      if (S.Isteady > 0.02) {
        var g = ctx.createRadialGradient(bcx, yB, 0, bcx, yB, bw * 0.75);
        g.addColorStop(0, 'rgba(95,196,238,' + (0.26 * Math.min(1, S.Isteady / 4)).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save(); ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(bcx, yB, bw * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    });
    /* ④ 稳态判据打在画面上 */
    D(ctx, S.r3, function () {
      /* 恒压源：电源维持 U，电流由 U/R 决定 —— 这句话必须打在主画面上 */
      Z.T(ctx, 'U = ' + P.fmt(S.U, 1) + ' V（电源维持） · I = U/R = ' + P.fmt(S.Isteady, 2) + ' A（电路决定）',
        mx(L, 0.5), my(L, 0.93), { size: 19 * k, align: 'center', color: K.text });
    });
  }

  /* =====================================================================
     场景 4 · 抽水机类比（环节②）
     ===================================================================== */
  function scPump(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '抽水机维持水位差，电源维持电势差', en: 'Only the gap is analogous',
      card: [
        { label: '抽水机', text: '搬水，维持水位差' },
        { label: '电源', text: '搬电荷，维持电势差', color: K.neg },
        { note: '共同内核只有一条：维持差额' },
        { note: '对象不同、差额不同 —— 不能等同', color: K.dim }
      ],
      rings: [[mx(L, 0.0), my(L, 0), (L.mx1 - L.mx0) * 0.44, (L.my1 - L.my0)],
              [mx(L, 0.52), my(L, 0), (L.mx1 - L.mx0) * 0.46, (L.my1 - L.my0)]]
    });
    /* 左：两个水池 + 泵 */
    var lx = mx(L, 0.20), hiY = my(L, 0.10), loY = my(L, 0.72), tw = (L.mx1 - L.mx0) * 0.30;
    Z.wirePath(ctx, [[lx - tw / 2, hiY], [lx + tw / 2, hiY], [lx + tw / 2, hiY + 54 * k], [lx - tw / 2, hiY + 54 * k], [lx - tw / 2, hiY]], { w: 2.4 * k });
    Z.wirePath(ctx, [[lx - tw / 2, loY], [lx + tw / 2, loY], [lx + tw / 2, loY + 54 * k], [lx - tw / 2, loY + 54 * k], [lx - tw / 2, loY]], { w: 2.4 * k });
    Z.T(ctx, '高水位', lx, hiY - 22 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.T(ctx, '低水位', lx, loY + 76 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.wirePath(ctx, [[lx + tw / 2, hiY + 27 * k], [lx + tw * 0.95, hiY + 27 * k], [lx + tw * 0.95, loY + 27 * k], [lx + tw / 2, loY + 27 * k]], { w: 2.6 * k });
    D(ctx, S.r2, function () {
      var pipe = [[lx + tw / 2, hiY + 27 * k], [lx + tw * 0.95, hiY + 27 * k], [lx + tw * 0.95, loY + 27 * k]];
      Z.chargeFlow(ctx, pipe, 7, S.advPhase, { kind: 'neg', r: 4.4 * k });
      Z.trailDot(ctx, pipe, S.advPhase, { r: 5, k: k });
      /* 泵的转子：一圈随流量变快的光环 */
      Z.burst111(ctx, lx + tw * 0.95, (hiY + loY) / 2, Z2.wrap(S.anim && !S.frozen ? S.T / 1.4 : 0.42), { r: 30, color: K.negHi, k: k, a: 0.35 });
    });
    Z.T(ctx, '抽水机', lx - tw * 0.72, (hiY + loY) / 2, { size: 20 * k, align: 'center', color: K.text });

    /* 右：电源回路（恒压源在左竖边，正极在上 = 高电势端） */
    var rx = mx(L, 0.76), ry1 = my(L, 0.20), ry2 = my(L, 0.72);
    Z.wirePath(ctx, [[rx - 84 * k, ry1], [rx + 84 * k, ry1], [rx + 84 * k, ry2], [rx - 84 * k, ry2], [rx - 84 * k, ry1]], { w: 3 * k });
    /* 电池竖放在左竖边：horiz=false ⇒ 正极朝上（高电势端） */
    Z.battery(ctx, rx - 84 * k, (ry1 + ry2) / 2, 92 * k, 34 * k, { k: k, horiz: false });
    Z.T(ctx, '电源', rx - 84 * k - 34 * k, (ry1 + ry2) / 2, { size: 20 * k, align: 'right', color: K.dim });
    Z.T(ctx, '高电势（+）', rx + 30 * k, ry1 - 20 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.T(ctx, '低电势（−）', rx + 30 * k, ry2 + 26 * k, { size: 19 * k, align: 'center', color: K.dim });
    /* 电源内部：正电荷从 −（下）被搬到 +（上）—— 这才是"维持差额"的动作 */
    Z.chargeFlow(ctx, [[rx - 84 * k, ry2 - 10 * k], [rx - 84 * k, ry1 + 10 * k]], 4, S.pumpPhase, { kind: 'pos', r: 4.4 * k, glow: false });
    /* 外电路：电子从 − 端出发，经右竖边回到 + 端（与电流方向相反） */
    Z.chargeFlow(ctx, [[rx - 84 * k, ry2], [rx + 84 * k, ry2], [rx + 84 * k, ry1], [rx - 84 * k, ry1]],
      7, S.flowPhase, { kind: 'neg', r: 4.0 * k });
    /* 电流方向（外电路）：从 + 端流出，沿外电路回到 − 端 */
    Z.T(ctx, '电流方向（外电路）', rx + 96 * k, (ry1 + ry2) / 2 - 10 * k, { size: 17 * k, align: 'left', color: K.negHi });
    Z.T(ctx, '电源内部：把正电荷从 − 搬到 +', rx - 84 * k - 92 * k, (ry1 + ry2) / 2 - 46 * k,
      { size: 17 * k, align: 'center', color: K.text });
  }

  /* =====================================================================
     场景 5 · 冲突：导线内部有没有电场（环节③）
     ===================================================================== */
  function scField(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '静电平衡时内部 E = 0，可电路里导线内部 E ≠ 0', en: 'A cognitive conflict',
      card: [
        { label: '静电平衡', text: '内部 E = 0，无定向移动' },
        { label: '电路中', text: '内部 E ≠ 0，有定向移动', color: K.neg },
        { formula: 'E = U / L' },
        { note: '解法：不是"站住了"，是"队伍不停、队形不变"' }
      ],
      rings: [[mx(L, 0), my(L, 0.04), (L.mx1 - L.mx0) * 0.44, (L.my1 - L.my0) * 0.5],
              [mx(L, 0.52), my(L, 0.04), (L.mx1 - L.mx0) * 0.46, (L.my1 - L.my0) * 0.5]]
    });
    /* 左：静电平衡的导体（电荷"站住了"，一动不动） */
    var lx = mx(L, 0.22), ly = my(L, 0.26), bw = (L.mx1 - L.mx0) * 0.30, bh = 92 * k;
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[lx - bw / 2, ly - bh / 2], [lx + bw / 2, ly - bh / 2], [lx + bw / 2, ly + bh / 2], [lx - bw / 2, ly + bh / 2], [lx - bw / 2, ly - bh / 2]], { w: 2.6 * k });
      Z.T(ctx, '静电平衡：内部 E = 0', lx, ly, { size: 22 * k, align: 'center', color: K.text });
      Z.T(ctx, '电荷站住了（一动不动）', lx, ly + bh / 2 + 26 * k, { size: 19 * k, align: 'center', color: K.dim });
    });

    /* 右：电路中导线内部 E ≠ 0（同一批电荷，这次在动） */
    var rx = mx(L, 0.74), ry = my(L, 0.26), rw = (L.mx1 - L.mx0) * 0.42;
    D(ctx, S.r1, function () {
      Z.wirePath(ctx, [[rx - rw / 2, ry], [rx + rw / 2, ry]], { w: 4 * k });
      /* 电场箭头：带箭头头，方向明确（导线内 E 由高电势端指向低电势端） */
      for (var i = 0; i < 4; i++) {
        var xx = rx - rw / 2 + rw * (i + 0.5) / 4;
        Z.wirePath(ctx, [[xx - 20 * k, ry - 32 * k], [xx + 20 * k, ry - 32 * k]], { color: K.neg, w: 2.2 * k });
        Z.wirePath(ctx, [[xx + 8 * k, ry - 38 * k], [xx + 20 * k, ry - 32 * k], [xx + 8 * k, ry - 26 * k]], { color: K.neg, w: 2.2 * k });
      }
      Z.M(ctx, 'E', rx + rw / 2 + 26 * k, ry - 32 * k, { size: 26 * k, color: K.neg });
      Z.T(ctx, '电路中：内部 E ≠ 0', rx, ry + 42 * k, { size: 22 * k, align: 'center', color: K.neg });
    });
    D(ctx, S.r2, function () {
      /* 电子带负电 ⇒ 受力与 E 相反 ⇒ 沿 E 的反方向运动（E 向右，电子向左） */
      var ePath = [[rx + rw / 2, ry], [rx - rw / 2, ry]];
      Z.chargeFlow(ctx, ePath, 7, S.flowPhase, { kind: 'neg', r: 4.6 * k });
      Z.trailDot(ctx, ePath, S.flowPhase, { r: 5, k: k });
      Z.T(ctx, '电子（逆 E）', rx - rw / 2 - 8 * k, ry + 26 * k, { size: 17 * k, align: 'right', color: K.neg });
      Z.T(ctx, '电流方向（顺 E）', rx + rw / 2 + 8 * k, ry + 26 * k, { size: 17 * k, align: 'left', color: K.negHi });
    });

    Z.T(ctx, 'U = ' + P.fmt(S.Uwire, 1) + ' V，L = 0.10 m ⇒ E = ' + P.fmt(S.Ewire, 1) + ' V/m',
      mx(L, 0.5), my(L, 0.86), { size: 20 * k, align: 'center', color: K.dim });
  }

  /* =====================================================================
     场景 6 · 动态平衡：你来我走、分布不变（环节③）
     ===================================================================== */
  function scFlow(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '电荷"你来我走"，但各处的分布不变', en: 'Dynamic equilibrium',
      card: [
        { label: '有的', text: '流走了' },
        { label: '另外的', text: '又来补上' },
        { label: '结果', text: '各处电荷量保持不变', color: K.text },
        { formula: 'E 不随时间变化' },
        { note: '⇒ 恒定电场', color: K.text }
      ],
      rings: [[mx(L, 0), my(L, 0.14), (L.mx1 - L.mx0), (L.my1 - L.my0) * 0.6]]
    });
    var y = my(L, 0.36), x0 = mx(L, 0.02), x1 = mx(L, 0.98), hh = 46 * k;
    Z.wirePath(ctx, [[x0, y - hh], [x1, y - hh]], { w: 3 * k });
    Z.wirePath(ctx, [[x0, y + hh], [x1, y + hh]], { w: 3 * k });
    for (var i = 0; i <= 8; i++) {
      var xx = x0 + (x1 - x0) * i / 8;
      Z.wirePath(ctx, [[xx, y - hh], [xx, y - hh + 12 * k]], { color: 'rgba(255,255,255,0.5)', w: 1.6 * k });
      Z.wirePath(ctx, [[xx, y + hh], [xx, y + hh - 12 * k]], { color: 'rgba(255,255,255,0.5)', w: 1.6 * k });
    }
    D(ctx, S.r2, function () {
      Z.chargeFlow(ctx, [[x1, y], [x0, y]], 10, S.flowPhase, { kind: 'neg', r: 4.8 * k });
      /* 前后接力：同一时刻把"前面走的"和"后面补的"配对显示 —— 分布不变就是这个意思 */
      var u = S.anim && !S.frozen ? Z2.wrap(S.T * 0.34) : 0.17;
      for (var q = 0; q < 5; q++) {
        var uu = Z2.wrap(u + q * 0.2);
        var p1 = Z.pathAt([[x1, y], [x0, y]], uu);
        var p2 = Z.pathAt([[x1, y], [x0, y]], Z2.wrap(uu + 0.5));
        ctx.save(); ctx.globalAlpha = 0.5;
        ctx.strokeStyle = K.negHi; ctx.lineWidth = 1.2 * k;
        ctx.beginPath(); ctx.moveTo(p1.x, y - hh + 6 * k); ctx.lineTo(p2.x, y - hh + 6 * k); ctx.stroke();
        ctx.restore();
      }
      Z.T(ctx, '电子一直在换，但每个刻度处的分布不变', (x0 + x1) / 2, y + hh + 48 * k,
        { size: 20 * k, align: 'center', color: K.text });
    });
  }

  /* =====================================================================
     场景 7 · 加速—碰撞（环节③）
     ===================================================================== */
  function scSawtooth(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '加速—碰撞—加速—碰撞：平均速率不随时间变化', en: 'Accelerate then collide',
      card: [
        { label: '静电力', text: '促使电荷运动（加速）' },
        { label: '碰撞', text: '阻碍电荷运动（减速）', color: K.neg },
        { note: '两者都有作用' },
        { formula: 'v̄ 不随时间变化' },
        { note: 'U = ' + P.fmt(S.Useg, 2) + ' V ⇒ E = U/L = ' + P.fmt(S.EfieldV, 3) + ' V/m' },
        { note: '⇒ v̄ = ' + P.sci(S.vavg, 2) + ' m/s', color: K.text },
        { note: 'v̄ 不随时间变化 ⇒ 电流恒定', color: K.text }
      ],
      rings: [[mx(L, 0), my(L, 0.04), (L.mx1 - L.mx0), (L.my1 - L.my0) * 0.72]]
    });
    var ax = mx(L, 0.06), ay = my(L, 0.12), aw = (L.mx1 - L.mx0) * 0.86, ah = (L.my1 - L.my0) * 0.62;
    Z.wirePath(ctx, [[ax, ay + ah], [ax + aw, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.wirePath(ctx, [[ax, ay], [ax, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.M(ctx, 'v', ax - 16 * k, ay, { size: 24 * k, color: K.dim });
    Z.M(ctx, 't', ax + aw + 16 * k, ay + ah, { size: 24 * k, color: K.dim });
    var nSeg = 6, segW = aw / nSeg;
    var yMax = ay + ah - ah * 0.62 * S.vScale;
    /* ① 先画出锯齿（每一段 = 一次"加速 → 碰撞"） */
    D(ctx, S.r0, function () {
      ctx.save();
      ctx.strokeStyle = K.neg; ctx.lineWidth = 2.6 * k; ctx.lineJoin = 'miter';
      ctx.beginPath();
      for (var i = 0; i < nSeg; i++) {
        var xa = ax + i * segW, xb = xa + segW;
        i ? ctx.lineTo(xa, ay + ah) : ctx.moveTo(xa, ay + ah);
        ctx.lineTo(xb, yMax);
        if (i < nSeg - 1) ctx.lineTo(xb, ay + ah);
      }
      ctx.stroke();
      ctx.restore();
    });
    var yAvg = ay + ah - ah * 0.31 * S.vScale;
    D(ctx, S.r1, function () {
      Z.wirePath(ctx, [[ax, yAvg], [ax + aw, yAvg]], { color: 'rgba(255,255,255,0.75)', w: 2.2 * k, dash: [7, 5] });
      Z.T(ctx, 'v̄', ax + aw + 24 * k, yAvg, { size: 22 * k, color: K.text });
    Z.T(ctx, 'U = ' + P.fmt(S.Useg, 1) + ' V（电源给）  ⇒  E = U/L = ' + P.fmt(S.EfieldV, 1) + ' V/m（决定的）',
      ax, ay - 26 * k, { size: 19 * k, color: K.dim });
    });
    /* ② 一个电子沿着锯齿轨迹反复跑：加速段越跑越快（点子间距变大），
          到折点"撞一下"（闪光 + 速度归零），再重新加速 —— 这就是 v̄ 不变的画面 */
    D(ctx, S.r2, function () {
      var u = S.anim && !S.frozen ? Z2.wrap(S.T * 0.42) : 0.30;
      var segIdx = Math.floor(u * nSeg), f = u * nSeg - segIdx;
      if (segIdx >= nSeg) segIdx = nSeg - 1;
      var xa = ax + segIdx * segW, xb = xa + segW;
      /* 加速段：位置按 f² 走（越到后面越快），这就是"加速"的直接证据 */
      var fx = f * f * 0.5 + f * 0.5;
      var px = xa + (xb - xa) * fx;
      var py = (ay + ah) - ((ay + ah) - yMax) * fx;
      /* 轨迹上的残影（最近经过的几段，用越来越淡的点表示） */
      for (var m = 5; m >= 1; m--) {
        var uu = Z2.wrap(u - m * 0.012);
        var si = Math.min(nSeg - 1, Math.floor(uu * nSeg)), ff = uu * nSeg - si;
        var fxx = ff * ff * 0.5 + ff * 0.5;
        ctx.save();
        ctx.globalAlpha = 0.45 * (1 - m / 6);
        ctx.fillStyle = K.neg;
        ctx.beginPath();
        ctx.arc(ax + si * segW + segW * fxx, (ay + ah) - ((ay + ah) - yMax) * fxx, 4.4 * k, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      Z.charge(ctx, px, py, 6.2 * k, 'neg', { color: '#FFFFFF' });
      /* ③ 折点碰撞：给一个明显的冲击波（"撞一下，速度归零"） */
      var sinceHit = f;                       /* 0 = 刚撞完 */
      if (sinceHit < 0.10) Z.burst111(ctx, xa, ay + ah, 1 - sinceHit / 0.10, { r: 26, color: K.negHi, k: k, a: 0.55 });
      Z.T(ctx, '加速 → 碰撞 → 加速 → 碰撞', (ax + ax + aw) / 2, ay + ah + 34 * k,
        { size: 20 * k, align: 'center', color: K.dim });
      Z.T(ctx, '每撞一次，速度归零重来 —— 平均速率才不变', (ax + ax + aw) / 2, ay + ah + 64 * k,
        { size: 19 * k, align: 'center', color: K.text });
    });
  }

  /* =====================================================================
     场景 8 · 电流表：示数恒定（环节③）
     ===================================================================== */
  function scAmmeter(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '串联一只电流表：读数保持恒定', en: 'Steady current',
      card: [
        { label: '定义', text: '大小、方向都不随时间变化' },
        { formula: 'I = ' + P.fmt(S.Iamm, 3) + ' A' },
        { note: '这一章研究的就是恒定电流' }
      ],
      rings: [[mx(L, 0.02), my(L, 0.10), (L.mx1 - L.mx0) * 0.96, (L.my1 - L.my0) * 0.62]]
    });
    var x0 = mx(L, 0.04), x1 = mx(L, 0.96), yT = my(L, 0.16), yB = my(L, 0.62);
    Z.wirePath(ctx, [[x0, yT], [x1, yT], [x1, yB], [x0, yB], [x0, yT]], { w: 3 * k });
    /* 电源竖放在左竖边：正极朝上（上边为高电势） */
    Z.battery(ctx, x0, (yT + yB) / 2, 92 * k, 34 * k, { k: k, horiz: false });
    Z.T(ctx, 'U = ' + P.fmt(S.Uamm, 1) + ' V', x0 - 62 * k, (yT + yB) / 2, { size: 20 * k, align: 'center', color: K.dim });
    Z.T(ctx, '＋', x0 - 26 * k, yT + 20 * k, { size: 20 * k, align: 'center', color: K.text });
    Z.T(ctx, '−', x0 - 26 * k, yB - 20 * k, { size: 20 * k, align: 'center', color: K.dim });
    /* 电流表 */
    var acx = mx(L, 0.5), acy = yB, r = 26 * k;
    D(ctx, S.r2, function () {
      ctx.save();
      ctx.beginPath(); ctx.arc(acx, acy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#0A0A0A'; ctx.fill();
      ctx.strokeStyle = K.neg; ctx.lineWidth = 2.6 * k; ctx.stroke();
      /* 指针阻尼摆动：先冲过去一点再收回 —— "稳定下来"这个过程本身有信息 */
      var settle = S.anim && !S.frozen ? (function () {
        var u = Z2.wrap(S.T / 3.2);
        return u < 0.5 ? (1 - Math.exp(-7 * u * 2) * Math.cos(9 * u * 2)) : 1;
      })() : 1;
      var a0 = Math.PI * 1.15, a1 = Math.PI * 1.85;
      var a = a0 + (a1 - a0) * Z.clamp(!S.anim ? S.needle : S.needle * (0.35 + 0.65 * settle), 0, 1.1);
      ctx.strokeStyle = K.text; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.moveTo(acx, acy); ctx.lineTo(acx + r * 0.66 * Math.cos(a), acy + r * 0.66 * Math.sin(a)); ctx.stroke();
      ctx.restore();
      Z.T(ctx, 'A', acx, acy + r * 0.5, { size: 20 * k, align: 'center', color: K.text });
    });
    /* 电子：从电源 − 端出发 → 下边向右 → 右边向上 → 上边向左 → 回到 + 端
       （路径顺序 = 电子真实运动方向；电流方向与之相反） */
    D(ctx, S.r1, function () {
      var loop = [[x0, yB], [x1, yB], [x1, yT], [x0, yT]];
      Z.chargeFlow(ctx, loop, 12, S.flowPhase, { kind: 'neg', r: 4.4 * k });
      Z.trailDot(ctx, loop, S.flowPhase, { r: 5, k: k });
      Z.T(ctx, '电流方向：与电子相反（外电路 + → −）', (x0 + x1) / 2, yT - 26 * k,
        { size: 18 * k, align: 'center', color: K.negHi });
    });
  }

  /* =====================================================================
     场景 9 · 恒定电流 vs 交变电流（环节③）
     ===================================================================== */
  function scSteady(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: S.mode ? '恒定电流：大小、方向都不随时间变化' : '交变电流：大小、方向都在变',
      en: S.mode ? 'Steady current' : 'Alternating current',
      card: S.mode ? [
        { label: '恒定', text: 'I 不随时间变化', color: K.text },
        { label: '方向', text: '也不随时间变化' },
        { note: '判据：是否随时间变化' }
      ] : [
        { label: '交变', text: 'I 随时间变化', color: K.neg },
        { label: '方向', text: '也在变' }
      ],
      rings: [[mx(L, 0), my(L, 0.06), (L.mx1 - L.mx0), (L.my1 - L.my0) * 0.7]]
    });
    var ax = mx(L, 0.06), ay = my(L, 0.16), aw = (L.mx1 - L.mx0) * 0.86, ah = (L.my1 - L.my0) * 0.52;
    Z.wirePath(ctx, [[ax, ay + ah], [ax + aw, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.wirePath(ctx, [[ax, ay], [ax, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.M(ctx, 'I', ax - 16 * k, ay, { size: 24 * k, color: K.dim });
    Z.M(ctx, 't', ax + aw + 16 * k, ay + ah, { size: 24 * k, color: K.dim });
    var mid = ay + ah / 2;
    Z.wirePath(ctx, [[ax, mid], [ax + aw, mid]], { color: 'rgba(255,255,255,0.22)', w: 1.4 * k, dash: [5, 5] });
    if (S.mode === 1) {
      var lv = ay + ah * 0.16;
      D(ctx, S.r1, function () {
        ctx.save();
        ctx.strokeStyle = K.text; ctx.lineWidth = 2.8 * k;
        ctx.beginPath(); ctx.moveTo(ax, lv); ctx.lineTo(ax + aw, lv); ctx.stroke();
        ctx.restore();
        /* 恒定电流的画法：点子沿着水平线匀速前进，方向永远一致 */
        Z.chargeFlow(ctx, [[ax, lv], [ax + aw, lv]], 8, S.flowPhase, { kind: 'neg', r: 4.2 * k });
        Z.trailDot(ctx, [[ax, lv], [ax + aw, lv]], S.flowPhase, { r: 4.6, k: k });
        /* 方向箭头：永远指向右（正电荷的定向移动方向） */
        var hx = ax + aw * 0.98;
        Z.wirePath(ctx, [[hx - 22 * k, lv - 12 * k], [hx, lv], [hx - 22 * k, lv + 12 * k]], { w: 2.6 * k });
      });
    } else {
      D(ctx, S.r1, function () {
        ctx.save();
        ctx.strokeStyle = K.neg; ctx.lineWidth = 2.6 * k;
        ctx.beginPath();
        for (var i = 0; i <= 60; i++) {
          var t = i / 60, x = ax + aw * t, y = mid - Math.sin(t * Math.PI * 4) * ah * 0.36;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
        /* 一个点沿正弦来回跑：方向一会儿向右、一会儿向左 —— "方向也在变"看出来了 */
        var u = S.anim && !S.frozen ? Z2.wrap(S.T * 0.22) : 0.2;
        for (var m = 0; m < 14; m++) {
          var x = ax + aw * u, y = mid - Math.sin(u * Math.PI * 4) * ah * 0.36;
          var dx = Math.cos(u * Math.PI * 4) >= 0 ? 1 : -1;   // 当前朝哪边走
          ctx.save();
          ctx.globalAlpha = m === 0 ? 1 : 0.30 * (1 - m / 14);
          ctx.fillStyle = m === 0 ? '#FFFFFF' : K.neg;
          if (m === 0) { ctx.shadowColor = K.neg; ctx.shadowBlur = 10 * k; }
          ctx.beginPath(); ctx.arc(x - dx * m * aw * 0.012, y, 4.6 * k, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          u = Z2.wrap(u - dx * 0.012);
        }
      });
    }
  }

  /* =====================================================================
     场景 10 · I = q/t 定义（环节④）
     ===================================================================== */
  function scDefine(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '单位时间内通过横截面的电荷量越多，电流就越大', en: 'Electric current',
      card: [
        { label: '形成', text: '电荷的定向移动形成电流' },
        { label: '定义', text: '电荷量 q 与时间 t 的比值' },
        { formula: 'I = q / t' },
        { note: 'I 由 U/R 决定，不是旋钮', color: K.dim },
        { label: '单位', text: 'C/s ⇒ 安培（A）' }
      ],
      rings: [[mx(L, 0.30), my(L, 0.06), (L.mx1 - L.mx0) * 0.14, (L.my1 - L.my0) * 0.62]]
    });
    /* 导体：两条白线 + 横截面虚线 */
    var y = my(L, 0.34), x0 = mx(L, 0.02), x1 = mx(L, 0.98), hh = 46 * k;
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[x0, y - hh], [x1, y - hh]], { w: 3 * k });
      Z.wirePath(ctx, [[x0, y + hh], [x1, y + hh]], { w: 3 * k });
      var xc = (x0 + x1) / 2;
      Z.wirePath(ctx, [[xc, y - hh - 26 * k], [xc, y + hh + 26 * k]], { color: 'rgba(255,255,255,0.7)', w: 2 * k, dash: [7, 5] });
      Z.T(ctx, '横截面', xc, y - hh - 46 * k, { size: 20 * k, align: 'center', color: K.text });
    });
    /* 电子持续穿过横截面；每穿过一个就闪一下（q 就是数这个） */
    D(ctx, S.r1, function () {
      /* 电子向右跑（路径顺序 = 电子运动方向） */
      Z.chargeFlow(ctx, [[x0, y], [x1, y]], 9, S.flowPhase, { kind: 'neg', r: 4.8 * k });
      /* 电流方向与电子相反：向左 —— 必须显式标出来，否则学生会以为电流也是向右 */
      Z.wirePath(ctx, [[x1 - 40 * k, y - 56 * k], [x0 + 60 * k, y - 56 * k]], { color: K.negHi, w: 2.4 * k });
      Z.wirePath(ctx, [[x0 + 82 * k, y - 62 * k], [x0 + 60 * k, y - 56 * k], [x0 + 82 * k, y - 50 * k]], { color: K.negHi, w: 2.4 * k });
      Z.T(ctx, '电流方向（与电子相反）', (x0 + x1) / 2, y - 76 * k, { size: 18 * k, align: 'center', color: K.negHi });
      var xc = (x0 + x1) / 2;
      var u = S.anim && !S.frozen ? Z2.wrap(-S.T * 0.18) : 0.17;
      Z.burst111(ctx, xc, y, Z2.wrap(u * 9), { r: 26, color: K.negHi, k: k, a: 0.42 });
      Z.trailDot(ctx, [[x0, y], [x1, y]], S.flowPhase, { r: 5, k: k });
    });
    /* 时间条：随 t 生长，扫到 10 s 再从 1 s 重来（自动演示） */
    D(ctx, S.r2, function () {
      var barY = my(L, 0.80), barW = (L.mx1 - L.mx0) * 0.66;
      Z.wirePath(ctx, [[x0 + 20 * k, barY], [x0 + 20 * k + barW, barY]], { color: 'rgba(255,255,255,0.28)', w: 4 * k });
      Z.wirePath(ctx, [[x0 + 20 * k, barY], [x0 + 20 * k + barW * Math.min(1, S.tdefine / 10), barY]], { color: K.neg, w: 4 * k });
      Z.T(ctx, 't = ' + P.fmt(S.tdefine, 1) + ' s ｜ q = ' + P.fmt(S.qDefine, 3) + ' C ｜ n = ' + P.sci(S.nDefine, 2) + ' 个',
        x0 + 20 * k + barW + 24 * k, barY, { size: 20 * k, color: K.text });
    });
  }

  /* =====================================================================

    Z.T(ctx, '以及通过的电子数。', rx, ry + 106 * k, { size: 20 * k, color: K.dim });
    Z.M(ctx, 'q = 5.0×10⁻⁵ A × 3.2 s = 1.6×10⁻⁴ C', rx, ry + 162 * k, { size: 26 * k, color: K.text });
    Z.M(ctx, 'n = q/e = 1.0×10¹⁵ 个', rx, ry + 204 * k, { size: 26 * k, color: K.text });

  /* =====================================================================
     场景 12 · 横截面判据（环节④ 易错点①）
     ===================================================================== */
  function scCrossSec(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: S.isCross ? '垂直截面才是横截面（θ = 0°）' : '斜截面不是横截面：只有投影"数得到"电荷',
      en: 'Cross section',
      card: [
        { label: '判据', text: '必须垂直于电流方向' },
        { label: '不是', text: '与"是不是圆的"无关' },
        { formula: 'S有效 = S·cosθ' },
        { note: 'θ = ' + P.fmt(S.theta, 0) + '° ⇒ cosθ = ' + P.fmt(S.cosT, 3) }
      ],
      rings: [[mx(L, 0.02), my(L, 0.02), (L.mx1 - L.mx0) * 0.96, (L.my1 - L.my0) * 0.6]]
    });
    var y = my(L, 0.32), x0 = mx(L, 0.02), x1 = mx(L, 0.98), hh = 52 * k;
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[x0, y - hh], [x1, y - hh]], { w: 3 * k });
      Z.wirePath(ctx, [[x0, y + hh], [x1, y + hh]], { w: 3 * k });
    });
    D(ctx, S.r1, function () {
      Z.chargeFlow(ctx, [[x0, y], [x1, y]], 8, S.flowPhase, { kind: 'neg', r: 4.6 * k });
      Z.wirePath(ctx, [[x1 - 40 * k, y - hh - 60 * k], [x0 + 60 * k, y - hh - 60 * k]], { color: K.negHi, w: 2.4 * k });
      Z.wirePath(ctx, [[x0 + 82 * k, y - hh - 66 * k], [x0 + 60 * k, y - hh - 60 * k], [x0 + 82 * k, y - hh - 54 * k]], { color: K.negHi, w: 2.4 * k });
      Z.T(ctx, '电流方向（与电子相反）', (x0 + x1) / 2, y - hh - 80 * k, { size: 18 * k, align: 'center', color: K.negHi });
    });
    var xc = (x0 + x1) / 2, th = S.theta * Math.PI / 180;
    var dx = Math.tan(th) * hh * 0.85;
    var col = S.isCross ? K.text : K.neg;
    Z.wirePath(ctx, [[xc + dx, y - hh * 0.78], [xc - dx, y + hh * 0.78]], { color: col, w: 2.8 * k });
    Z.wirePath(ctx, [[xc, y - hh * 0.78], [xc, y + hh * 0.78]], { color: 'rgba(255,255,255,0.5)', w: 1.6 * k, dash: [6, 5] });
    Z.T(ctx, S.isCross ? '垂直截面（横截面）' : '斜截面 θ = ' + P.fmt(S.theta, 0) + '°',
      xc, y + hh + 40 * k, { size: 21 * k, align: 'center', color: col });
    /* 有效面积柱 */
    var bx = mx(L, 0.76), by = my(L, 0.12), bw = 40 * k, bh = (L.my1 - L.my0) * 0.52;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.4 * k;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = S.isCross ? 'rgba(255,255,255,0.22)' : 'rgba(46,159,208,0.34)';
    ctx.fillRect(bx, by + bh * (1 - S.cosT), bw, bh * S.cosT);
    ctx.restore();
    Z.T(ctx, '数得到的面积', bx + bw / 2, by - 22 * k, { size: 19 * k, align: 'center', color: K.dim });
  }

  /* =====================================================================
     场景 13 · 正负离子：等效不是抵消（环节④ 易错点②）
     ===================================================================== */
  function scElectrolyte(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: S.elecEquiv ? '等效：q = |q₁| + |q₂|（相加）' : '抵消：会算出"电流为零"（错）',
      en: 'Equivalent, not cancel',
      card: S.elecEquiv ? [
        { label: '正离子', text: '向右运动' },
        { label: '负离子', text: '向左运动', color: K.neg },
        { label: '结果', text: '两者形成的电流方向相同' },
        { formula: 'q = |q₁| + |q₂|' }
      ] : [
        { label: '若相消', text: '电解液通电时电流为零', color: K.neg },
        { note: '可电解液明明在导电 ⇒ 不能相消' }
      ],
      rings: [[mx(L, 0.02), my(L, 0.06), (L.mx1 - L.mx0) * 0.96, (L.my1 - L.my0) * 0.6]]
    });
    var x0 = mx(L, 0.04), x1 = mx(L, 0.96), y = my(L, 0.34), hh = 62 * k;
    /* ① 电解槽 + 两个电极：左 = 正极（高电势），右 = 负极（低电势）
          ⇒ 槽内电场 E 由左指向右（从 + 到 −） */
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[x0, y - hh], [x1, y - hh], [x1, y + hh], [x0, y + hh], [x0, y - hh]], { w: 2.6 * k });
      /* 电极板 */
      Z.plate(ctx, x0 + 6 * k, y, 9 * k, hh * 1.85, {});
      Z.plate(ctx, x1 - 6 * k, y, 9 * k, hh * 1.85, {});
      Z.T(ctx, '正极（+）', x0 + 8 * k, y - hh - 24 * k, { size: 19 * k, align: 'center', color: K.text });
      Z.T(ctx, '负极（−）', x1 - 8 * k, y - hh - 24 * k, { size: 19 * k, align: 'center', color: K.dim });
      /* 槽内电场方向：从正极指向负极 */
      for (var ei = 0; ei < 4; ei++) {
        var exx = x0 + (x1 - x0) * (ei + 1) / 5;
        Z.wirePath(ctx, [[exx - 18 * k, y - hh - 8 * k], [exx + 18 * k, y - hh - 8 * k]], { color: 'rgba(95,196,238,0.75)', w: 2 * k });
        Z.wirePath(ctx, [[exx + 6 * k, y - hh - 14 * k], [exx + 18 * k, y - hh - 8 * k], [exx + 6 * k, y - hh - 2 * k]], { color: 'rgba(95,196,238,0.75)', w: 2 * k });
      }

    });
    /* ② 两种离子的运动：正离子顺 E（向右）；负离子逆 E（向左）
          注意：两者运动方向相反，但**产生的电流方向相同**（都沿 E） */
    D(ctx, S.r1, function () {
      Z.chargeFlow(ctx, [[x0 + 34 * k, y - 26 * k], [x1 - 34 * k, y - 26 * k]], 6, S.flowPhase, { kind: 'pos', r: 5 * k, glow: false });
      Z.chargeFlow(ctx, [[x1 - 34 * k, y + 26 * k], [x0 + 34 * k, y + 26 * k]], 6, S.flowPhase, { kind: 'neg', r: 5 * k });
      Z.T(ctx, '正离子：顺着电场走 →', (x0 + x1) / 2 - 60 * k, y - 54 * k, { size: 19 * k, align: 'center', color: K.text });
      Z.T(ctx, '← 负离子：逆着电场走', (x0 + x1) / 2 + 60 * k, y + 54 * k, { size: 19 * k, align: 'center', color: K.neg });
    });

    D(ctx, S.r3, function () {

      Z.wirePath(ctx, [[x1 - 62 * k, yy - 11 * k], [x1 - 40 * k, yy], [x1 - 62 * k, yy + 11 * k]], { color: K.negHi, w: 2.4 * k });
      Z.T(ctx, '两股定向移动等效成同一股电流（方向相同）⇒ q = |q₁| + |q₂|', (x0 + x1) / 2, yy + 30 * k,
        { size: 20 * k, align: 'center', color: K.negHi });
    });
  }

  /* =====================================================================
     场景 14 · I = neSv 四步链（环节⑤）
     ===================================================================== */
  function scMicro(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: 'vt → Svt → nSvt → neSvt ⇒ I = neSv', en: 'Microscopic expression',
      card: [
        { label: 'vt', text: '导体的长度', color: S.chainOn > 0 ? K.text : K.dim },
        { label: 'Svt', text: '导体的体积', color: S.chainOn > 1 ? K.text : K.dim },
        { label: 'nSvt', text: '自由电子总数', color: S.chainOn > 2 ? K.text : K.dim },
        { label: 'neSvt', text: '总电荷量', color: S.chainOn > 3 ? K.text : K.dim },
        { formula: 'I = neSv' }
      ],
      rings: [[mx(L, 0.02), my(L, 0.10), (L.mx1 - L.mx0) * 0.96, (L.my1 - L.my0) * 0.5]]
    });
    var y = my(L, 0.34), xr = mx(L, 0.96), xe = mx(L, 0.60), hh = 48 * k, x0 = mx(L, 0.02);
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[x0, y - hh], [xr, y - hh]], { w: 3 * k });
      Z.wirePath(ctx, [[x0, y + hh], [xr, y + hh]], { w: 3 * k });
      Z.T(ctx, '横截面 S', xe, y - hh - 36 * k, { size: 19 * k, align: 'center', color: K.dim });
    });
    /* ① 电子柱随 t 生长：电子从右往左跑 ⇒ "t 时间内将通过横截面"的电子
          就是横截面**右侧**长度 vt 的那一段（t 越长、这段越长） */
    var xR = xe + (xr - xe) * Math.max(0.04, S.tFrac);
    D(ctx, S.r1, function () {
      ctx.save();
      ctx.fillStyle = 'rgba(46,159,208,0.14)';
      ctx.fillRect(xe, y - hh, xR - xe, hh * 2);
      ctx.restore();
      Z.wirePath(ctx, [[xe, y - hh - 16 * k], [xe, y + hh + 16 * k]], { color: K.neg, w: 2.2 * k });
      Z.M(ctx, 'vt', (xe + xR) / 2, y, { size: 30 * k, color: K.text });
      for (var i = 0; i < 5; i++) for (var j = 0; j < 3; j++) {
        Z.charge(ctx, xe + (xR - xe) * (i + 0.5) / 5, y - hh * 0.55 + j * hh * 0.55, 3.8 * k, 'neg', {});
      }
      Z.T(ctx, '电子 →', xe - 10 * k, y + hh + 30 * k, { size: 17 * k, align: 'right', color: K.neg });
    });
    /* ② 真正的主角：电子一个个穿过左端横截面（q 就是"数穿过去的电荷量"） */
    D(ctx, S.r2, function () {
      var seg = [[xr - 6 * k, y], [x0 + 6 * k, y]];
      Z.chargeFlow(ctx, seg, 12, S.flowPhase, { kind: 'neg', r: 4.2 * k });
      Z.trailDot(ctx, seg, S.flowPhase, { r: 5, k: k });
      /* 通过横截面的瞬间给一个计数闪光 */
      var u = S.anim && !S.frozen ? Z2.wrap(-S.T * 0.34) : 0.17;
      var p = Z.pathAt(seg, u);
      Z.burst111(ctx, p.x, p.y, Z2.wrap(u * 12), { r: 18, color: K.negHi, k: k, a: 0.4 });
    });
  }

  /* =====================================================================
     场景 15 · 铜导线里的电子跑多慢（环节⑤）

  function scDriftNum(ctx, W, H, S) {

  /* =====================================================================

  function scLightSpeed(ctx, W, H, S) {

    shell(ctx, W, H, S, L, {
      cn: '开关一合灯就亮：是电场建立得快，不是电子跑得快', en: 'Field propagates at c',

    D(ctx, S.r0, function () {
      /* 上：整条导线 + 电池（骨架） */
      Z.wirePath(ctx, [[x0, y], [x1, y]], { w: 3 * k });

      Z.wirePath(ctx, [[x0, y2], [x1, y2]], { w: 3 * k });

    });
    /* ① 上排：电场波前以光速从左铺到右 —— 循环一来一回，看得见"铺满"这个动作 */
    D(ctx, S.r1, function () {
      var u = S.anim && !S.frozen ? Z2.wrap(S.T / 2.4) : 0.85;
      Z.front(ctx, wire, u, { k: k, color: K.negHi, w: 3.2, r: 7 });
      Z.T(ctx, '电场以光速铺开（L/c = ' + P.sci(S.tField, 2) + ' s）',

    });
    /* ② 下排：电子只挪了一点点 —— 把真实位移夸张 10¹² 倍之后还是一个"几乎没动"的量 */
    D(ctx, S.r2, function () {
      var n = 9;
      for (var i = 0; i < n; i++) {
        var base = x0 + (x1 - x0) * (i + 0.5) / n;
        var wob = (S.anim && !S.frozen) ? Math.sin(S.T * 1.6 + i * 0.9) * 2.2 * k : 0;
        Z.charge(ctx, base + wob, y2, 4.6 * k, 'neg', { glow: i === 4 });
      }
      Z.T(ctx, '电子跑完这段路要 ' + P.fmt(S.tTransit / 3600, 2) + ' 小时',
        (x0 + x1) / 2, y2 - 44 * k, { size: 20 * k, align: 'center', color: K.text });

  /* =====================================================================
     场景 17 · 电池容量就是电荷量（环节⑥）
     ===================================================================== */
  function scCapacity(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '容量就是电池能输出的总电荷量 q', en: 'Battery capacity',
      card: [
        { label: '容量', text: P.fmt(S.capAh, 0) + ' A·h = ' + P.sci(S.capC, 3) + ' C' },
        { label: '单位', text: '1 A·h = 3600 C' },
        { formula: 'I = q / t' },
        { note: '放电 ' + P.fmt(S.capT, 1) + ' h ⇒ I = ' + P.fmt(S.Icap, 2) + ' A' },
        { note: '续航 s = vt = ' + P.fmt(S.rangeKm, 0) + ' km', color: K.text }
      ],
      rings: [[mx(L, 0.02), my(L, 0.06), (L.mx1 - L.mx0) * 0.42, (L.my1 - L.my0) * 0.36]]
    });
    /* 电池块 */
    var bx = mx(L, 0.20), by = my(L, 0.24);
    D(ctx, S.r0, function () {
      Z.battery(ctx, bx, by, (L.mx1 - L.mx0) * 0.30, 56 * k, { k: k });
      Z.T(ctx, '动力电池组', bx, by - 56 * k, { size: 21 * k, align: 'center', color: K.text });
    });
    /* 电量条：随放电进度一点点掉（循环），电流越大部分掉得越快 */
    var bw = (L.mx1 - L.mx0) * 0.34, barX = mx(L, 0.56), barY = my(L, 0.20);
    D(ctx, S.r1, function () {

      var soc = Z.clamp(S.soc * (1 - u), 0, 1);
      Z.wirePath(ctx, [[barX, barY], [barX + bw, barY]], { color: 'rgba(255,255,255,0.28)', w: 8 * k });
      Z.wirePath(ctx, [[barX, barY], [barX + bw * soc, barY]], { color: K.neg, w: 8 * k });
      Z.T(ctx, '放电进度 ' + Math.round(soc * 100) + '%', barX, barY - 26 * k, { size: 19 * k, color: K.dim });
      /* 掉的电荷：一个个从电池块往右滚出去（容量就是"能输出多少电荷"） */
      var out = [[bx + 30 * k, by], [barX + bw, by]];
      Z.chargeFlow(ctx, out, 5, S.flowPhase, { kind: 'neg', r: 4 * k });
    });
    /* 车 */
    var vx = mx(L, 0.20), vy = my(L, 0.62);
    Z.wirePath(ctx, [[vx, vy], [vx + 96 * k, vy], [vx + 84 * k, vy - 28 * k], [vx + 20 * k, vy - 28 * k], [vx, vy]], { w: 2.6 * k });
    ctx.save(); ctx.strokeStyle = K.text; ctx.lineWidth = 2.4 * k;
    ctx.beginPath(); ctx.arc(vx + 22 * k, vy + 8 * k, 9 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(vx + 72 * k, vy + 8 * k, 9 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    Z.T(ctx, '续航 ' + P.fmt(S.rangeKm, 0) + ' km', vx + 116 * k, vy - 12 * k, { size: 22 * k, color: K.text });
  }

  /* =====================================================================
     场景 18 · 因果链五格（环节⑦）
     ===================================================================== */
  function scChain(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, { card: false });
    shell(ctx, W, H, S, L, {
      cn: '一条因果链把全课串起来', en: 'Summary',
      legend: false,
      rings: [[mx(L, 0), my(L, 0), (L.mx1 - L.mx0), (L.my1 - L.my0)]]

    var items = ['电源搬运电荷', '两极电势差不变', '导体内部恒定电场', '定向移动＋碰撞', '恒定电流'];
    var x0 = mx(L, 0.06), bw = (L.mx1 - L.mx0) * 0.88, bh = (L.my1 - L.my0) * 0.155;
    /* 格间传递脉冲：一格一格往下串 —— "因果链"这个词，本身就是一个过程 */
    if (S.anim && !S.frozen) {
      var uu = Z2.wrap(S.T * 0.5) * 5;

      if (gi < 4) {

    for (var i = 0; i < items.length; i++) {

      ctx.strokeRect(x0, y, bw, bh);

      if (on && i === S.chainP - 1 && S.anim && !S.frozen) {

        ctx.fillStyle = K.neg; ctx.fillRect(x0, y, bw, bh);
      }
      ctx.restore();
      Z.T(ctx, String(i + 1), x0 + 34 * k, y + bh / 2, { size: 26 * k, align: 'center', color: on ? K.neg : 'rgba(255,255,255,0.35)' });
      Z.T(ctx, items[i], x0 + 68 * k, y + bh / 2, { size: 26 * k, color: on ? K.text : 'rgba(255,255,255,0.4)' });
    }
  }

  var SCENES = {
    intro: scIntro, transient: scTransient, source: scSource, pump: scPump,

    o.Npass = P.passedElectrons(o.I_now, tt);       // 已通过横截面的电子数
    /* 中和进度：两板原有电荷量对应 q0 = U₀·C，通过 q 之后就中和了 q/q0 */
    var q0 = P.dischargeTotalCharge(s.U0, C_SYS);
    o.neutralProg = NU ? NU.progress(o.qPass, q0) : 0;
    o.n0 = 6;
    o.neutralPairs = Math.round(o.n0 * o.neutralProg);
    o.finished = o.neutralProg > 0.995;
    /* 中性粒子：随中和**逐个累积**（每个记下自己的出生时刻 → 扩散环与淡出各自独立） */
    o.neutrals = syncNeutrals(o.neutralPairs, o.animT, NU);
    /* 动画时刻与"是否在动"（暂停时用冻结的时刻取相位） */
    o.animT = A ? A.t : 0;
    o.animOn = !!(A && !A.frozen && A.playing);
    o.playing = !!(A && A.playing);

    /* —— 恒压电源（要求：本课面对的是恒定电源，U 不变）——
       链路写死：U（电源维持） → I = U/R（电路决定） → v = I/(nqS)（微观）
       图象上的一切都从这条链上取，不许再"凭空给电流 / 给搬运速率"。 */
    o.U = s.eV;                                     // 两极电压（由电源维持）
    o.R = s.eR;                                     // 外电路电阻
    o.EfieldSrc = P.fieldFromU(s.eV, L_SEG);        // 极板间场强 E = U/L
    o.Qplate = P.electrodeCharge(C_SYS, s.eV);      // 极板电荷量 Q = C·U（随 U 变！）
    o.Isteady = P.currentFromU(s.eV, s.eR);         // 电流 I = U/R（电路决定）
    o.pumpSpeed = o.Isteady;                        // "搬运速率"就是导线里的电流本身
    o.nA = Math.max(1, Math.round(6 * clamp(s.eV / 12, 0.25, 1)));
    o.nB = o.nA;
    o.I = o.Isteady;
    o.steady = true;                                // 恒压源 + 定值电阻 ⇒ 电流恒定
    o.sparkOn = s.spark < 0.05 ? 0 : Math.min(1, 0.35 + 0.65 * s.spark);

    /* —— 导线内部场强 —— */
    o.Ewire = s.Uwire / L_SEG;
    /* —— 电流表 —— */
    o.Iamm = s.Uamm / R_LAMP;
    o.needle = clamp(o.Iamm / 3, 0, 1);

    /* —— 步 8：动态平衡（电压 → 内部场强 → 电子速率）—— */
    o.fU = s.fU;
    o.fE = P.fieldFromU(s.fU, L_SEG);               // E = U/L
    o.fI = P.currentFromU(s.fU, FIX_R);             // I = U/R（R 取固定值）
    /* —— 步 9：加速—碰撞（电压 → 场强，而不是直接给 E）—— */
    o.Useg = s.Useg;
    o.EfieldV = P.fieldFromU(s.Useg, L_ACC);        // E = U/L（这段导线 L=100 m）
    o.EfieldmV = o.EfieldV * 1000;                  // 显示用 mV/m
    o.aAcc = P.accel(o.EfieldV);
    o.vpeak = P.peakSpeed(o.EfieldV);
    o.vavg = P.avgDrift(o.EfieldV);
    o.vScale = clamp(s.Efield / 50, 0.28, 1);

    /* —— 步 12 定义式：电流由 U/R 决定，不是凭空给的 —— */
    o.dU = s.dU; o.dR = s.dR;
    o.Idefine = P.currentFromU(s.dU, s.dR);         // I = U/R
    o.qDefine = P.charge(o.Idefine, s.tdefine);
    o.nDefine = P.electrons(o.qDefine);

    /* —— 单位 —— */
    var uname = ['A', 'mA', 'μA'][s.unitIdx] || 'A';
    o.unitName = uname;
    o.Iampere = P.toAmpere(s.Iunit, uname);

    /* —— 横截面 —— */
    o.cosT = P.crossFactor(s.theta);
    o.isCross = P.isCrossSection(s.theta);

    /* —— 电解液 —— */
    o.qsum = P.electrolyteCharge(s.q1, -s.q2);

    /* —— 微观链 —— */
    o.chainOn = Math.min(4, Math.floor(s.tFrac * 4) + 1);

    /* —— 算例 —— */
    o.nCu = P.copperCarrierDensity();
    o.cU = s.cU; o.Idrift = P.currentFromU(s.cU, FIX_R);   // 电流由电压决定
    o.vDrift = P.driftSpeed(o.Idrift, o.nCu, 1e-6);
    o.tTransit = P.transitTime(1, o.vDrift);

    /* —— 灯立刻亮 —— */
    o.Lwire = Math.pow(10, s.lenL);
    o.tField = P.fieldTime(o.Lwire);
    o.tTransit2 = P.transitTime(o.Lwire, P.driftSpeed(1, o.nCu, 1e-6));
    o.tTransit = o.tTransit2;

    /* —— STSE —— */
    o.capC = P.capacityCharge(s.capAh);
    o.tSec = s.capT * 3600;
    o.Icap = P.dischargeCurrent(o.capC, o.tSec);
    o.rangeKm = P.enduranceKm(s.kmh, o.capC, o.Icap);
    o.soc = 0.72;

    /* ===== 各场景的电流 → 屏幕像素速度（要求②的统一入口）=====
       v = I/(nqS)  →  v_px = K_VIEW·v  ⇒  同一导体下 v_px 严格 ∝ I。
       每个场景用它自己的电流：放电电流、装置搬运速率、电压除以电阻、设定电流…… */
    var scn = STEPS[s.step].scene;
    var Iscene;
    switch (scn) {
      case 'transient': Iscene = o.I; break;
      case 'source':    Iscene = o.Isteady; break;
      case 'pump':      Iscene = s.flowq; break;
      case 'field':     Iscene = s.Uwire / 2; break;      // U 越大 → 漂移越快
      case 'flow':      Iscene = o.fI; break;
      case 'sawtooth':  Iscene = P.currentFromU(s.Useg, FIX_R); break;
      case 'ammeter':   Iscene = o.Iamm; break;
      case 'define':    Iscene = o.Idefine; break;
      case 'units':     Iscene = o.Iampere > 0 ? Math.max(0.05, Math.min(o.Iampere, 3)) : 1; break;
      case 'micro':     Iscene = o.Idrift; break;
      case 'driftnum':  Iscene = o.Idrift; break;
      case 'lightspeed': Iscene = 1; break;
      case 'capacity':  Iscene = Math.min(o.Icap / 12, 2); break;   // 宏观放电电流折算到可见量级
      default:          Iscene = 1;
    }
    o.Iscene = Iscene;
    o.vDrift = Iscene > 0 ? P.driftSpeed(Iscene, nCu, 1e-6) : 0;        // 真实物理速率
    var raw = Iscene > 0 ? P.driftPxPerSec(Iscene, nCu, 1e-6, K_VIEW) : 0;
    o.vPxRaw = raw;                                                     // 未设下限（用于验证 ∝I）
    o.vPx = raw > 0 ? Math.min(V_PX_MAX, Math.max(V_PX_MIN, raw)) : 0;   // 屏幕速度（含上下限）

    /* ===== 相位（方向约定）=====
       相位**取正号**：点沿 pts 数组给出的顺序前进。
       所以每个场景只要把 pts 按"物理上该走的方向"写，画面方向就必然正确。
       （旧实现取负号，导致各场景方向随机地反掉 —— 这是本次修正的根因。） */
    var _vpr = o.vPxRaw;
    var _fwd = function (mult) {
      return (A && !A.frozen && _vpr > 0) ? A.wrap(T * _vpr / 700 * (mult || 1)) : PHASE;
    };
    o.flowPhase = _fwd(1);        // 导线里的电子（pts 按电子运动方向给）
    o.pumpPhase = _fwd(1.5);      // 电源内部的搬运（同向、略快，表示"从后面推"）
    o.wirePhase = _fwd(1);
    o.slowPhase = _fwd(0.5);
    o.advPhase  = _fwd(1);        // 抽水机 / 电解液

    /* —— 因果链 —— */
    o.chainP = s.chainP;
    /* —— 点选层状态（渲染层只读） —— */
    o.revealedP = CLICK.revealedP;
    o.whyCharge = CLICK.whyCharge;
    o.elecEquiv = CLICK.elecEquiv;
    o.lampOn = CLICK.lampOn;
    o.sparkPoke = CLICK.sparkPoke;
    o.cardVote = CLICK.cardVote;
    return o;
  }
  /* 中和粒子账本：每中和一对，就记一个中性粒子（含出生时刻与出生位置）
     · 对数增加 → 追加；换步/停止/复位 → 清空
     · 位置在 A 板表面按序号排开（确定性，取帧可复现） */
  var NEU = { list: [], born: [] };
  function syncNeutrals(want, nowT, NU) {
    if (!NU) return NEU.list;
    if (want < 0) want = 0;
    if (NEU.list.length > want) { NEU.list.length = want; }
    while (NEU.list.length < want) {
      var idx = NEU.list.length;
      /* 中和产物堆在 A 板外侧，纵向一列排开（能一眼数出中和了几对） */
      var np = NU.makeNeutral(-30 - (idx % 2) * 16, (idx - 2.5) * 30, nowT, idx, 4.4);
      np.side = -1;
      NEU.list.push(np);
    }
    return NEU.list;
  }
  function clearNeutrals() { NEU.list.length = 0; }

  function apply(s, i) {
    s.step = clamp(i, 0, STEPS.length - 1);
    for (var k in BASE) if (BASE.hasOwnProperty(k)) s[k] = BASE[k];
    var def = STEPS[s.step];
    if (def.init) def.init(s);
    resetClicks();
    clearNeutrals();               /* 换步 → 中和账本归零（回到初始状态） */
    S = derive(s);
    return S;
  }

  var cv = $('stage'), ctx = cv.getContext('2d');
  var lastFit = null;
  /* 画一帧：动画模式下每帧都会重进这里（相位随之推进） */
  function draw() {
    var def = STEPS[st.step];
    S = derive(st);
    S.bullets = def.bullets; S.caption = def.caption; S.captionEn = def.captionEn;
    S.tapList = (HD.HOTSPOTS[def.scene] || []);
    updatePanel(); markToc();          /* 先建控件 → 底栏高度定下来（避免画布慢一帧） */
    var f = R.fitCanvas(cv, ctx);
    lastFit = f;
    ctx.clearRect(0, 0, f.W, f.H);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, f.W, f.H);
    var scene = R.SCENES[def.scene];
    if (scene) scene(ctx, f.W, f.H, S);
    updateControls();
    return S;
  }

  /* ---------------- 动画循环：画面每帧跟着时钟走 ----------------
     电流是"电荷的定向移动"，静止的一帧讲不了它 —— 参考片那种
     "电子沿导线连续跑过去"的过程，只能由逐帧推进给出来。
     时钟冻结时（验收）不装这个循环，画面完全由状态决定。 */
  /* 帧循环交给动画内核（viz_dc_anim.js）：它自己管 rAF、暂停时整条循环停走。
     这里只负责"每帧做什么"——推进自动演示 + 重绘。 */
  var lastTs = 0;
  function startAnim() {
    var A = global.DCANIM;
    if (!A) return;
    A.onFrame = function () { autoDrive(); draw(); };
    A.onStop = function () { resetStep(); };
    A.startLoop();                  /* 循环常驻；跑不跑由 A.playing 决定 */
  }

  /* ---------------- 自动演示：每一步的连续量按规定节奏自己扫过 ----------------
     老师不拖，动画也在走；一动手（拖/点/翻页）就自动让位 3.5 s。
     from/to 只扫"单向过程"，扫到头从起点重来 —— 反着播会让电子倒流，误导。 */
  var AUTODRV = {
    intro:        { key: 'spark',   from: 0.15, to: 1,    dur: 6.5, step: 0.05 },
    transient:    { key: 'tn',      from: 0,    to: 1,    dur: 8,   step: 0.005 },
    source:       { key: 'eV',      from: 2,    to: 12,   dur: 9,   step: 0.5 },
    pump:         { key: 'flowq',   from: 0.25, to: 1,    dur: 7,   step: 0.01 },
    sourceAuto:   { key: 'eV',      from: 2,    to: 12,   dur: 9,   step: 0.5 },
    field:        { key: 'Uwire',   from: 1,    to: 10,   dur: 10,  step: 0.5 },
    ammeter:      { key: 'Uamm',    from: 0.5,  to: 5,    dur: 9,   step: 0.25 },
    define:       { key: 'tdefine', from: 1,    to: 10,   dur: 8,   step: 0.5 },
    units:        { key: 'Iunit',   from: 1,    to: 800,  dur: 9,   step: 0.1 },
    crosssec:     { key: 'theta',   from: 0,    to: 80,   dur: 9,   step: 1 },
    micro:        { key: 'tFrac',   from: 0.05, to: 1,    dur: 7,   step: 0.01 },
    driftnum:     { key: 'cU',     from: 0.5,  to: 6,    dur: 9,   step: 0.25 },
    lightspeed:   { key: 'lenL',    from: 0,    to: 3,    dur: 9,   step: 0.05 },
    capacity:     { key: 'capT',    from: 1,    to: 10,   dur: 9,   step: 0.5 }
  };
  function autoDrive() {
    var A = global.DCANIM;
    if (!A || A.frozen || !A.playing) return;
    if (mDown || A.held()) return;                 /* 手上有动作就不抢 */
    var cfg = AUTODRV[STEPS[st.step].scene];
    if (!cfg) return;
    A.auto(cfg, st, function (k) { syncCtrl(k); });
  }
  function syncCtrl(key) {
    var it = CTRL.items && CTRL.items[key];
    if (it && !it.toggle) it.inp.value = st[key];
  }

  function kv(k, v, c) {
    return '<div class="kv"><span>' + k + '</span><b' + (c ? ' style="color:' + c + '"' : '') + '>' + v + '</b></div>';
  }
  /* 右栏读数：按场景给该屏真正要看的量 */
  function readRows(x) {
    switch (STEPS[x.step].scene) {
      case 'intro': return [['火花放电', x.sparkOn > 0.02 ? '正在放电' : '等待'], ['小灯泡', '一直亮']];
      case 'transient': return [['两极电势差 U', P.fmt(x.U, 1) + ' V'], ['导线电流 I', P.fmt(x.I, 2) + ' A'],
        ['经过的电荷 q', P.fmt(x.qPass, 4) + ' C'], ['两极电荷量', x.nA + ' / 6 格']];
      case 'source': return [['电源电压 U', P.fmt(st.eV, 1) + ' V（由电源维持）'],
        ['外电路电阻 R', P.fmt(st.eR, 1) + ' Ω'],
        ['电流 I = U/R', P.fmt(x.Isteady, 2) + ' A（电路决定）'],
        ['极板电荷量 Q = CU', P.fmt(x.Qplate, 4) + ' C'],
        ['电子漂移速率 v', P.sci(x.vDrift, 2) + ' m/s']];
      case 'pump': return [['抽水流量', P.fmt(x.flowq, 2)], ['维持结果', '水位差 / 电势差 都不变']];
      case 'field': return [['导线两端电压 U', P.fmt(st.Uwire, 1) + ' V'], ['导线长度 L', '0.10 m'],
        ['内部场强 E = U/L', P.fmt(x.Ewire, 1) + ' V/m'], ['静电平衡时 E', '0（形成冲突）']];
      case 'flow': return [['电源电压 U', P.fmt(st.fU, 2) + ' V'], ['内部场强 E = U/L', P.fmt(x.fE, 1) + ' V/m'],
        ['电流 I = U/R', P.fmt(x.fI, 2) + ' A'], ['电荷分布', '始终不变']];
      case 'ammeter': return [['电源电压 U', P.fmt(st.Uamm, 1) + ' V'], ['电路总电阻', '2 Ω'],
        ['电流 I = U/R', P.fmt(x.Iamm, 3) + ' A'], ['电流表示数', '保持恒定']];
      case 'sawtooth': return [['导线两端电压 U', P.fmt(st.Useg, 2) + ' V（5 m 长的一段）'],
        ['场强 E = U/L', P.fmt(x.EfieldV, 3) + ' V/m'],
        ['加速度 a = eE/m', P.sci(x.aAcc, 2) + ' m/s²'],
        ['峰值速率 v_max', P.sci(x.vpeak, 2) + ' m/s'],
        ['平均速率 v̄', P.sci(x.vavg, 2) + ' m/s'],
        ['v̄ 随时间', '不变化（这就是"恒定"）']];
      case 'steady': return [['当前电流类型', x.mode === 1 ? '恒定电流' : '交变电流'], ['大小', x.mode === 1 ? '不随时间变化' : '随时间变化'],
        ['方向', x.mode === 1 ? '不随时间变化' : '随时间变化']];
      case 'define': return [['电源电压 U', P.fmt(st.dU, 2) + ' V'], ['外电阻 R', P.fmt(st.dR, 1) + ' Ω'],
        ['电流 I = U/R', P.fmt(x.Idefine, 2) + ' A'], ['时间 t', P.fmt(st.tdefine, 1) + ' s'],
        ['电荷量 q = It', P.fmt(x.qDefine, 3) + ' C'], ['电子数 n = q/e', P.sci(x.nDefine, 2) + ' 个']];
      case 'units': return [['当前单位', x.unitName], ['数值', P.fmt(st.Iunit, 2) + ' ' + x.unitName],
        ['换算为 A', P.sci(x.Iampere, 3) + ' A'], ['练习1 电荷量', '1.6×10⁻⁴ C'], ['练习1 电子数', '1.0×10¹⁵ 个']];
      case 'crosssec': return [['截面倾角 θ', P.fmt(st.theta, 0) + '°'], ['有效占比 cosθ', P.fmt(x.cosT, 3)],
        ['是否横截面', x.isCross ? '是' : '不是'], ['判据', '垂直于电流方向']];
      case 'electrolyte': return [['正离子 q₁', P.fmt(st.q1, 1) + ' C'], ['负离子 |q₂|', P.fmt(st.q2, 1) + ' C'],
        ['合计 q = |q₁|+|q₂|', P.fmt(x.qsum, 1) + ' C'], ['电流方向', '与正离子移动方向相同']];
      case 'micro': return [['时间 t 占比', P.fmt(st.tFrac, 2)], ['电子柱长度 vt', '已点亮 ' + x.chainOn + ' / 4 步'],
        ['n 的意义', '单位体积内的自由电子数']];
      case 'driftnum': return [['电源电压 U', P.fmt(st.cU, 2) + ' V'], ['电流 I = U/R', P.fmt(x.Idrift, 2) + ' A'], ['电子数密度 n', P.sci(x.nCu, 2) + ' m⁻³'],
        ['定向速率 v', P.sci(x.vDrift, 2) + ' m/s'], ['穿过 1 m 需', P.fmt(x.tTransit / 3600, 2) + ' 小时']];
      case 'lightspeed': return [['导线长度 L', P.fmt(x.Lwire, 0) + ' m'], ['电场建立 L/c', P.sci(x.tField, 2) + ' s'],
        ['电子跑完 L/v', P.fmt(x.tTransit / 3600, 2) + ' 小时'], ['两者相差', P.sci(x.tTransit / x.tField, 1) + ' 倍']];
      case 'capacity': return [['容量 q', P.sci(x.capC, 3) + ' C'], ['放电时间 t', P.fmt(st.capT, 1) + ' h'],
        ['电流 I = q/t', P.fmt(x.Icap, 2) + ' A'], ['车速 v', P.fmt(st.kmh, 0) + ' km/h'], ['续航 s = v·t', P.fmt(x.rangeKm, 0) + ' km']];
      case 'chain': return [['已点亮格数', P.fmt(st.chainP, 0) + ' / 5'], ['收束公式', 'I = q/t（拓展 I = neSv）']];
      default: return [];
    }
  }
  function updatePanel() {
    var def = STEPS[st.step];
    $('hTitle').textContent = def.title;
    $('hAct').textContent = S.actName;
    $('hCount').textContent = (st.step + 1) + ' / ' + STEPS.length;
    $('pNote').innerHTML = def.note;
    $('pFormula').innerHTML = def.formula;
    $('readout').innerHTML = readRows(S).map(function (r) { return kv(r[0], r[1]); }).join('');
    $('pHint').textContent = def.hint;
    /* 点选反馈区：点了什么、看到了什么 */
    var box = $('pClick');
    if (box) {
      if (CLICK.msg) {
        box.innerHTML = '<b style="color:' + (CLICK.kind === 'quiz' ? '#F0AC5F' : '#05E8FD') + '">' +
          ({ poke: '点了一下', reveal: '揭晓', pick: '选择', quiz: '判断' }[CLICK.kind] || '点选') +
          '</b><br>' + CLICK.msg;
        box.parentNode.style.display = '';
      } else {
        box.parentNode.style.display = 'none';
      }
    }
    /* 可点清单：这一步画布上有什么能点 */
    var hs = (HD.HOTSPOTS[def.scene] || []);
    var tip = hs.map(function (h) { return '· ' + h.label; }).join('<br>');
    var extra = EXTRA_BTNS[def.scene] ? '<br><span style="color:#8f8f8f">按钮带里还有：前概念卡片投票</span>' : '';
    $('pTap').innerHTML = hs.length ? (tip + extra) : '<span style="color:#8f8f8f">这一步以拖动为主，画布上没有可点对象</span>';
    buildControls(def);
    buildClickBar(def);
  }

  /* 按钮带：把这一步画布上能点的对象做成真按钮（老师上课不必去瞄画布） */
  var CBAR = {};
  function buildClickBar(def) {
    var hs = (HD.HOTSPOTS[def.scene] || []).slice();
    var ex = EXTRA_BTNS[def.scene] || [];
    var sig = st.step + '|' + hs.map(function (h) { return h.act; }).join(',') + '|' + ex.length;
    if (CBAR.sig === sig) return;
    CBAR.sig = sig;
    var host = $('clickbar');
    if (!host) return;
    host.innerHTML = '';
    hs.forEach(function (h) {
      var b = document.createElement('button');
      b.className = 'b tap';
      b.textContent = '● ' + h.label;
      b.title = h.note || '';
      b.addEventListener('click', function () {
        var fn = ACT[h.act];
        if (fn) fn(); else { CLICK.kind = 'poke'; CLICK.msg = h.note || ''; draw(); }
      });
      host.appendChild(b);
    });
    ex.forEach(function (e) {
      var b = document.createElement('button');
      b.className = 'b tap alt';
      b.textContent = e.label;
      b.addEventListener('click', e.act);
      host.appendChild(b);

    var allow = def.allow || {};

      CTRL.sig = sig;
      var host = $('controls');
      host.innerHTML = '';
      CTRL.items = {};
      keys.forEach(function (key) {
        var a = allow[key];
        var wrap = document.createElement('div');
        wrap.className = 'ctrl';
        if (a.kind === 'toggle') {
          wrap.innerHTML = '<label><span class="nm">' + a.label + '</span>' +
            '<span class="val" id="cv_' + key + '"></span></label>' +
            '<button class="b tg" id="ci_' + key + '">切换</button>';
          host.appendChild(wrap);
          var btn = wrap.querySelector('button');
          CTRL.items[key] = { a: a, inp: btn, out: wrap.querySelector('.val'), toggle: true };
          btn.addEventListener('click', function () { toggleParam(key); });
        } else {
          wrap.innerHTML = '<label><span class="nm">' + a.label + '</span>' +
            '<span class="val" id="cv_' + key + '"></span></label>' +
            '<input type="range" id="ci_' + key + '" min="' + a.min + '" max="' + a.max + '" step="' + a.step + '">';
          host.appendChild(wrap);
          var inp = wrap.querySelector('input');
          CTRL.items[key] = { a: a, inp: inp, out: wrap.querySelector('.val') };
          inp.addEventListener('input', function () { setParam(key, parseFloat(inp.value)); });
        }
      });
    }
    Object.keys(CTRL.items).forEach(function (key) {
      var it = CTRL.items[key];
      if (!it.toggle) it.inp.value = st[key];
      it.out.textContent = dispOf(key);
    });
  }
  function dispOf(key) {
    var it = CTRL.items[key];
    if (!it) return '';
    if (it.toggle) {
      if (key === 'unitIdx') return ['A', 'mA', 'μA'][st.unitIdx];
      return st[key] ? '恒定电流' : '交变电流';
    }
    var a = it.a, v = st[key], unit = a.unit ? ' ' + a.unit : '';
    switch (key) {
      case 'spark': return (v * 100).toFixed(0) + ' %';
      case 'flowq': return (v * 100).toFixed(0) + ' %';
      case 'tn': case 'driftPhase': case 'tFrac': return P.fmt(v, 2);
      case 'lenL': return '10^' + P.fmt(v, 2) + ' m';
      case 'chainP': return P.fmt(v, 0) + ' / 5';
      case 'theta': return P.fmt(v, 0) + '°';
      case 'U0': case 'Uwire': return P.fmt(v, 1) + ' V';
      case 'Efield': return P.fmt(v, 1) + ' mV/m';
      case 'pump': case 'Idrift': case 'Idefine': return P.fmt(v, 2) + ' A';
      case 'q1': case 'q2': return P.fmt(v, 1) + ' C';
      case 'capAh': return P.fmt(v, 0) + ' A·h';
      case 'capT': return P.fmt(v, 1) + ' h';
      case 'kmh': return P.fmt(v, 0) + ' km/h';
      case 'Uamm': return P.fmt(v, 1) + ' V';
      default: return P.fmt(v, a.step < 1 ? 2 : 0) + unit;

  function setByFraction(key, f, invert) {
    var a = (CTRL.items[key] || {}).a;
    if (!a || a.kind === 'toggle') return;
    var g = invert ? 1 - clamp(f, 0, 1) : clamp(f, 0, 1);
    var v = a.min + (a.max - a.min) * g;
    v = Math.round(v / a.step) * a.step;
    setParam(key, v);
  }

  function canvasClick(ev) {
    var r = cv.getBoundingClientRect();
    var u = (ev.clientX - r.left) / r.width;
    var v = (ev.clientY - r.top) / r.height;
    var h = HD.hit(STEPS[st.step].scene, u, v);
    if (!h) { CLICK.msg = ''; CLICK.kind = ''; updatePanel(); return; }
    var fn = ACT[h.act];
    if (fn) fn();
    else { CLICK.kind = 'poke'; CLICK.msg = h.note || ''; draw(); }
