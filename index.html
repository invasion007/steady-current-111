<script>/* =====================================================================
   viz_dc_physics.js —— 11.1 电源和电流 · 物理内核（纯函数，与画面完全解耦）
   依据：人教2019版必修第三册 P53–P56；教师用书 P73–P77；
        教案《11.1 电源和电流 · 教学设计》环节①—⑦
   约定：中学取值 e = 1.6×10⁻¹⁹ C，N_A = 6.02×10²³ mol⁻¹，c = 3.0×10⁸ m/s
   ===================================================================== */
(function (global) {
  'use strict';

  var E_CHARGE = 1.6e-19;      // 元电荷 (C)
  var C_LIGHT = 3.0e8;         // 电场建立速率 (m/s)
  var M_E = 9.11e-31;          // 电子质量 (kg)
  /* 铜中自由电子平均自由时间 (s)。取 4.858×10⁻¹⁴ s 的依据：
     1 m 铜导线（S = 1 mm²）通 1 A 时 v = I/(neS) = 7.47×10⁻⁵ m/s、E = 0.0175 V/m，
     由 v̄ = eEτ/(2m) 反解 τ = 2mv/(eE) = 4.858×10⁻¹⁴ s —— 让“加速—碰撞”模型与
     宏观的 I = neSv 在同一组数上自洽（见 runSelfTest 第 26 条断言）。 */
  var TAU_CU = 4.858e-14;
  var RHO_CU = 8.9e3;          // 铜密度 (kg/m³)
  var M_CU = 6.4e-2;           // 铜摩尔质量 (kg/mol)
  var NA = 6.02e23;            // 阿伏加德罗常数 (1/mol)

  /* ---------------- 数值格式（右栏读数用） ---------------- */
  function fmt(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x !== 0 && (Math.abs(x) < 1e-3 || Math.abs(x) >= 1e5)) return sci(x, n);
    return Number(x.toFixed(n)).toString();
  }
  function sci(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x === 0) return '0';
    var e = Math.floor(Math.log(Math.abs(x)) / Math.LN10);
    var m = x / Math.pow(10, e);
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return Number(m.toFixed(n)) + '×10' + sup(e);
  }
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function sup(n) {
    return String(n).split('').map(function (c) { return SUPS[c] || c; }).join('');
  }

  /* ---------------- 一、电流的定义式 I = q/t ---------------- */
  /* 通过横截面的电荷量 */
  function charge(I, t) { return I * t; }
  /* 电流（定义式）。t=0 视为无意义，按 0 处理避免除零 */
  function current(q, t) { return t > 0 ? q / t : 0; }
  /* 通过的电子个数（取电荷量绝对值） */
  function electrons(q) { return Math.abs(q) / E_CHARGE; }
  /* 由电流与时间反推电荷量（等价 charge） */
  function chargeFromCurrent(I, t) { return I * t; }

  /* ---------------- 二、单位换算 ---------------- */
  var UNITS = { 'A': 1, 'mA': 1e-3, 'μA': 1e-6 };
  function toAmpere(v, unit) { return v * (UNITS[unit] || 1); }
  function fromAmpere(I, unit) { return I / (UNITS[unit] || 1); }
  function convertUnit(v, from, to) { return v * (UNITS[from] || 1) / (UNITS[to] || 1); }

  /* ---------------- 三、横截面（易错点①） ---------------- */
  /* 面元与电流方向成 theta（度）时，真正“数得到电荷”的投影面积 */
  function effArea(S, thetaDeg) { return S * Math.abs(Math.cos(thetaDeg * Math.PI / 180)); }
  /* 同一段时间内，穿过斜截面被计入的电荷量之比 = cosθ */
  function crossFactor(thetaDeg) { return Math.abs(Math.cos(thetaDeg * Math.PI / 180)); }
  /* 判定：只有 θ = 0（截面垂直于电流方向）才是横截面 */
  function isCrossSection(thetaDeg, tol) { return Math.abs(thetaDeg) <= (tol == null ? 0.5 : tol); }

  /* ---------------- 四、正负离子同时移动（易错点②） ---------------- */
  /* q₁ 沿电流方向（正离子）、q₂ 沿电流反方向（负离子）：取绝对值之和，不是相减 */
  function electrolyteCharge(q1, q2) { return Math.abs(q1) + Math.abs(q2); }
  /* 约定方向：正电荷定向移动方向为电流方向；负电荷反向移动与正向移动等效 */
  function directionByConvention(carrierSign, moveDir) { return carrierSign > 0 ? moveDir : -moveDir; }

  /* ---------------- 五、微观解释 I = neSv ---------------- */
  /* 载流子数密度：n = ρN_A / M */
  function carrierDensity(rho, M) { return rho * NA / M; }
  /* 铜的自由电子数密度（每个铜原子贡献一个自由电子） */
  function copperCarrierDensity() { return carrierDensity(RHO_CU, M_CU); }
  /* 定向移动速率 v = I /(neS) */
  function driftSpeed(I, n, S) { return I / (n * E_CHARGE * S); }
  /* 由微观量算电流 I = neSv */
  function currentFromDrift(n, S, v) { return n * E_CHARGE * S * v; }
  /* 四步推导链：一段导体中的电子柱 */
  function microChain(t, v, S, n) {
    var L = v * t;             // vt   —— 导体长度
    var Vol = S * L;           // Svt  —— 体积
    var N = n * Vol;           // nSvt —— 自由电子总数
    var q = N * E_CHARGE;      // neSvt—— 总电荷量
    return { L: L, Vol: Vol, N: N, q: q, I: t > 0 ? q / t : 0 };
  }
  /* 电子穿过一段导体所需时间（教材 P55 的“几个小时”） */
  function transitTime(L, v) { return v > 0 ? L / v : Infinity; }
  /* 电场建立的时间（以光速传播） */
  function fieldTime(L) { return L / C_LIGHT; }

  /* ---------------- 六、加速—碰撞（恒定电流的成因） ---------------- */
  function accel(E) { return E_CHARGE * E / M_E; }              // a = eE/m
  function peakSpeed(E, tau) { return accel(E) * (tau == null ? TAU_CU : tau); }
  function avgDrift(E, tau) { return 0.5 * peakSpeed(E, tau); }  // 半个周期的平均
  /* 稳态平均速率与时间无关 —— 本节的“恒定”依据 */
  function steadyAvg(t, E, tau) { return avgDrift(E, tau); }

  /* ---------------- 七、瞬间电流（电容器放电，环节①） ---------------- */
  function rcDecay(U0, R, C, t) { return U0 * Math.exp(-t / (R * C)); }
  function rcCurrent(U0, R, C, t) { return (U0 / R) * Math.exp(-t / (R * C)); }
  function tauRC(R, C) { return R * C; }
  /* 两极间电势差消失时，电流穿过的电荷总量 q = ∫I dt = U0·C */
  function dischargeTotalCharge(U0, C) { return U0 * C; }

  /* ---------------- 八、STSE：容量、续航 ---------------- */
  function capacityCharge(Ah) { return Ah * 3600; }                       // 1 A·h = 3600 C
  function dischargeCurrent(capC, tSec) { return tSec > 0 ? capC / tSec : 0; }
  /* 续航里程 s = v·t，t = q/I */
  function enduranceKm(kmh, capC, I) { return I > 0 ? kmh * (capC / I) / 3600 : 0; }
  /* 手机说明书：容量 4000 mA·h，待机 22 天 / 播放视频 17 h 的电流 */
  function standbyCurrent(mAh, hours) { return mAh / hours; }             // mA

  /* ---------------- 九、自检 ---------------- */
  function runSelfTest() {
    var R = [], fails = [];
    function chk(name, got, want, tol) {
      var ok = Math.abs(got - want) <= (tol == null ? 0 : tol);
      R.push({ name: name, got: got, want: want, ok: ok });
      if (!ok) fails.push(R[R.length - 1]);
    }
    function chkTrue(name, cond) {
      R.push({ name: name, got: !!cond, want: true, ok: !!cond });
      if (!cond) fails.push(R[R.length - 1]);
    }

    /* —— 定义式 I = q/t —— */
    chk('I = q/t：1 C 在 2 s 内 → 0.5 A', current(1, 2), 0.5, 1e-12);
    chk('q = It：0.3 A × 10 s = 3 C', charge(0.3, 10), 3, 1e-12);
    chk('t = 0 时电流按 0 处理（不抛错）', current(1, 0), 0, 0);
    chk('负电荷量取绝对值算电子数', electrons(-1.6e-19), 1, 1e-12);
    /* 教材练习第 1 题：50 μA × 3.2 s */
    var q1 = charge(toAmpere(50, 'μA'), 3.2);
    chk('练习1：50 μA × 3.2 s = 1.6×10⁻⁴ C', q1, 1.6e-4, 1e-12);
    chk('练习1：电子数 1.0×10¹⁵', electrons(q1), 1.0e15, 1e10);
    /* 教材练习第 2 题：0.3 A */
    chk('练习2：0.3 A', current(charge(0.3, 1), 1), 0.3, 1e-12);

    /* —— 单位 —— */
    chk('1 mA = 1×10⁻³ A', toAmpere(1, 'mA'), 1e-3, 1e-18);
    chk('1 μA = 1×10⁻⁶ A', toAmpere(1, 'μA'), 1e-6, 1e-21);
    chk('50 μA → A', toAmpere(50, 'μA'), 5e-5, 1e-18);
    chk('1 A → mA = 1000', convertUnit(1, 'A', 'mA'), 1000, 1e-9);
    chk('1 A·s = 1 C', capacityCharge(1 / 3600), 1, 1e-9);

    /* —— 横截面判据 —— */
    chk('θ = 0° 是横截面', isCrossSection(0) ? 1 : 0, 1, 0);
    chk('θ = 30° 不是横截面', isCrossSection(30) ? 1 : 0, 0, 0);
    chk('斜截面投影 S·cos60° = 0.5S', crossFactor(60), 0.5, 1e-12);
    chk('θ = 90° 投影为 0（数不到电荷）', effArea(1e-6, 90), 0, 1e-18);

    /* —— 正负离子 —— */
    chk('q₁=2C、q₂=−3C → q=5C（取绝对值之和）', electrolyteCharge(2, -3), 5, 1e-12);
    chk('负离子反向移动等效正向电流', directionByConvention(-1, -1), 1, 0);

    /* —— 微观解释 —— */
    var nCu = copperCarrierDensity();
    chk('铜的 n = ρN_A/M ≈ 8.37×10²⁸ m⁻³', nCu, 8.37156e28, 1e24);
    var vCu = driftSpeed(1, nCu, 1e-6);
    chk('I=1 A、S=1 mm² 时 v ≈ 7.5×10⁻⁵ m/s', vCu, 7.47e-5, 1e-6);
    chk('v 倒推 I = neSv 回到 1 A', currentFromDrift(nCu, 1e-6, vCu), 1, 1e-9);
    var mc = microChain(1, vCu, 1e-6, nCu);
    chk('四步链：q/t = I', mc.q / 1, 1, 1e-9);
    chk('四步链：L = vt', mc.L, vCu, 1e-15);
    chk('四步链：N = nSvt', mc.N, nCu * 1e-6 * vCu, 1e12);
    chk('1 m 导线电子穿越 ≈ 3.7 h', transitTime(1, vCu) / 3600, 3.72, 0.05);
    chkTrue('“几个小时”与教材一致（> 3600 s）', transitTime(1, vCu) > 3600);
    chk('电场建立 1 m 用时 = 3.33×10⁻⁹ s', fieldTime(1), 3.333e-9, 1e-12);
    chkTrue('电场比电子快 10¹² 量级', transitTime(1, vCu) / fieldTime(1) > 1e12);

    /* —— 加速—碰撞 —— */
    var aCu = accel(0.0175);
    chk('a = eE/m（E=0.0175 V/m）', aCu, 3.073e9, 1e8);
    chkTrue('平均速率与时间无关（稳态）', Math.abs(steadyAvg(1e-3, 1e3, TAU_CU) - steadyAvg(9, 1e3, TAU_CU)) < 1e-15);
    chkTrue('平均速率随 E 单调增', avgDrift(2e3, TAU_CU) > avgDrift(1e3, TAU_CU));
    /* 微观自洽：加速—碰撞模型给出的 v̄ 必须与 v = I/(neS) 对上 */
    chk('v̄ = eEτ/(2m) 与 v = I/(neS) 自洽', avgDrift(0.0175), driftSpeed(1, nCu, 1e-6), 2e-6);

    /* —— 瞬间电流 —— */
    chk('RC 放电 t = τ 时 U 降到 1/e', rcDecay(300, 1, 1e-4, 1e-4), 300 / Math.E, 1e-9);
    chk('t = 5τ 时电流不足初值 1%', rcCurrent(300, 1, 1e-4, 5e-4) / (300 / 1) < 0.01 ? 1 : 0, 1, 0);
    chk('放电总电荷 q = U₀C', dischargeTotalCharge(300, 1e-4), 0.03, 1e-12);

    /* —— STSE —— */
    chk('94 A·h = 3.384×10⁵ C', capacityCharge(94), 3.384e5, 1e-6);
    var capC = capacityCharge(94), tRun = 5 * 3600;
    chk('94 A·h 放电 5 h → I = 18.8 A', dischargeCurrent(capC, tRun), 18.8, 1e-9);
    chk('续航 s = 72 km/h × 5 h = 360 km', enduranceKm(72, capC, dischargeCurrent(capC, tRun)), 360, 1e-9);
    chk('4000 mA·h 待机 22 天(528 h) → 7.6 mA', standbyCurrent(4000, 528), 7.5757, 1e-3);
    chk('4000 mA·h 视频 17 h → 235 mA', standbyCurrent(4000, 17), 235.29, 0.01);

    txt(ctx, spark > 0.02 ? '火花放电' : '等待放电', cx1, cy - 44 * k, { size: 12.5 * k, align: 'center', color: spark > 0.02 ? C.mark : C.grey, w: 600 });
    tapRing(ctx, cx1 - 62 * k, cy - 30 * k, 124 * k, 60 * k, { k: k });

    /* —— 右：干电池 + 小灯泡，一直亮 —— */
    var cx2 = px(b, 0.70);
    var loopY = py(b, 0.30), loopY2 = py(b, 0.70);
    K.circuit(ctx, [[cx2 - 90 * k, loopY], [cx2 + 90 * k, loopY], [cx2 + 90 * k, loopY2], [cx2 - 90 * k, loopY2], [cx2 - 90 * k, loopY]],
      { color: C.white, w: 2 * k });
    lamp(ctx, cx2 + 90 * k, (loopY + loopY2) / 2, 15 * k, { on: true, w: 2 * k });
    K.batterySymbol(ctx, cx2 - 90 * k, (loopY + loopY2) / 2, { color: C.orange, w: 3.4 * k });
    txt(ctx, '电池', cx2 - 90 * k - 14 * k, (loopY + loopY2) / 2, { size: 12.5 * k, align: 'right', color: C.orange });
    txt(ctx, '灯泡一直亮', cx2 + 90 * k + 14 * k, (loopY + loopY2) / 2, { size: 12.5 * k, align: 'left', color: C.gold });
    flow(ctx, [[cx2 - 60 * k, loopY], [cx2 + 60 * k, loopY]], 5, S.flowPhase, { r: 3.6 * k, glow: true });
    txt(ctx, '持续电流', cx2, loopY - 24 * k, { size: 13 * k, align: 'center', color: C.gold, w: 600 });
    tapRing(ctx, cx2 - 108 * k, loopY - 14 * k, 216 * k, (loopY2 - loopY) + 28 * k, { k: k });
    readoutBlock(ctx, px(b, 0.60), py(b, 0.86), 150 * k, [
      ['摇动速度', (S.spark * 100).toFixed(0) + ' %'],
      ['小灯泡', '一直亮']
    ], { k: k });
  }

  /* =====================================================================
     场景 2 · 两个带电体被导线连起来：只有瞬间电流（环节①）
     ===================================================================== */
  function scTransient(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var ax = px(b, 0.13), axc = px(b, 0.50), bx1 = px(b, 0.80);
    var cy = py(b, 0.30), r = 26 * k;
    /* 导线 H（上下两条水平线 + 两端竖线） */
    var yTop = py(b, 0.68), yBot = py(b, 0.80);
    K.circuit(ctx, [[ax, yTop], [axc, yTop], [bx1, yTop]], { color: C.white, w: 2 * k });
    K.circuit(ctx, [[ax, yBot], [axc, yBot], [bx1, yBot]], { color: C.white, w: 2 * k });
    seg(ctx, ax, yTop, ax, cy + r, { color: C.white, w: 2 * k });
    seg(ctx, bx1, yTop, bx1, cy + r, { color: C.white, w: 2 * k });
    seg(ctx, ax, yBot, ax, cy + r, { color: C.white, w: 2 * k });
    seg(ctx, bx1, yBot, bx1, cy + r, { color: C.white, w: 2 * k });
    txt(ctx, 'H', axc, yTop - 16 * k, { size: 13 * k, align: 'center', color: C.white, w: 600 });

    chargedBall(ctx, ax, cy, r, 'pos', S.nA, { label: 'A（带正电）' });
    chargedBall(ctx, bx1, cy, r, 'neg', S.nB, { label: 'B（带负电）' });

    /* 电子沿导线从 B 流向 A（上支路 B→A，下支路 A→B 循环） */
    var pts = [[bx1 - r, cy], [bx1, cy + r * 1.6], [bx1, yTop], [axc, yTop], [ax, yTop], [ax, cy + r * 1.6], [ax + r, cy]];
    if (S.I > 1e-6) flow(ctx, pts, 7, S.flowPhase, { r: 3.8 * k, glow: true });
    arrow(ctx, axc - 42 * k, yTop, axc, yTop, C.white, 2 * k);
    txt(ctx, '电子 B → A', axc, yTop + 15 * k, { size: 12.5 * k, align: 'center', color: C.grey });

    /* 右侧 U–t 曲线 */
    var mx = px(b, 0.62), my = py(b, 0.52), mw = 190 * k, mh = 100 * k;
    var A = miniAxes(ctx, mx, my, mw, mh, { k: k, ylab: 'U' });
    ctx.save();
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2.2 * k;
    ctx.beginPath();
    for (var i = 0; i <= 40; i++) {
      var tt = i / 40;
      var yy = A.y + A.h - A.h * Math.exp(-tt * 5);
      i ? ctx.lineTo(A.x + A.w * tt, yy) : ctx.moveTo(A.x, yy);
    }
    ctx.stroke();
    ctx.restore();
    K.glowDot(ctx, A.x + A.w * S.tn, A.y + A.h - A.h * S.frac, 3.6 * k, C.gold, { halo: 2.6 });
    txt(ctx, '电势差很快消失', mx, my - 14 * k, { size: 12.5 * k, color: C.gold });

    readoutBlock(ctx, px(b, 0.62), py(b, 0.84), 200 * k, [
      ['两极电势差 U', P.fmt(S.U, 1) + ' V', C.gold],
      ['导线电流 I', P.fmt(S.I, 2) + ' A', C.mark],
      ['经过的电荷 q', P.fmt(S.qPass, 4) + ' C']
    ], { k: k });
  }

  /* =====================================================================
     场景 3 · 装置 P：把电子从 A 搬回 B（环节②）
     ===================================================================== */
  function scSource(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption, grid: true });
    var ax = px(b, 0.15), bx1 = px(b, 0.80), cy = py(b, 0.32), r = 24 * k;
    var yTop = py(b, 0.66), yBot = py(b, 0.86);
    /* 导线回路 */
    K.circuit(ctx, [[ax, yTop], [bx1, yTop]], { color: C.white, w: 2 * k });
    K.circuit(ctx, [[ax, yBot], [bx1, yBot]], { color: C.white, w: 2 * k });
    seg(ctx, ax, yTop, ax, cy + r, { color: C.white, w: 2 * k });
    seg(ctx, bx1, yTop, bx1, cy + r, { color: C.white, w: 2 * k });
    seg(ctx, ax, yBot, ax, cy + r, { color: C.white, w: 2 * k });
    seg(ctx, bx1, yBot, bx1, cy + r, { color: C.white, w: 2 * k });
    /* 装置 P（下支路中间，橙色方框） */
    var pw = 108 * k, ph = 44 * k, pcx = (ax + bx1) / 2, pcy = yBot;
    ctx.save();
    ctx.fillStyle = 'rgba(248,128,8,0.16)';
    ctx.fillRect(pcx - pw / 2, pcy - ph / 2, pw, ph);
    ctx.strokeStyle = C.orange; ctx.lineWidth = 2.2 * k;
    ctx.strokeRect(pcx - pw / 2, pcy - ph / 2, pw, ph);
    ctx.restore();
    txt(ctx, S.revealedP ? '装置 P（电源）' : '装置 ？', pcx, pcy, { size: 14 * k, align: 'center', color: C.orange, w: 700 });
    txt(ctx, S.revealedP ? '把电子从 A 搬回 B' : '它能把电子从 A 取走、补回 B', pcx, pcy + ph / 2 + 18 * k,
      { size: 12.5 * k, align: 'center', color: C.orange });
    tapRing(ctx, pcx - pw / 2 - 4 * k, pcy - ph / 2 - 4 * k, pw + 8 * k, ph + 8 * k, { k: k });

    chargedBall(ctx, ax, cy, r, 'pos', S.nA, { label: 'A 极' });
    chargedBall(ctx, bx1, cy, r, 'neg', S.nB, { label: 'B 极' });
    /* 电子：上支路 B→A（导线中的电流方向与电子相反） */
    flow(ctx, [[bx1 - r, cy], [bx1, yTop], [(ax + bx1) / 2, yTop], [ax, yTop], [ax + r, cy]], 6, S.flowPhase, { r: 3.8 * k, glow: true });
    /* 装置 P 内：把电子从 A 侧搬回 B 侧（沿下支路从 A 到 B 再回 B 极） */
    flow(ctx, [[ax + r, cy], [ax, yBot], [pcx - pw / 2, yBot], [pcx + pw / 2, yBot], [bx1, yBot], [bx1 - r, cy]],
      6, S.pumpPhase, { r: 3.8 * k, glow: S.pump >= 0.95 });
    arrow(ctx, ax + 60 * k, yTop, ax + 100 * k, yTop, C.white, 2 * k);
    txt(ctx, '导线中的电流（B → A）', (ax + bx1) / 2, yTop - 18 * k, { size: 12.5 * k, align: 'center', color: C.grey });
    txt(ctx, 'P 把电子搬回 B 极', pcx, pcy + ph / 2 + 38 * k, { size: 12.5 * k, align: 'center', color: C.orange });

    readoutBlock(ctx, px(b, 0.60), py(b, 0.02), 210 * k, [
      ['装置 P 搬运速率', P.fmt(S.pumpSpeed, 2) + ' A', C.orange],
      ['导线流失速率', '1.00 A'],
      ['两极电荷量', S.steady ? '保持不变' : '正在失衡', S.steady ? C.gold : C.mark],
      ['导线电流 I', S.steady ? '1.00 A 恒定' : P.fmt(S.I, 2) + ' A 在变', S.steady ? C.gold : C.mark]
    ], { k: k });
  }

  /* =====================================================================
     场景 4 · 抽水机类比（环节②，只类比“维持差额”）
     ===================================================================== */
  function scPump(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    /* 左：抽水系统 */
    var lx = px(b, 0.22), hiY = py(b, 0.20), loY = py(b, 0.72), wTank = 110 * k;
    ctx.save();
    ctx.strokeStyle = C.white; ctx.lineWidth = 2 * k;
    ctx.strokeRect(lx - wTank / 2, hiY, wTank, 46 * k);
    ctx.strokeRect(lx - wTank / 2, loY, wTank, 46 * k);
    ctx.fillStyle = 'rgba(14,138,150,0.25)';
    ctx.fillRect(lx - wTank / 2, hiY + 20 * k, wTank, 26 * k);
    ctx.fillRect(lx - wTank / 2, loY + 6 * k, wTank, 40 * k);
    ctx.restore();
    txt(ctx, '高水位', lx, hiY - 12 * k, { size: 12.5 * k, align: 'center', color: C.white });
    txt(ctx, '低水位', lx, loY + 62 * k, { size: 12.5 * k, align: 'center', color: C.white });
    seg(ctx, lx + wTank / 2, hiY + 24 * k, lx + wTank / 2 + 60 * k, hiY + 24 * k, { color: C.white, w: 2 * k });
    seg(ctx, lx + wTank / 2 + 60 * k, hiY + 24 * k, lx + wTank / 2 + 60 * k, loY + 24 * k, { color: C.white, w: 2 * k });
    seg(ctx, lx + wTank / 2 + 60 * k, loY + 24 * k, lx + wTank / 2, loY + 24 * k, { color: C.white, w: 2 * k });
    flow(ctx, [[lx + wTank / 2, hiY + 24 * k], [lx + wTank / 2 + 60 * k, hiY + 24 * k],
      [lx + wTank / 2 + 60 * k, loY + 24 * k]], 4, S.flowPhase, { r: 3.6 * k });
    ctx.save();
    ctx.fillStyle = 'rgba(248,128,8,0.16)'; ctx.fillRect(lx - wTank / 2, (hiY + loY) / 2 + 30 * k, wTank, 34 * k);
    ctx.strokeStyle = C.orange; ctx.lineWidth = 2 * k; ctx.strokeRect(lx - wTank / 2, (hiY + loY) / 2 + 30 * k, wTank, 34 * k);
    ctx.restore();
    txt(ctx, '抽水机', lx, (hiY + loY) / 2 + 47 * k, { size: 12.5 * k, align: 'center', color: C.orange });
    arrow(ctx, lx - 22 * k, loY + 8 * k, lx - 22 * k, (hiY + loY) / 2 + 28 * k, C.orange, 2 * k);
    txt(ctx, '把水从低处送到高处', lx, py(b, 0.95), { size: 12.5 * k, align: 'center', color: C.grey });

    /* 右：电源维持电势差 */
    var rx = px(b, 0.72);
    seg(ctx, rx - 60 * k, hiY + 24 * k, rx + 60 * k, hiY + 24 * k, { color: C.white, w: 2 * k });
    seg(ctx, rx - 60 * k, loY + 24 * k, rx + 60 * k, loY + 24 * k, { color: C.white, w: 2 * k });
    seg(ctx, rx - 60 * k, hiY + 24 * k, rx - 60 * k, loY + 24 * k, { color: C.white, w: 2 * k });
    seg(ctx, rx + 60 * k, hiY + 24 * k, rx + 60 * k, loY + 24 * k, { color: C.white, w: 2 * k });
    txt(ctx, '正极（高电势）', rx, hiY + 6 * k, { size: 12.5 * k, align: 'center', color: C.pos });
    txt(ctx, '负极（低电势）', rx, loY + 56 * k, { size: 12.5 * k, align: 'center', color: C.neg });
    K.batterySymbol(ctx, rx - 60 * k, (hiY + loY) / 2 + 46 * k, { color: C.orange, w: 3.4 * k });
    txt(ctx, '电源', rx - 60 * k - 16 * k, (hiY + loY) / 2 + 46 * k, { size: 12.5 * k, align: 'right', color: C.orange });
    flowPos(ctx, [[rx - 60 * k, loY + 24 * k], [rx - 60 * k, hiY + 24 * k]], 3, 1 - S.flowPhase, { r: 3.6 * k });
    flowPos(ctx, [[rx + 60 * k, hiY + 24 * k], [rx + 60 * k, loY + 24 * k]], 3, S.flowPhase, { r: 3.6 * k });
    txt(ctx, '把正电荷从负极搬到正极', rx, py(b, 0.95), { size: 12.5 * k, align: 'center', color: C.grey });
    txt(ctx, '水位差 ←→ 电势差', px(b, 0.47), py(b, 0.02), { size: 13.5 * k, align: 'center', color: C.gold, w: 600 });
    tapRing(ctx, px(b, 0.12), py(b, 0.10), (b.x1 - b.x0) * 0.20, (b.y1 - b.y0) * 0.86, { k: k });
    tapRing(ctx, px(b, 0.60), py(b, 0.10), (b.x1 - b.x0) * 0.36, (b.y1 - b.y0) * 0.86, { k: k });
    tapRing(ctx, px(b, 0.42), py(b, 0.88), (b.x1 - b.x0) * 0.44, (b.y1 - b.y0) * 0.12, { k: k });
  }

  /* =====================================================================
     场景 5 · 认知冲突：导线内部有没有电场（环节③）
     ===================================================================== */
  function scField(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    /* 左：静电平衡的导体（内部 E = 0） */
    var lcx = px(b, 0.18), cy = py(b, 0.34), wBox = 120 * k, hBox = 64 * k;
    K.metalBox(ctx, lcx - wBox / 2, cy - hBox / 2, wBox, hBox, { color: C.white, w: 2 * k });
    K.chargeDot(ctx, lcx - wBox / 2 + 6 * k, cy, 5 * k, 'neg', { ring: false });
    K.chargeDot(ctx, lcx + wBox / 2 - 6 * k, cy, 5 * k, 'pos', { ring: false });
    txt(ctx, '静电平衡', lcx, cy - hBox / 2 - 18 * k, { size: 13 * k, align: 'center', color: C.white, w: 600 });
    txt(ctx, '内部 E = 0', lcx, cy, { size: 15 * k, align: 'center', color: C.gold, w: 700 });
    txt(ctx, '没有电荷定向移动', lcx, cy + hBox / 2 + 20 * k, { size: 12.5 * k, align: 'center', color: C.grey });

    /* 右：电路中的导线（内部 E ≠ 0） */
    var rcx = px(b, 0.72);
    seg(ctx, rcx - 110 * k, cy, rcx + 110 * k, cy, { color: C.white, w: 3 * k });
    var nArrow = 5;
    for (var i = 0; i < nArrow; i++) {
      var x = rcx - 88 * k + i * 44 * k;
      arrow(ctx, x - 16 * k, cy - 22 * k, x + 16 * k, cy - 22 * k, C.mark, 2 * k);
    }
    txt(ctx, 'E', rcx + 122 * k, cy - 22 * k, { size: 15 * k, color: C.mark, w: 700 });
    txt(ctx, '电路中', rcx, cy - 58 * k, { size: 13 * k, align: 'center', color: C.white, w: 600 });
    txt(ctx, '内部 E ≠ 0', rcx, cy + 26 * k, { size: 15 * k, align: 'center', color: C.mark, w: 700 });
    txt(ctx, '自由电子定向移动', rcx, cy + 52 * k, { size: 12.5 * k, align: 'center', color: C.grey });
    flow(ctx, [[rcx - 110 * k, cy], [rcx + 110 * k, cy]], 8, S.flowPhase, { r: 3.8 * k, glow: true });

    /* 场强换算 */
    var lx = px(b, 0.30), ly = py(b, 0.88);
    mtxt(ctx, 'E = U/L', lx - 46 * k, ly, { size: 15 * k });
    txt(ctx, 'U = ' + P.fmt(S.Uwire, 1) + ' V ，L = 1 m  ⇒  E = ' + P.fmt(S.Ewire, 1) + ' V/m',
      lx + 10 * k, ly, { size: 13 * k, color: C.white });
    txt(ctx, '冲突：刚学完“导体内部场强为零”', px(b, 0.63), py(b, 0.88), { size: 13 * k, align: 'center', color: C.mark, w: 600 });
    tapRing(ctx, lcx - wBox / 2 - 10 * k, cy - hBox / 2 - 30 * k, wBox + 20 * k, hBox + 46 * k, { k: k });
    tapRing(ctx, rcx - 128 * k, cy - 76 * k, 256 * k, 148 * k, { k: k });
  }

  /* =====================================================================
     场景 6 · 动态平衡：电荷“你来我走”、分布不变（环节③）
     ===================================================================== */
  function scFlow(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var y = py(b, 0.34), x0 = px(b, 0.06), x1 = px(b, 0.96);
    seg(ctx, x0, y - 34 * k, x1, y - 34 * k, { color: C.white, w: 3 * k });
    seg(ctx, x0, y + 34 * k, x1, y + 34 * k, { color: C.white, w: 3 * k });
    /* 位置固定的“电荷分布”（等间距刻度） */
    for (var i = 0; i <= 10; i++) {
      var x = x0 + (x1 - x0) * i / 10;
      seg(ctx, x, y - 34 * k, x, y - 24 * k, { color: C.gold, w: 2 * k });
      seg(ctx, x, y + 34 * k, x, y + 24 * k, { color: C.gold, w: 2 * k });
    }
    txt(ctx, '各位置的电荷分布 —— 始终一样', (x0 + x1) / 2, y - 52 * k, { size: 13 * k, align: 'center', color: C.gold, w: 600 });
    /* 流动的电子 */
    flow(ctx, [[x1, y], [x0, y]], 9, S.flowPhase, { r: 4.2 * k, glow: true });
    txt(ctx, '但电子一直在换：有的流走，另外的又来补上', (x0 + x1) / 2, y + 62 * k, { size: 13 * k, align: 'center', color: C.white });
    /* 三行对照 */
    readoutBlock(ctx, px(b, 0.52), py(b, 0.80), 250 * k, [
      ['电荷分布', '不随时间变化', C.gold],
      ['电场 E', '不随时间变化', C.gold],
      ['每个电子的运动', '一直在定向移动', C.mark]
    ], { k: k });
  }

  /* =====================================================================
     场景 7 · 串联电流表：示数保持恒定（环节③）
     ===================================================================== */
  function scAmmeter(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption, grid: true });
    var x0 = px(b, 0.10), x1 = px(b, 0.88), yT = py(b, 0.26), yB = py(b, 0.74);
    K.circuit(ctx, [[x0, yT], [x1, yT], [x1, yB], [x0, yB], [x0, yT]], { color: C.white, w: 2.4 * k });
    K.batterySymbol(ctx, x0, (yT + yB) / 2, { color: C.orange, w: 3.6 * k });
    txt(ctx, '电源 U = ' + P.fmt(S.Uamm, 1) + ' V', x0 - 18 * k, (yT + yB) / 2, { size: 12.5 * k, align: 'right', color: C.orange });
    var acx = (x0 + x1) / 2 - 40 * k;
    ammeter(ctx, acx, yB, 24 * k, S.needle, { k: k });
    lamp(ctx, x1, (yT + yB) / 2, 16 * k, { on: true, w: 2 * k });
    flow(ctx, [[x0, yT], [x1, yT], [x1, yT + 20 * k]], 5, S.flowPhase, { r: 3.8 * k, glow: true });
    /* I–t 平线 */
    var mx = px(b, 0.56), my = py(b, 0.02), mw = 180 * k, mh = 84 * k;
    var A = miniAxes(ctx, mx, my, mw, mh, { k: k, ylab: 'I' });
    var lv = A.y + A.h - A.h * Math.min(0.92, S.Iamm / 3);
    seg(ctx, A.x, lv, A.x + A.w, lv, { color: C.gold, w: 2.4 * k });
    txt(ctx, 'I = ' + P.fmt(S.Iamm, 3) + ' A 不变', mx + 4 * k, my - 14 * k, { size: 12.5 * k, color: C.gold });
    txt(ctx, '恒定电流：大小、方向都不随时间变化', (A.x + A.x + A.w) / 2, my + mh + 22 * k, { size: 12.5 * k, align: 'center', color: C.white });
    tapRing(ctx, acx - 34 * k, yB - 34 * k, 68 * k, 68 * k, { k: k });
    tapRing(ctx, mx - 12 * k, my - 12 * k, mw + 24 * k, mh + 24 * k, { k: k });
  }

  /* =====================================================================
     场景 8 · 加速—碰撞：平均速率不随时间变化（环节③ 难点）
     ===================================================================== */
  function scSawtooth(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var ax = px(b, 0.06), ay = py(b, 0.08), aw = 380 * k, ah = 190 * k;
    var A = miniAxes(ctx, ax, ay + 20 * k, aw, ah, { k: k, ylab: 'v' });
    /* 锯齿：每段加速，末端碰撞归零 */
    var nSeg = 6, segW = A.w / nSeg;
    ctx.save();
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 2 * k; ctx.lineJoin = 'miter';
    ctx.beginPath();
    for (var i = 0; i < nSeg; i++) {
      var xa = A.x + i * segW, xb = xa + segW;
      var yMax = A.y + A.h - A.h * 0.62 * S.vScale;
      i ? ctx.lineTo(xa, A.y + A.h) : ctx.moveTo(xa, A.y + A.h);
      ctx.lineTo(xb, yMax);
      if (i < nSeg - 1) ctx.lineTo(xb, A.y + A.h);
    }
    ctx.stroke();
    ctx.restore();
    var yAvg = A.y + A.h - A.h * 0.31 * S.vScale;
    seg(ctx, A.x, yAvg, A.x + A.w, yAvg, { color: C.gold, w: 2.2 * k, dash: [7, 5] });
    txt(ctx, 'v̄（平均速率）', A.x + A.w + 8 * k, yAvg, { size: 12 * k, color: C.gold });
    txt(ctx, '加速', ax + 34 * k, A.y + 34 * k, { size: 12.5 * k, color: C.cyan });
    txt(ctx, '碰撞', ax + 96 * k, A.y + 12 * k, { size: 12.5 * k, color: C.mark });
    arrow(ctx, ax + 26 * k, A.y + 48 * k, ax + 62 * k, A.y + 26 * k, C.cyan, 1.8 * k);
    arrow(ctx, ax + 96 * k, A.y + 26 * k, ax + 96 * k, A.y + 48 * k, C.mark, 1.8 * k);
    /* 右侧说明块 */
    readoutBlock(ctx, px(b, 0.62), ay + 30 * k, 215 * k, [
      ['场强 E', P.fmt(S.EfieldmV, 1) + ' mV/m'],
      ['加速 a = eE/m', P.sci(P.accel(S.EfieldV), 2) + ' m/s²'],
      ['峰值速率', P.sci(S.vpeak, 2) + ' m/s'],
      ['平均速率 v̄', P.sci(S.vavg, 2) + ' m/s', C.gold],
      ['v̄ 随时间', '不变化', C.gold]
    ], { k: k });
  }

  /* =====================================================================
     场景 9 · 恒定电流 vs 交变电流（环节③ 定义）
     ===================================================================== */
  function scSteady(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption, grid: true });
    var ax = px(b, 0.06), ay = py(b, 0.10), aw = 360 * k, ah = 150 * k;
    var A = miniAxes(ctx, ax, ay + 16 * k, aw, ah, { k: k, ylab: 'I' });
    var mid = A.y + A.h / 2;
    seg(ctx, A.x, mid, A.x + aw, mid, { color: 'rgba(255,255,255,0.28)', w: 1 * k, dash: [5, 5] });
    txt(ctx, '0', A.x - 10 * k, mid, { size: 11.5 * k, color: C.grey, align: 'right' });
    if (S.mode === 1) {
      var lv = A.y + A.h - A.h * 0.78;
      seg(ctx, A.x, lv, A.x + aw, lv, { color: C.gold, w: 2.6 * k });
      txt(ctx, '大小不变、方向不变', A.x + aw * 0.30, lv - 20 * k, { size: 13 * k, color: C.gold, w: 600 });
      flow(ctx, [[A.x, lv], [A.x + aw, lv]], 6, S.flowPhase, { r: 3.4 * k });
    } else {
      ctx.save();
      ctx.strokeStyle = C.mark; ctx.lineWidth = 2.4 * k;
      ctx.beginPath();
      for (var i = 0; i <= 60; i++) {
        var t = i / 60, x = A.x + aw * t, y = mid - Math.sin(t * Math.PI * 4) * ah * 0.36;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
      txt(ctx, '大小、方向都在变', A.x + aw * 0.30, mid - ah * 0.52, { size: 13 * k, color: C.mark, w: 600 });
    }
    txt(ctx, S.mode === 1 ? '恒定电流（steady current）' : '交变电流', px(b, 0.60), py(b, 0.80),
      { size: 15 * k, align: 'center', color: S.mode === 1 ? C.gold : C.mark, w: 700 });
    txt(ctx, '这一章我们研究恒定电流', px(b, 0.60), py(b, 0.88), { size: 12.5 * k, align: 'center', color: C.white });
    tapRing(ctx, A.x - 14 * k, A.y - 14 * k, aw + 28 * k, ah + 28 * k, { k: k });
  }

  /* =====================================================================
     场景 10 · 定义式 I = q/t（环节④）
     ===================================================================== */
  function scDefine(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var y = py(b, 0.30), x0 = px(b, 0.05), x1 = px(b, 0.95);
    /* 导体（圆柱示意：两条平行线 + 端面椭圆省略） */
    seg(ctx, x0, y - 30 * k, x1, y - 30 * k, { color: C.white, w: 3 * k });
    seg(ctx, x0, y + 30 * k, x1, y + 30 * k, { color: C.white, w: 3 * k });
    /* 横截面（虚线，垂直于电流方向） */
    var xc = (x0 + x1) / 2;
    seg(ctx, xc, y - 44 * k, xc, y + 44 * k, { color: C.gold, w: 2.4 * k, dash: [7, 5] });
    txt(ctx, '横截面', xc, y + 58 * k, { size: 12.5 * k, align: 'center', color: C.gold });
    txt(ctx, 'S', xc + 30 * k, y - 50 * k, { size: 14 * k, color: C.gold });
    /* 通过的电荷 */
    flow(ctx, [[x0, y], [x1, y]], 9, S.flowPhase, { r: 4.2 * k, glow: true });
    arrow(ctx, x0 + 40 * k, y - 52 * k, x0 + 100 * k, y - 52 * k, C.mark, 2 * k);
    txt(ctx, '电流方向（正电荷定向移动方向）', x0 + 24 * k, y - 68 * k, { size: 12 * k, color: C.mark });
    tapRing(ctx, xc - 34 * k, y - 54 * k, 68 * k, 108 * k, { k: k });
    /* 计时条 */
    var bw = 300 * k, bx0 = px(b, 0.20), by = py(b, 0.70);
    seg(ctx, bx0, by, bx0 + bw, by, { color: 'rgba(255,255,255,0.45)', w: 2 * k });
    var f = Math.min(1, S.tdefine / 10);
    seg(ctx, bx0, by, bx0 + bw * f, by, { color: C.gold, w: 4 * k });
    txt(ctx, '经过的时间 t = ' + P.fmt(S.tdefine, 1) + ' s', bx0 + bw + 12 * k, by, { size: 12.5 * k, color: C.white });
    readoutBlock(ctx, px(b, 0.60), py(b, 0.78), 220 * k, [
      ['电流 I', P.fmt(S.Idefine, 2) + ' A', C.gold],
      ['时间 t', P.fmt(S.tdefine, 1) + ' s'],
      ['电荷量 q = It', P.fmt(S.qDefine, 3) + ' C', C.gold],
      ['经过的电子数', P.sci(S.nDefine, 2) + ' 个']
    ], { k: k });
  }

  /* =====================================================================
     场景 11 · 单位与教材练习 1（环节④）
     ===================================================================== */
  function scUnits(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    /* 单位阶梯 */
    var lx = px(b, 0.10), ly = py(b, 0.24);
    var seq = [['1 A', 1], ['1 mA = 10⁻³ A', 0.62], ['1 μA = 10⁻⁶ A', 0.36]];
    for (var i = 0; i < seq.length; i++) {
      var yy = ly + i * 52 * k;
      txt(ctx, seq[i][0], lx, yy, { size: 14 * k, color: i === S.unitIdx ? C.gold : C.white, w: i === S.unitIdx ? 700 : 400 });
      seg(ctx, lx - 8 * k, yy + 18 * k, lx + 190 * k, yy + 18 * k, { color: 'rgba(255,255,255,0.18)', w: 1 * k });
    }
    txt(ctx, '可自推：I = q/t ⇒ C/s ⇒ 安培 A', lx, ly + 3 * 52 * k, { size: 12.5 * k, color: C.cyan });
    /* 练习 1：50 μA × 3.2 s */
    var rx = px(b, 0.62);
    txt(ctx, '教材练习 1', rx, py(b, 0.12), { size: 14 * k, color: C.white, w: 700 });
    txt(ctx, '一根导线中的电流 50 μA，', rx, py(b, 0.22), { size: 13 * k, color: C.white });
    txt(ctx, '3.2 s 内通过横截面的电荷量是多少？', rx, py(b, 0.30), { size: 13 * k, color: C.white });
    txt(ctx, '有多少个电子通过？', rx, py(b, 0.38), { size: 13 * k, color: C.white });
    mtxt(ctx, 'I = q/t  ⇒  q = It', rx, py(b, 0.50), { size: 15 * k });
    txt(ctx, 'q = 5.0×10⁻⁵ A × 3.2 s = 1.6×10⁻⁴ C', rx, py(b, 0.60), { size: 13.5 * k, color: C.gold });
    txt(ctx, 'n = q/e = 1.0×10¹⁵ 个', rx, py(b, 0.69), { size: 13.5 * k, color: C.gold });
    tapRing(ctx, lx - 20 * k, ly - 26 * k, 230 * k, 190 * k, { k: k });
    tapRing(ctx, rx - 20 * k, py(b, 0.08), 280 * k, (b.y1 - b.y0) * 0.72, { k: k });
    readoutBlock(ctx, rx - 20 * k, py(b, 0.78), 250 * k, [
      ['当前选中单位', ['A', 'mA', 'μA'][S.unitIdx]],
      ['换算为 A', P.sci(S.Iampere, 2) + ' A']
    ], { k: k });
  }

  /* =====================================================================
     场景 12 · 横截面判据：斜截面 vs 垂直截面（环节④ 易错点①）
     ===================================================================== */
  function scCrossSec(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var y = py(b, 0.34), x0 = px(b, 0.06), x1 = px(b, 0.60);
    var xc = (x0 + x1) / 2, halfH = 42 * k;
    seg(ctx, x0, y - halfH, x1, y - halfH, { color: C.white, w: 3 * k });
    seg(ctx, x0, y + halfH, x1, y + halfH, { color: C.white, w: 3 * k });
    flow(ctx, [[x0, y], [x1, y]], 7, S.flowPhase, { r: 4 * k, glow: true });
    arrow(ctx, x0 + 20 * k, y - halfH - 20 * k, x0 + 72 * k, y - halfH - 20 * k, C.mark, 2 * k);
    txt(ctx, '电流方向', x0 + 16 * k, y - halfH - 36 * k, { size: 12.5 * k, color: C.mark });
    /* 斜截面：绕 y 轴倾斜 theta */
    var th = S.theta * Math.PI / 180;
    var dx = Math.tan(th) * halfH * 1.6;
    var topX = xc + dx, botX = xc - dx;
    var col = S.isCross ? C.gold : C.mark;
    seg(ctx, topX, y - halfH * 0.72, botX, y + halfH * 0.72, { color: col, w: 2.6 * k });
    /* 投影（垂直截面，虚线） */
    seg(ctx, xc, y - halfH * 0.72, xc, y + halfH * 0.72, { color: 'rgba(255,255,255,0.55)', w: 1.6 * k, dash: [6, 5] });
    if (Math.abs(dx) > 12 * k) {
      seg(ctx, topX, y - halfH * 0.72, xc, y - halfH * 0.72, { color: 'rgba(255,255,255,0.35)', w: 1.2 * k, dash: [4, 4] });
      seg(ctx, botX, y + halfH * 0.72, xc, y + halfH * 0.72, { color: 'rgba(255,255,255,0.35)', w: 1.2 * k, dash: [4, 4] });
    }
    txt(ctx, S.isCross ? '这就是横截面（θ = 0°）' : '斜截面（θ = ' + S.theta.toFixed(0) + '°）', xc + 8 * k, y - halfH - 36 * k,
      { size: 13 * k, color: col, w: 600 });
    tapRing(ctx, xc - 56 * k, y - halfH * 0.86, 112 * k, halfH * 1.72, { k: k, color: 'rgba(5,232,253,0.32)' });
    /* 有效面积柱 */
    var bx0 = px(b, 0.66), by0 = py(b, 0.16), bw = 34 * k, bh = 150 * k;
    seg(ctx, bx0, by0, bx0, by0 + bh, { color: 'rgba(255,255,255,0.5)', w: 1.4 * k });
    seg(ctx, bx0, by0 + bh, bx0 + bw, by0 + bh, { color: 'rgba(255,255,255,0.5)', w: 1.4 * k });
    ctx.save();
    ctx.fillStyle = S.isCross ? 'rgba(240,172,95,0.35)' : 'rgba(252,98,85,0.30)';
    ctx.fillRect(bx0, by0 + bh * (1 - S.cosT), bw, bh * S.cosT);
    ctx.strokeStyle = col; ctx.lineWidth = 2 * k;
    ctx.strokeRect(bx0, by0 + bh * (1 - S.cosT), bw, bh * S.cosT);
    ctx.restore();
    txt(ctx, '数得到的面积 S·cosθ', bx0 + bw / 2, by0 - 16 * k, { size: 12.5 * k, align: 'center', color: col });
    readoutBlock(ctx, px(b, 0.66), py(b, 0.78), 230 * k, [
      ['夹角 θ', S.theta.toFixed(0) + '°'],
      ['有效占比 cosθ', P.fmt(S.cosT, 3), col],
      ['是否是横截面', S.isCross ? '是' : '不是', col]
    ], { k: k });
  }

  /* =====================================================================
     场景 13 · 正负离子同时移动（环节④ 易错点②）
     ===================================================================== */
  function scElectrolyte(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var x0 = px(b, 0.05), x1 = px(b, 0.95), y = py(b, 0.34), hh = 56 * k;
    K.metalBox(ctx, x0, y - hh, x1 - x0, hh * 2, { color: C.white, w: 2.4 * k });
    txt(ctx, '电解液', x0 + 12 * k, y - hh + 16 * k, { size: 12.5 * k, color: C.grey });
    /* 电极 */
    K.chargeDot(ctx, x0 + 4 * k, y, 8 * k, 'neg', { ring: false });
    K.chargeDot(ctx, x1 - 4 * k, y, 8 * k, 'pos', { ring: false });
    txt(ctx, '负极', x0 + 4 * k, y + hh + 18 * k, { size: 12.5 * k, align: 'center', color: C.neg });
    txt(ctx, '正极', x1 - 4 * k, y + hh + 18 * k, { size: 12.5 * k, align: 'center', color: C.pos });
    flowPos(ctx, [[x0 + 14 * k, y - 22 * k], [x1 - 14 * k, y - 22 * k]], 5, S.flowPhase, { r: 4 * k, glow: true });
    flow(ctx, [[x1 - 14 * k, y + 22 * k], [x0 + 14 * k, y + 22 * k]], 5, 1 - S.flowPhase, { r: 4 * k });
    txt(ctx, '正离子 →', (x0 + x1) / 2, y - 40 * k, { size: 12.5 * k, align: 'center', color: C.pos });
    txt(ctx, '← 负离子', (x0 + x1) / 2, y + 44 * k, { size: 12.5 * k, align: 'center', color: C.neg });
    arrow(ctx, (x0 + x1) / 2 - 70 * k, y + hh + 44 * k, (x0 + x1) / 2 + 70 * k, y + hh + 44 * k, C.gold, 2.4 * k);
    txt(ctx, '电流方向（两者等效，方向相同）', (x0 + x1) / 2, y + hh + 64 * k, { size: 12.5 * k, align: 'center', color: C.gold });
    txt(ctx, S.elecEquiv ? '说法：等效 ⇒ q = |q₁| + |q₂|（相加）' : '说法：抵消 ⇒ 会算出"电流为零"（错）',
      (x0 + x1) / 2, y - hh - 22 * k, { size: 13 * k, align: 'center', color: S.elecEquiv ? C.gold : C.mark, w: 600 });
    tapRing(ctx, x0 + 10 * k, y - hh - 12 * k, (x1 - x0) - 20 * k, hh * 2 + 24 * k, { k: k });
    readoutBlock(ctx, px(b, 0.62), py(b, 0.06), 230 * k, [
      ['正离子 q₁', P.fmt(S.q1, 2) + ' C', C.pos],
      ['负离子 |q₂|', P.fmt(S.q2, 2) + ' C', C.neg],
      ['合计 q = q₁+|q₂|', P.fmt(S.qsum, 2) + ' C', C.gold]
    ], { k: k });
  }

  /* =====================================================================
     场景 14 · I = neSv 的四步推导链（环节⑤）
     ===================================================================== */
  function scMicro(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var y = py(b, 0.30), x0 = px(b, 0.06), xRight = px(b, 0.98), xEnd = px(b, 0.72);
    var halfH = 40 * k;
    /* 导体全长（灰） */
    seg(ctx, x0, y - halfH, xRight, y - halfH, { color: 'rgba(255,255,255,0.35)', w: 2.6 * k });
    seg(ctx, x0, y + halfH, xRight, y + halfH, { color: 'rgba(255,255,255,0.35)', w: 2.6 * k });
    /* 电子柱 vt：从右端向左延伸，长度 ∝ t */
    var xL = xRight - (xRight - xEnd) * Math.max(0.02, S.tFrac);
    ctx.save();
    ctx.fillStyle = 'rgba(240,172,95,0.18)';
    ctx.fillRect(xL, y - halfH, xEnd - xL, halfH * 2);
    ctx.strokeStyle = C.gold; ctx.lineWidth = 2.4 * k;
    ctx.strokeRect(xL, y - halfH, xEnd - xL, halfH * 2);
    ctx.restore();
    seg(ctx, xEnd, y - halfH - 12 * k, xEnd, y + halfH + 12 * k, { color: C.gold, w: 2 * k });
    var nx = (xL + xEnd) / 2;
    txt(ctx, 'vt', nx, y, { size: 15 * k, align: 'center', color: C.gold, w: 700 });
    txt(ctx, '左端横截面', xEnd, y - halfH - 26 * k, { size: 12 * k, align: 'center', color: C.grey });
    /* 电子点阵 */
    for (var i = 0; i < 4; i++) for (var j = 0; j < 3; j++) {
      var xx = xL + (xEnd - xL) * (i + 0.5) / 4, yy = y - halfH * 0.6 + j * halfH * 0.6;
      K.chargeDot(ctx, xx, yy, 3.4 * k, 'neg', { ring: false });
    }
    /* 四步链 */
    var cx = px(b, 0.78), cy = py(b, 0.14);
    var rows = [['vt', '导体的长度'], ['Svt', '导体的体积'], ['nSvt', '自由电子总数'], ['neSvt', '总电荷量']];
    for (var m = 0; m < rows.length; m++) {
      var on = S.chainOn > m;
      txt(ctx, rows[m][0], cx, cy + m * 40 * k, { size: 15 * k, color: on ? C.gold : 'rgba(255,255,255,0.35)', w: on ? 700 : 400 });
      txt(ctx, rows[m][1], cx + 62 * k, cy + m * 40 * k, { size: 12.5 * k, color: on ? C.white : 'rgba(255,255,255,0.35)' });
    }
    mtxt(ctx, 'I = neSv', px(b, 0.66), py(b, 0.90), { size: 20 * k });
    txt(ctx, 'n 是单位体积内的自由电子数', px(b, 0.66) + 92 * k, py(b, 0.90), { size: 12.5 * k, color: C.grey });
    tapRing(ctx, xL - 6 * k, y - halfH - 8 * k, (xEnd - xL) + 12 * k, halfH * 2 + 16 * k, { k: k });
  }

  /* =====================================================================
     场景 15 · 定量算例：铜导线中电子跑多慢（环节⑤）
     ===================================================================== */
  function scDriftNum(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption, grid: true });
    var y = py(b, 0.30), x0 = px(b, 0.05), x1 = px(b, 0.95);
    seg(ctx, x0, y - 36 * k, x1, y - 36 * k, { color: C.white, w: 3 * k });
    seg(ctx, x0, y + 36 * k, x1, y + 36 * k, { color: C.white, w: 3 * k });
    txt(ctx, '铜导线   S = 1 mm²', (x0 + x1) / 2, y - 56 * k, { size: 13 * k, align: 'center', color: C.white });
    /* 缓慢爬行的电子 */
    var nE = 6;
    for (var i = 0; i < nE; i++) {
      var tt = ((i / nE) + S.slowPhase) % 1;
      K.chargeDot(ctx, x0 + (x1 - x0) * tt, y, 4.4 * k, 'neg', { ring: false, glow: i === 0 });
    }
    arrow(ctx, x0 + 30 * k, y - 16 * k, x0 + 78 * k, y - 16 * k, C.mark, 2 * k);
    txt(ctx, 'v = ' + P.sci(S.vDrift, 2) + ' m/s', x0 + 26 * k, y - 34 * k, { size: 13 * k, color: C.gold, w: 600 });
    tapRing(ctx, x0 - 12 * k, y - 50 * k, (x1 - x0) + 24 * k, 100 * k, { k: k });
    tapRing(ctx, px(b, 0.56), py(b, 0.48), 290 * k, (b.y1 - b.y0) * 0.34, { k: k });
    readoutBlock(ctx, px(b, 0.58), py(b, 0.52), 250 * k, [
      ['电流 I', P.fmt(S.Idrift, 1) + ' A', C.gold],
      ['横截面积 S', '1.0 mm² = 1.0×10⁻⁶ m²'],
      ['电子数密度 n', P.sci(S.nCu, 2) + ' m⁻³'],
      ['定向速率 v = I/(neS)', P.sci(S.vDrift, 2) + ' m/s', C.gold],
      ['穿过 1 m 需时', P.fmt(S.tTransit / 3600, 2) + ' 小时', C.mark]
    ], { k: k });
  }

  /* =====================================================================
     场景 16 · 灯为什么立刻亮：电场以光速建立（环节⑤）
     ===================================================================== */
  function scLightSpeed(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var x0 = px(b, 0.05), x1 = px(b, 0.95), y = py(b, 0.34);
    seg(ctx, x0, y, x1, y, { color: C.white, w: 3 * k });
    K.batterySymbol(ctx, x0 + 6 * k, y, { color: C.orange, w: 3.4 * k });
    lamp(ctx, x1 - 24 * k, y, 15 * k, { on: true, w: 2 * k });
    txt(ctx, '开关一合，灯就亮', (x0 + x1) / 2, y - 34 * k, { size: 13 * k, align: 'center', color: C.gold, w: 600 });
    /* 两条时间条（对数刻度） */
    var ty1 = py(b, 0.58), ty2 = py(b, 0.74), bw = 320 * k, bx0 = px(b, 0.10);
    var lg = function (t) { return (Math.log(t) - Math.log(1e-10)) / (Math.log(10) - Math.log(1e-10)); };
    txt(ctx, '电场建立 t = L/c', bx0, ty1 - 16 * k, { size: 12.5 * k, color: C.cyan });
    seg(ctx, bx0, ty1, bx0 + bw, ty1, { color: 'rgba(255,255,255,0.3)', w: 3 * k });
    seg(ctx, bx0, ty1, bx0 + bw * lg(S.tField), ty1, { color: C.cyan, w: 4 * k });
    txt(ctx, P.sci(S.tField, 1) + ' s', bx0 + bw + 10 * k, ty1, { size: 12.5 * k, color: C.cyan });
    txt(ctx, '电子跑完全程 t = L/v', bx0, ty2 - 16 * k, { size: 12.5 * k, color: C.gold });
    seg(ctx, bx0, ty2, bx0 + bw, ty2, { color: 'rgba(255,255,255,0.3)', w: 3 * k });
    seg(ctx, bx0, ty2, bx0 + bw * lg(S.tTransit), ty2, { color: C.gold, w: 4 * k });
    txt(ctx, P.fmt(S.tTransit / 3600, 2) + ' 小时', bx0 + bw + 10 * k, ty2, { size: 12.5 * k, color: C.gold });
    txt(ctx, '对数时间轴（10⁻¹⁰ s → 10 s）', bx0, py(b, 0.90), { size: 12 * k, color: C.grey });
    txt(ctx, '“电流传得快”是电场建立得快，不是电子跑得快', px(b, 0.62), py(b, 0.06),
      { size: 13.5 * k, align: 'center', color: C.gold, w: 600 });
    tapRing(ctx, x0 - 14 * k, y - 30 * k, (x1 - x0) + 28 * k, 60 * k, { k: k });
  }

  /* =====================================================================
     场景 17 · STSE：电池容量就是电荷量（环节⑥）
     ===================================================================== */
  function scCapacity(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption, grid: true });
    var cx = px(b, 0.16), cy = py(b, 0.34);
    /* 电池组 */
    ctx.save();
    ctx.fillStyle = 'rgba(248,128,8,0.14)';
    ctx.fillRect(cx - 46 * k, cy - 70 * k, 92 * k, 140 * k);
    ctx.strokeStyle = C.orange; ctx.lineWidth = 2.4 * k;
    ctx.strokeRect(cx - 46 * k, cy - 70 * k, 92 * k, 140 * k);
    ctx.restore();
    txt(ctx, '动力电池组', cx, cy - 84 * k, { size: 12.5 * k, align: 'center', color: C.orange });
    txt(ctx, P.fmt(S.capAh, 0) + ' A·h', cx, cy, { size: 17 * k, align: 'center', color: C.gold, w: 700 });
    /* 电量条 */
    var barW = 150 * k, barX = px(b, 0.40), barY = py(b, 0.20);
    seg(ctx, barX, barY, barX + barW, barY, { color: 'rgba(255,255,255,0.3)', w: 8 * k });
    seg(ctx, barX, barY, barX + barW * S.soc, barY, { color: C.gold, w: 8 * k });
    txt(ctx, '放电进度', barX, barY - 18 * k, { size: 12.5 * k, color: C.grey });
    /* 车 + 里程 */
    var vx = px(b, 0.42), vy = py(b, 0.58);
    ctx.save();
    ctx.strokeStyle = C.white; ctx.lineWidth = 2 * k;
    ctx.beginPath();
    ctx.moveTo(vx, vy); ctx.lineTo(vx + 90 * k, vy);
    ctx.lineTo(vx + 78 * k, vy - 26 * k); ctx.lineTo(vx + 18 * k, vy - 26 * k);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(vx + 20 * k, vy + 8 * k, 8 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(vx + 68 * k, vy + 8 * k, 8 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    txt(ctx, '续航 ' + P.fmt(S.rangeKm, 0) + ' km', vx + 106 * k, vy - 10 * k, { size: 14 * k, color: C.gold, w: 700 });
    tapRing(ctx, cx - 56 * k, cy - 80 * k, 112 * k, 160 * k, { k: k });
    tapRing(ctx, barX - 12 * k, barY - 26 * k, barW + 24 * k, 52 * k, { k: k });
    tapRing(ctx, vx - 14 * k, vy - 40 * k, 190 * k, 76 * k, { k: k });
    readoutBlock(ctx, px(b, 0.60), py(b, 0.72), 250 * k, [
      ['容量 q', P.sci(S.capC, 3) + ' C', C.gold],
      ['放电时间 t', P.fmt(S.capT, 1) + ' h'],
      ['电流 I = q/t', P.fmt(S.Icap, 2) + ' A', C.gold],
      ['车速 v', P.fmt(S.kmh, 0) + ' km/h'],
      ['续航 s = v·t', P.fmt(S.rangeKm, 0) + ' km', C.gold]
    ], { k: k });
  }

  /* =====================================================================
     场景 18 · 因果链五格收束（环节⑦）
     ===================================================================== */
  function scChain(ctx, W, H, S) {
    var k = sc(H), b = bx(W, H, { l: 0.36, r: 0.955 });
    frame(ctx, W, H, S, { bullets: S.bullets, caption: S.caption });
    var items = ['电源搬运电荷', '两极电势差不变', '导体内部恒定电场', '定向移动＋碰撞', '恒定电流'];
    var n = items.length, y0 = py(b, 0.10), h = (b.y1 - b.y0) * 0.19;
    for (var i = 0; i < n; i++) {
      var on = S.chainP > i;
      var y = y0 + i * (h + 14 * k);
      ctx.save();
      ctx.fillStyle = on ? 'rgba(240,172,95,0.14)' : 'rgba(255,255,255,0.04)';
      ctx.fillRect(b.x0 + 10 * k, y, b.x1 - b.x0 - 20 * k, h);
      ctx.strokeStyle = on ? C.gold : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = on ? 2.2 * k : 1.4 * k;
      ctx.strokeRect(b.x0 + 10 * k, y, b.x1 - b.x0 - 20 * k, h);
      ctx.restore();
      txt(ctx, String(i + 1), b.x0 + 40 * k, y + h / 2, { size: 18 * k, align: 'center', color: on ? C.gold : 'rgba(255,255,255,0.4)', w: 700 });
      txt(ctx, items[i], b.x0 + 72 * k, y + h / 2, { size: 16 * k, color: on ? C.white : 'rgba(255,255,255,0.45)', w: on ? 600 : 400 });
      if (i < n - 1) arrow(ctx, b.x0 + 24 * k, y + h + 2 * k, b.x0 + 24 * k, y + h + 12 * k, on ? C.gold : 'rgba(255,255,255,0.3)', 1.8 * k);
    }
    txt(ctx, 'I = q/t 定量描述它的强弱', px(b, 0.86), py(b, 0.02), { size: 13 * k, color: C.gold, w: 600 });
  }

  var SCENES = {
    intro: scIntro, transient: scTransient, source: scSource, pump: scPump,
    field: scField, flow: scFlow, ammeter: scAmmeter, sawtooth: scSawtooth,
    steady: scSteady, define: scDefine, units: scUnits, crosssec: scCrossSec,
    electrolyte: scElectrolyte, micro: scMicro, driftnum: scDriftNum,
    lightspeed: scLightSpeed, capacity: scCapacity, chain: scChain
  };

  global.DCREND = {
    SCENES: SCENES, frame: frame, sc: sc, txt: txt, mtxt: mtxt, seg: seg, arrow: arrow,
    readoutBlock: readoutBlock, flow: flow, flowPos: flowPos, lamp: lamp, ammeter: ammeter,
    cell: cell, fitCanvas: function (cv, ctx) { return K.fitCanvas(cv, ctx); },
    makeCam: K.makeCam
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>/* =====================================================================
   viz_dc_steps.js —— 11.1 电源和电流 · 步骤数据（一步一个对象）

     ① 情境引入 ② 电源与电场 ③ 恒定电场与恒定电流 ④ 电流的强弱
     ⑤ 微观解释 ⑥ STSE 容量 ⑦ 课堂小结
   ===================================================================== */
(function (global) {
  'use strict';

  var ACTS = {
    a1: { name: '情境引入', en: 'From Lightning to Lamp' },
    a2: { name: '电源与电场', en: 'The Power Source' },

    a5: { name: '微观解释', en: 'Microscopic Picture' },
    a6: { name: 'STSE · 电池容量', en: 'Battery Capacity' },
    a7: { name: '课堂小结', en: 'Summary' }
  };

  var STEPS = [
    /* ---------------- 幕一 · 情境引入（环节①） ---------------- */
    {
      act: 'a1', title: '闪电只有一瞬间，灯泡为什么一直亮',
      hint: '拖「摇动速度」看火花闪不闪；右边的小灯泡始终亮着',
      note: '电闪雷鸣时，强大的电流只能存在于一瞬间；而手电筒里的小灯泡却能持续发光。' +
            '两者到底差在哪？—— 差在**能不能一直把电荷补上**。这节课就用一条因果链回答：**电流怎样才能持续？**',
      formula: '主问题：电流怎样才能持续？',
      allow: { spark: { label: '摇动起电机速度', min: 0, max: 1, step: 0.05 } },
      scene: 'intro',
      bullets: [{ text: '火花放电：电流只存在一瞬间' }, { text: '小灯泡：电流持续不断' }, { text: '差别在“能不能一直补上电荷”' }],
      caption: '闪电一瞬间，灯泡一直亮 —— 这节课只解决一个问题：电流怎样才能持续？',
      init: function (S) { S.spark = 0.6; }
    },
    {
      act: 'a1', title: 'A 带正电、B 带负电，用导线 H 连起来会怎样',
      hint: '拖「时间进度」，看两极电压和电流一起衰减到零',
      note: '这是第九章学过的东西：自由电子从 B 跑到 A，A 得到电子、B 失去电子，' +

<script>/* =====================================================================

(function (global) {
  'use strict';
  var R = global.DCREND, P = global.DCPHYS, Sd = global.DCSTEPS, HD = global.DCHOT;

  /* 固定相位：保证前进/后退像素指纹逐字节一致（禁止不受控的自动动画） */
  var PHASE = 0.17, PHASE2 = 0.62;

  var BASE = {
    spark: 0.6,
    tn: 0, U0: 300,
    pump: 1.0,
    flowq: 0.7,
    driftPhase: 0.35,
    Uwire: 5, Efield: 17.5,         // mV/m

    Idefine: 1.0, tdefine: 4,

    elecEquiv: true,  // 步 15：等效(相加) / 抵消(错误说法)

  var CLICK_RESET = JSON.stringify(CLICK);

  function derive(s) {
    var o = {}, q;
    for (q in s) if (s.hasOwnProperty(q)) o[q] = s[q];

    var act = ACTS[STEPS[s.step].act];
    o.actName = act.name; o.actEn = act.en; o.actKey = STEPS[s.step].act;
    o.flowPhase = PHASE;
    o.pumpPhase = PHASE2;
    o.slowPhase = 0.08;

    /* —— 瞬间电流：RC 放电 —— */
    var tau = P.tauRC(R_WIRE, C_SYS);
    var tt = s.tn * 5 * tau;
    o.tau = tau; o.tt = tt;
    o.frac = Math.exp(-tt / tau);                  // U/U₀
    o.U = s.U0 * o.frac;
    o.I = o.U / R_WIRE;
    o.qPass = P.dischargeTotalCharge(s.U0, C_SYS) * (1 - o.frac);
    o.nA = Math.max(0, Math.round(6 * o.frac));

    o.sparkOn = s.spark < 0.05 ? 0 : Math.min(1, 0.35 + 0.65 * s.spark);

    /* —— 导线内部场强 —— */
    o.Ewire = s.Uwire / L_SEG;
    /* —— 电流表 —— */
    o.Iamm = s.Uamm / R_LAMP;
    o.needle = clamp(o.Iamm / 3, 0, 1);

    /* —— 加速—碰撞 —— */
    o.EfieldmV = s.Efield;                          // mV/m（滑杆量纲）
    o.EfieldV = s.Efield / 1000;                    // V/m
    o.aAcc = P.accel(o.EfieldV);
    o.vpeak = P.peakSpeed(o.EfieldV);
    o.vavg = P.avgDrift(o.EfieldV);
    o.vScale = clamp(s.Efield / 50, 0.28, 1);

    /* —— 定义式 —— */
    o.qDefine = P.charge(s.Idefine, s.tdefine);
    o.nDefine = P.electrons(o.qDefine);

    /* —— 单位 —— */
    var uname = ['A', 'mA', 'μA'][s.unitIdx] || 'A';
    o.unitName = uname;
    o.Iampere = P.toAmpere(s.Iunit, uname);

    /* —— 横截面 —— */
    o.cosT = P.crossFactor(s.theta);
    o.isCross = P.isCrossSection(s.theta);

    /* —— 电解液 —— */
    o.qsum = P.electrolyteCharge(s.q1, -s.q2);

    /* —— 微观链 —— */
    o.chainOn = Math.min(4, Math.floor(s.tFrac * 4) + 1);

    /* —— 算例 —— */
    o.nCu = P.copperCarrierDensity();
    o.vDrift = P.driftSpeed(s.Idrift, o.nCu, 1e-6);
    o.tTransit = P.transitTime(1, o.vDrift);

    /* —— 灯立刻亮 —— */
    o.Lwire = Math.pow(10, s.lenL);
    o.tField = P.fieldTime(o.Lwire);
    o.tTransit2 = P.transitTime(o.Lwire, P.driftSpeed(1, o.nCu, 1e-6));
    o.tTransit = o.tTransit2;

    /* —— STSE —— */
    o.capC = P.capacityCharge(s.capAh);
    o.tSec = s.capT * 3600;
    o.Icap = P.dischargeCurrent(o.capC, o.tSec);
    o.rangeKm = P.enduranceKm(s.kmh, o.capC, o.Icap);
    o.soc = 0.72;

    /* —— 因果链 —— */
    o.chainP = s.chainP;
    /* —— 点选层状态（渲染层只读） —— */
    o.revealedP = CLICK.revealedP;
    o.whyCharge = CLICK.whyCharge;
    o.elecEquiv = CLICK.elecEquiv;
    o.lampOn = CLICK.lampOn;
    o.sparkPoke = CLICK.sparkPoke;
    o.cardVote = CLICK.cardVote;
    return o;
  }
  function apply(s, i) {
    s.step = clamp(i, 0, STEPS.length - 1);

    resetClicks();
    S = derive(s);

  }

  var cv = $('stage'), ctx = cv.getContext('2d');
  var lastFit = null;
  function draw() {
    var def = STEPS[st.step];
    S = derive(st);
    S.bullets = def.bullets; S.caption = def.caption;
    S.tapList = (HD.HOTSPOTS[def.scene] || []);
    updatePanel(); markToc();          /* 先建控件 → 底栏高度定下来（避免画布慢一帧） */
    var f = R.fitCanvas(cv, ctx);
    lastFit = f;
    ctx.clearRect(0, 0, f.W, f.H);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, f.W, f.H);

    updateControls();

  }

  function kv(k, v, c) {
    return '<div class="kv"><span>' + k + '</span><b' + (c ? ' style="color:' + c + '"' : '') + '>' + v + '</b></div>';
  }
  /* 右栏读数：按场景给该屏真正要看的量 */
  function readRows(x) {
    switch (STEPS[x.step].scene) {
      case 'intro': return [['火花放电', x.sparkOn > 0.02 ? '正在放电' : '等待'], ['小灯泡', '一直亮']];
      case 'transient': return [['两极电势差 U', P.fmt(x.U, 1) + ' V'], ['导线电流 I', P.fmt(x.I, 2) + ' A'],
        ['经过的电荷 q', P.fmt(x.qPass, 4) + ' C'], ['两极电荷量', x.nA + ' / 6 格']];
      case 'source': return [['装置 P 搬运速率', P.fmt(x.pumpSpeed, 2) + ' A'], ['导线流失速率', '1.00 A'],
        ['两极电荷量', x.steady ? '保持不变' : '正在失衡'], ['导线电流 I', x.steady ? '1.00 A' : P.fmt(x.I, 2) + ' A']];
      case 'pump': return [['抽水流量', P.fmt(x.flowq, 2)], ['维持结果', '水位差 / 电势差 都不变']];
      case 'field': return [['导线两端电压 U', P.fmt(st.Uwire, 1) + ' V'], ['导线长度 L', '0.10 m'],
        ['内部场强 E = U/L', P.fmt(x.Ewire, 1) + ' V/m'], ['静电平衡时 E', '0（形成冲突）']];
      case 'flow': return [['电荷分布', '不随时间变化'], ['电场 E', '不随时间变化'], ['电子运动', '一直在定向移动']];
      case 'ammeter': return [['电源电压 U', P.fmt(st.Uamm, 1) + ' V'], ['电路总电阻', '2 Ω'],
        ['电流 I = U/R', P.fmt(x.Iamm, 3) + ' A'], ['电流表示数', '保持恒定']];
      case 'sawtooth': return [['导体内部场强 E', P.fmt(st.Efield, 1) + ' mV/m'], ['加速度 a = eE/m', P.sci(x.aAcc, 2) + ' m/s²'],
        ['峰值速率', P.sci(x.vpeak, 2) + ' m/s'], ['平均速率 v̄', P.sci(x.vavg, 2) + ' m/s'], ['v̄ 随时间', '不变化']];
      case 'steady': return [['当前电流类型', x.mode === 1 ? '恒定电流' : '交变电流'], ['大小', x.mode === 1 ? '不随时间变化' : '随时间变化'],
        ['方向', x.mode === 1 ? '不随时间变化' : '随时间变化']];
      case 'define': return [['电流 I', P.fmt(st.Idefine, 2) + ' A'], ['时间 t', P.fmt(st.tdefine, 1) + ' s'],
        ['电荷量 q = It', P.fmt(x.qDefine, 3) + ' C'], ['电子数 n = q/e', P.sci(x.nDefine, 2) + ' 个']];
      case 'units': return [['当前单位', x.unitName], ['数值', P.fmt(st.Iunit, 2) + ' ' + x.unitName],
        ['换算为 A', P.sci(x.Iampere, 3) + ' A'], ['练习1 电荷量', '1.6×10⁻⁴ C'], ['练习1 电子数', '1.0×10¹⁵ 个']];
      case 'crosssec': return [['截面倾角 θ', P.fmt(st.theta, 0) + '°'], ['有效占比 cosθ', P.fmt(x.cosT, 3)],
        ['是否横截面', x.isCross ? '是' : '不是'], ['判据', '垂直于电流方向']];
      case 'electrolyte': return [['正离子 q₁', P.fmt(st.q1, 1) + ' C'], ['负离子 |q₂|', P.fmt(st.q2, 1) + ' C'],
        ['合计 q = |q₁|+|q₂|', P.fmt(x.qsum, 1) + ' C'], ['电流方向', '与正离子移动方向相同']];
      case 'micro': return [['时间 t 占比', P.fmt(st.tFrac, 2)], ['电子柱长度 vt', '已点亮 ' + x.chainOn + ' / 4 步'],
        ['n 的意义', '单位体积内的自由电子数']];
      case 'driftnum': return [['电流 I', P.fmt(st.Idrift, 1) + ' A'], ['电子数密度 n', P.sci(x.nCu, 2) + ' m⁻³'],
        ['定向速率 v', P.sci(x.vDrift, 2) + ' m/s'], ['穿过 1 m 需', P.fmt(x.tTransit / 3600, 2) + ' 小时']];
      case 'lightspeed': return [['导线长度 L', P.fmt(x.Lwire, 0) + ' m'], ['电场建立 L/c', P.sci(x.tField, 2) + ' s'],
        ['电子跑完 L/v', P.fmt(x.tTransit / 3600, 2) + ' 小时'], ['两者相差', P.sci(x.tTransit / x.tField, 1) + ' 倍']];
      case 'capacity': return [['容量 q', P.sci(x.capC, 3) + ' C'], ['放电时间 t', P.fmt(st.capT, 1) + ' h'],
        ['电流 I = q/t', P.fmt(x.Icap, 2) + ' A'], ['车速 v', P.fmt(st.kmh, 0) + ' km/h'], ['续航 s = v·t', P.fmt(x.rangeKm, 0) + ' km']];
      case 'chain': return [['已点亮格数', P.fmt(st.chainP, 0) + ' / 5'], ['收束公式', 'I = q/t（拓展 I = neSv）']];

  function updatePanel() {

          ({ poke: '点了一下', reveal: '揭晓', pick: '选择', quiz: '判断' }[CLICK.kind] || '点选') +
          '</b><br>' + CLICK.msg;

    var extra = EXTRA_BTNS[def.scene] ? '<br><span style="color:#8f8f8f">按钮带里还有：前概念卡片投票</span>' : '';
    $('pTap').innerHTML = hs.length ? (tip + extra) : '<span style="color:#8f8f8f">这一步以拖动为主，画布上没有可点对象</span>';

  }

  var CBAR = {};

    var hs = (HD.HOTSPOTS[def.scene] || []).slice();
    var ex = EXTRA_BTNS[def.scene] || [];
    var sig = st.step + '|' + hs.map(function (h) { return h.act; }).join(',') + '|' + ex.length;
    if (CBAR.sig === sig) return;

      var b = document.createElement('button');
      b.className = 'b tap';
      b.textContent = '● ' + h.label;

        } else {

  function dispOf(key) {

      return st[key] ? '恒定电流' : '交变电流';
    }
    var a = it.a, v = st[key], unit = a.unit ? ' ' + a.unit : '';
    switch (key) {
      case 'spark': return (v * 100).toFixed(0) + ' %';
      case 'flowq': return (v * 100).toFixed(0) + ' %';
      case 'tn': case 'driftPhase': case 'tFrac': return P.fmt(v, 2);
      case 'lenL': return '10^' + P.fmt(v, 2) + ' m';
      case 'chainP': return P.fmt(v, 0) + ' / 5';

    stepMeta: function () {
      return STEPS.map(function (d, i) {
        return { i: i, act: d.act, title: d.title, scene: d.scene, allow: Object.keys(d.allow || {}), hint: d.hint || '' };
      });
    },
    consistency: function () {
      var fwd = [], bwd = [], out = [], i;
      for (i = 0; i < STEPS.length; i++) { go(i); fwd.push(hash()); }
      for (i = STEPS.length - 1; i >= 0; i--) { go(i); bwd[i] = hash(); }
      for (i = 0; i < STEPS.length; i++) if (fwd[i] !== bwd[i]) out.push({ step: i, fwd: fwd[i], bwd: bwd[i] });
      return { steps: STEPS.length, mismatches: out.length, detail: out };
    }
  };

  $('btnNext').addEventListener('click', next);
  $('btnPrev').addEventListener('click', prev);
  $('btnReset').addEventListener('click', resetStep);
  $('prog').addEventListener('click', function (ev) {
    var r = this.getBoundingClientRect();
    go(Math.floor(clamp((ev.clientX - r.left) / r.width, 0, 0.999) * STEPS.length));
  });
  cv.addEventListener('mousedown', startDrag);
  cv.addEventListener('touchstart', startDrag, { passive: false });
  global.addEventListener('mousemove', moveDrag);
  global.addEventListener('touchmove', moveDrag, { passive: false });
  global.addEventListener('mouseup', endDrag);
  global.addEventListener('touchend', endDrag);
  global.addEventListener('keydown', key);
  global.addEventListener('resize', function () { draw(); });

  buildToc();
  apply(st, 0);
  draw();
  setTimeout(draw, 80);
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
