<script>/* =====================================================================
   viz_dc_physics.js —— 11.1 电源和电流 · 物理内核（纯函数，与画面完全解耦）
   依据：人教2019版必修第三册 P53–P56；教师用书 P73–P77；
        教案《11.1 电源和电流 · 教学设计》环节①—⑦
   约定：中学取值 e = 1.6×10⁻¹⁹ C，N_A = 6.02×10²³ mol⁻¹，c = 3.0×10⁸ m/s
   ===================================================================== */
(function (global) {
  'use strict';

  var E_CHARGE = 1.6e-19;      // 元电荷 (C)
  var C_LIGHT = 3.0e8;         // 电场建立速率 (m/s)
  var M_E = 9.11e-31;          // 电子质量 (kg)
  /* 铜中自由电子平均自由时间 (s)。取 4.858×10⁻¹⁴ s 的依据：
     1 m 铜导线（S = 1 mm²）通 1 A 时 v = I/(neS) = 7.47×10⁻⁵ m/s、E = 0.0175 V/m，
     由 v̄ = eEτ/(2m) 反解 τ = 2mv/(eE) = 4.858×10⁻¹⁴ s —— 让“加速—碰撞”模型与
     宏观的 I = neSv 在同一组数上自洽（见 runSelfTest 第 26 条断言）。 */
  var TAU_CU = 4.858e-14;
  var RHO_CU = 8.9e3;          // 铜密度 (kg/m³)
  var M_CU = 6.4e-2;           // 铜摩尔质量 (kg/mol)
  var NA = 6.02e23;            // 阿伏加德罗常数 (1/mol)

  /* ---------------- 数值格式（右栏读数用） ---------------- */
  function fmt(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x !== 0 && (Math.abs(x) < 1e-3 || Math.abs(x) >= 1e5)) return sci(x, n);
    return Number(x.toFixed(n)).toString();
  }
  function sci(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x === 0) return '0';
    var e = Math.floor(Math.log(Math.abs(x)) / Math.LN10);
    var m = x / Math.pow(10, e);
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return Number(m.toFixed(n)) + '×10' + sup(e);
  }
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function sup(n) {
    return String(n).split('').map(function (c) { return SUPS[c] || c; }).join('');
  }

  /* ---------------- 一、电流的定义式 I = q/t ---------------- */
  /* 通过横截面的电荷量 */
  function charge(I, t) { return I * t; }
  /* 电流（定义式）。t=0 视为无意义，按 0 处理避免除零 */
  function current(q, t) { return t > 0 ? q / t : 0; }
  /* 通过的电子个数（取电荷量绝对值） */
  function electrons(q) { return Math.abs(q) / E_CHARGE; }
  /* 由电流与时间反推电荷量（等价 charge） */
  function chargeFromCurrent(I, t) { return I * t; }

  /* ---------------- 二、单位换算 ---------------- */
  var UNITS = { 'A': 1, 'mA': 1e-3, 'μA': 1e-6 };
  function toAmpere(v, unit) { return v * (UNITS[unit] || 1); }
  function fromAmpere(I, unit) { return I / (UNITS[unit] || 1); }
  function convertUnit(v, from, to) { return v * (UNITS[from] || 1) / (UNITS[to] || 1); }

  /* ---------------- 三、横截面（易错点①） ---------------- */
  /* 面元与电流方向成 theta（度）时，真正“数得到电荷”的投影面积 */
  function effArea(S, thetaDeg) { return S * Math.abs(Math.cos(thetaDeg * Math.PI / 180)); }
  /* 同一段时间内，穿过斜截面被计入的电荷量之比 = cosθ */
  function crossFactor(thetaDeg) { return Math.abs(Math.cos(thetaDeg * Math.PI / 180)); }
  /* 判定：只有 θ = 0（截面垂直于电流方向）才是横截面 */
  function isCrossSection(thetaDeg, tol) { return Math.abs(thetaDeg) <= (tol == null ? 0.5 : tol); }

  /* ---------------- 四、正负离子同时移动（易错点②） ---------------- */
  /* q₁ 沿电流方向（正离子）、q₂ 沿电流反方向（负离子）：取绝对值之和，不是相减 */
  function electrolyteCharge(q1, q2) { return Math.abs(q1) + Math.abs(q2); }
  /* 约定方向：正电荷定向移动方向为电流方向；负电荷反向移动与正向移动等效 */
  function directionByConvention(carrierSign, moveDir) { return carrierSign > 0 ? moveDir : -moveDir; }

  /* ---------------- 五、微观解释 I = neSv ---------------- */
  /* 载流子数密度：n = ρN_A / M */
  function carrierDensity(rho, M) { return rho * NA / M; }
  /* 铜的自由电子数密度（每个铜原子贡献一个自由电子） */
  function copperCarrierDensity() { return carrierDensity(RHO_CU, M_CU); }
  /* 定向移动速率 v = I /(neS) */
  function driftSpeed(I, n, S) { return I / (n * E_CHARGE * S); }
  /* 由微观量算电流 I = neSv */
  function currentFromDrift(n, S, v) { return n * E_CHARGE * S * v; }
  /* 四步推导链：一段导体中的电子柱 */
  function microChain(t, v, S, n) {
    var L = v * t;             // vt   —— 导体长度
    var Vol = S * L;           // Svt  —— 体积
    var N = n * Vol;           // nSvt —— 自由电子总数
    var q = N * E_CHARGE;      // neSvt—— 总电荷量
    return { L: L, Vol: Vol, N: N, q: q, I: t > 0 ? q / t : 0 };
  }
  /* 电子穿过一段导体所需时间（教材 P55 的“几个小时”） */
  function transitTime(L, v) { return v > 0 ? L / v : Infinity; }
  /* 电场建立的时间（以光速传播） */
  function fieldTime(L) { return L / C_LIGHT; }

  /* ---------------- 六、加速—碰撞（恒定电流的成因） ---------------- */
  function accel(E) { return E_CHARGE * E / M_E; }              // a = eE/m
  function peakSpeed(E, tau) { return accel(E) * (tau == null ? TAU_CU : tau); }
  function avgDrift(E, tau) { return 0.5 * peakSpeed(E, tau); }  // 半个周期的平均
  /* 稳态平均速率与时间无关 —— 本节的“恒定”依据 */
  function steadyAvg(t, E, tau) { return avgDrift(E, tau); }

  /* ---------------- 七、瞬间电流（电容器放电，环节①） ---------------- */
  function rcDecay(U0, R, C, t) { return U0 * Math.exp(-t / (R * C)); }
  function rcCurrent(U0, R, C, t) { return (U0 / R) * Math.exp(-t / (R * C)); }
  function tauRC(R, C) { return R * C; }
  /* 两极间电势差消失时，电流穿过的电荷总量 q = ∫I dt = U0·C */
  function dischargeTotalCharge(U0, C) { return U0 * C; }

  /* ---------------- 八、STSE：容量、续航 ---------------- */
  function capacityCharge(Ah) { return Ah * 3600; }                       // 1 A·h = 3600 C
  function dischargeCurrent(capC, tSec) { return tSec > 0 ? capC / tSec : 0; }
  /* 续航里程 s = v·t，t = q/I */
  function enduranceKm(kmh, capC, I) { return I > 0 ? kmh * (capC / I) / 3600 : 0; }
  /* 手机说明书：容量 4000 mA·h，待机 22 天 / 播放视频 17 h 的电流 */
  function standbyCurrent(mAh, hours) { return mAh / hours; }             // mA

  /* ---------------- 九、自检 ---------------- */
  function runSelfTest() {
    var R = [], fails = [];
    function chk(name, got, want, tol) {
      var ok = Math.abs(got - want) <= (tol == null ? 0 : tol);
      R.push({ name: name, got: got, want: want, ok: ok });
      if (!ok) fails.push(R[R.length - 1]);
    }
    function chkTrue(name, cond) {
      R.push({ name: name, got: !!cond, want: true, ok: !!cond });
      if (!cond) fails.push(R[R.length - 1]);
    }

    /* —— 定义式 I = q/t —— */
    chk('I = q/t：1 C 在 2 s 内 → 0.5 A', current(1, 2), 0.5, 1e-12);
    chk('q = It：0.3 A × 10 s = 3 C', charge(0.3, 10), 3, 1e-12);
    chk('t = 0 时电流按 0 处理（不抛错）', current(1, 0), 0, 0);
    chk('负电荷量取绝对值算电子数', electrons(-1.6e-19), 1, 1e-12);
    /* 教材练习第 1 题：50 μA × 3.2 s */
    var q1 = charge(toAmpere(50, 'μA'), 3.2);
    chk('练习1：50 μA × 3.2 s = 1.6×10⁻⁴ C', q1, 1.6e-4, 1e-12);
    chk('练习1：电子数 1.0×10¹⁵', electrons(q1), 1.0e15, 1e10);
    /* 教材练习第 2 题：0.3 A */
    chk('练习2：0.3 A', current(charge(0.3, 1), 1), 0.3, 1e-12);

    /* —— 单位 —— */
    chk('1 mA = 1×10⁻³ A', toAmpere(1, 'mA'), 1e-3, 1e-18);
    chk('1 μA = 1×10⁻⁶ A', toAmpere(1, 'μA'), 1e-6, 1e-21);
    chk('50 μA → A', toAmpere(50, 'μA'), 5e-5, 1e-18);
    chk('1 A → mA = 1000', convertUnit(1, 'A', 'mA'), 1000, 1e-9);
    chk('1 A·s = 1 C', capacityCharge(1 / 3600), 1, 1e-9);

    /* —— 横截面判据 —— */
    chk('θ = 0° 是横截面', isCrossSection(0) ? 1 : 0, 1, 0);
    chk('θ = 30° 不是横截面', isCrossSection(30) ? 1 : 0, 0, 0);
    chk('斜截面投影 S·cos60° = 0.5S', crossFactor(60), 0.5, 1e-12);
    chk('θ = 90° 投影为 0（数不到电荷）', effArea(1e-6, 90), 0, 1e-18);

    /* —— 正负离子 —— */
    chk('q₁=2C、q₂=−3C → q=5C（取绝对值之和）', electrolyteCharge(2, -3), 5, 1e-12);
    chk('负离子反向移动等效正向电流', directionByConvention(-1, -1), 1, 0);

    /* —— 微观解释 —— */
    var nCu = copperCarrierDensity();
    chk('铜的 n = ρN_A/M ≈ 8.37×10²⁸ m⁻³', nCu, 8.37156e28, 1e24);
    var vCu = driftSpeed(1, nCu, 1e-6);
    chk('I=1 A、S=1 mm² 时 v ≈ 7.5×10⁻⁵ m/s', vCu, 7.47e-5, 1e-6);
    chk('v 倒推 I = neSv 回到 1 A', currentFromDrift(nCu, 1e-6, vCu), 1, 1e-9);
    var mc = microChain(1, vCu, 1e-6, nCu);
    chk('四步链：q/t = I', mc.q / 1, 1, 1e-9);
    chk('四步链：L = vt', mc.L, vCu, 1e-15);
    chk('四步链：N = nSvt', mc.N, nCu * 1e-6 * vCu, 1e12);
    chk('1 m 导线电子穿越 ≈ 3.7 h', transitTime(1, vCu) / 3600, 3.72, 0.05);
    chkTrue('“几个小时”与教材一致（> 3600 s）', transitTime(1, vCu) > 3600);
    chk('电场建立 1 m 用时 = 3.33×10⁻⁹ s', fieldTime(1), 3.333e-9, 1e-12);
    chkTrue('电场比电子快 10¹² 量级', transitTime(1, vCu) / fieldTime(1) > 1e12);

    /* —— 加速—碰撞 —— */
    var aCu = accel(0.0175);
    chk('a = eE/m（E=0.0175 V/m）', aCu, 3.073e9, 1e8);
    chkTrue('平均速率与时间无关（稳态）', Math.abs(steadyAvg(1e-3, 1e3, TAU_CU) - steadyAvg(9, 1e3, TAU_CU)) < 1e-15);
    chkTrue('平均速率随 E 单调增', avgDrift(2e3, TAU_CU) > avgDrift(1e3, TAU_CU));
    /* 微观自洽：加速—碰撞模型给出的 v̄ 必须与 v = I/(neS) 对上 */
    chk('v̄ = eEτ/(2m) 与 v = I/(neS) 自洽', avgDrift(0.0175), driftSpeed(1, nCu, 1e-6), 2e-6);

    /* —— 瞬间电流 —— */
    chk('RC 放电 t = τ 时 U 降到 1/e', rcDecay(300, 1, 1e-4, 1e-4), 300 / Math.E, 1e-9);
    chk('t = 5τ 时电流不足初值 1%', rcCurrent(300, 1, 1e-4, 5e-4) / (300 / 1) < 0.01 ? 1 : 0, 1, 0);
    chk('放电总电荷 q = U₀C', dischargeTotalCharge(300, 1e-4), 0.03, 1e-12);

    /* —— STSE —— */
    chk('94 A·h = 3.384×10⁵ C', capacityCharge(94), 3.384e5, 1e-6);
    var capC = capacityCharge(94), tRun = 5 * 3600;
    chk('94 A·h 放电 5 h → I = 18.8 A', dischargeCurrent(capC, tRun), 18.8, 1e-9);

     参考片 BV1fnxdziE14 的签名手法就是"每个概念一段小动画、元素逐步叠加"。

     ① 可冻结的时钟 AN.t —— 所有持续运动（电荷流动、波前推进、指针阻尼）
        都从它派生；冻结后画面与时间无关，正反向像素指纹才能逐字节一致；
     ② 入场节拍器 AN.rise(起, 时长) —— 元素依次淡入浮起 = 逐步叠加；
     ③ 自动演示扫掠 AN.auto —— 把每一步的连续量按时间扫过（放电过程、

      Z.wirePath(ctx, [[ax, yB], [bx1, yB]], { w: 3 * k });
      Z.wirePath(ctx, [[ax, yB], [ax, pcy + ph / 2]], { w: 3 * k });
      Z.wirePath(ctx, [[bx1, yB], [bx1, pcy + ph / 2]], { w: 3 * k });
      Z.battery(ctx, bcx, yB, bw, bh, { k: k });
      Z.T(ctx, S.revealedP ? '电池（电源）' : '某种装置', bcx, yB + 40 * k, { size: 20 * k, align: 'center', color: K.dim });
    });
    /* ② 极板上的电荷（搬运够 = 不变；不够 = 一格一格掉） */
    D(ctx, S.r1, function () {
      Z.chargeColumn(ctx, ax - 12 * k, pcy - ph / 2 + 24 * k, pcy + ph / 2 - 24 * k, Math.max(1, S.nA), 'pos', { r: 4.6 * k });
      Z.chargeColumn(ctx, bx1 + 12 * k, pcy - ph / 2 + 24 * k, pcy + ph / 2 - 24 * k, Math.max(1, S.nB), 'neg', { r: 4.6 * k });
    });
    /* ③ 三条通道同时有电荷在跑：
          上导线 B→A（电子流失）、下导线 A→装置→B（装置在搬运）
          稳态时两者速率一致 ⇒ 画面上"来"和"去"看着是同一个节奏 */
    D(ctx, S.r2, function () {
      var dens = S.steady ? 6 : Math.max(2, Math.round(7 * Math.min(1, S.pumpSpeed / 1.0)));
      Z.chargeFlow(ctx, [[bx1, yT], [ax, yT]], dens, S.flowPhase, { kind: 'neg', r: 4.4 * k });
      Z.trailDot(ctx, [[bx1, yT], [ax, yT]], S.flowPhase, { r: 5, k: k });
      Z.chargeFlow(ctx, [[ax, yB], [bcx - bw / 2, yB]], 3, S.pumpPhase, { kind: 'neg', r: 4.4 * k });
      Z.chargeFlow(ctx, [[bcx + bw / 2, yB], [bx1, yB]], 3, S.pumpPhase, { kind: 'neg', r: 4.4 * k });
      /* 搬运速率指示：装置处一圈随搬运速率变强的光晕 */
      if (S.pumpSpeed > 0.05) {
        var g = ctx.createRadialGradient(bcx, yB, 0, bcx, yB, bw * 0.75);
        g.addColorStop(0, 'rgba(95,196,238,' + (0.18 * Math.min(1, S.pumpSpeed)).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save(); ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(bcx, yB, bw * 0.75, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      }
    });
    /* ④ 稳态判据打在画面上 */
    D(ctx, S.r3, function () {
      Z.T(ctx, S.steady ? '搬运 1.00 A ＝ 流失 1.00 A ⇒ 电荷量不变' : '搬运 ' + P.fmt(S.pumpSpeed, 2) + ' A ＜ 流失 1.00 A ⇒ 正在失衡',
        mx(L, 0.5), my(L, 0.88), { size: 20 * k, align: 'center', color: S.steady ? K.text : K.neg });
    });
  }

  /* =====================================================================
     场景 4 · 抽水机类比（环节②）
     ===================================================================== */
  function scPump(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '抽水机维持水位差，电源维持电势差', en: 'Only the gap is analogous',
      card: [
        { label: '抽水机', text: '搬水，维持水位差' },
        { label: '电源', text: '搬电荷，维持电势差', color: K.neg },
        { note: '共同内核只有一条：维持差额' },
        { note: '对象不同、差额不同 —— 不能等同', color: K.dim }
      ],
      rings: [[mx(L, 0.0), my(L, 0), (L.mx1 - L.mx0) * 0.44, (L.my1 - L.my0)],
              [mx(L, 0.52), my(L, 0), (L.mx1 - L.mx0) * 0.46, (L.my1 - L.my0)]]
    });
    /* 左：两个水池 + 泵 */
    var lx = mx(L, 0.20), hiY = my(L, 0.10), loY = my(L, 0.72), tw = (L.mx1 - L.mx0) * 0.30;
    Z.wirePath(ctx, [[lx - tw / 2, hiY], [lx + tw / 2, hiY], [lx + tw / 2, hiY + 54 * k], [lx - tw / 2, hiY + 54 * k], [lx - tw / 2, hiY]], { w: 2.4 * k });
    Z.wirePath(ctx, [[lx - tw / 2, loY], [lx + tw / 2, loY], [lx + tw / 2, loY + 54 * k], [lx - tw / 2, loY + 54 * k], [lx - tw / 2, loY]], { w: 2.4 * k });
    Z.T(ctx, '高水位', lx, hiY - 22 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.T(ctx, '低水位', lx, loY + 76 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.wirePath(ctx, [[lx + tw / 2, hiY + 27 * k], [lx + tw * 0.95, hiY + 27 * k], [lx + tw * 0.95, loY + 27 * k], [lx + tw / 2, loY + 27 * k]], { w: 2.6 * k });
    D(ctx, S.r2, function () {
      var pipe = [[lx + tw / 2, hiY + 27 * k], [lx + tw * 0.95, hiY + 27 * k], [lx + tw * 0.95, loY + 27 * k]];
      Z.chargeFlow(ctx, pipe, 7, S.advPhase, { kind: 'neg', r: 4.4 * k });
      Z.trailDot(ctx, pipe, S.advPhase, { r: 5, k: k });
      /* 泵的转子：一圈随流量变快的光环 */
      Z.burst111(ctx, lx + tw * 0.95, (hiY + loY) / 2, Z2.wrap(S.anim && !S.frozen ? S.T / 1.4 : 0.42), { r: 30, color: K.negHi, k: k, a: 0.35 });
    });
    Z.T(ctx, '抽水机', lx - tw * 0.72, (hiY + loY) / 2, { size: 20 * k, align: 'center', color: K.text });

    /* 右：电源回路 */
    var rx = mx(L, 0.76), ry1 = my(L, 0.20), ry2 = my(L, 0.72);
    Z.wirePath(ctx, [[rx - 84 * k, ry1], [rx + 84 * k, ry1], [rx + 84 * k, ry2], [rx - 84 * k, ry2], [rx - 84 * k, ry1]], { w: 3 * k });
    Z.battery(ctx, rx - 84 * k, (ry1 + ry2) / 2, 92 * k, 34 * k, { k: k });
    Z.T(ctx, '电源', rx - 84 * k, (ry1 + ry2) / 2 + 40 * k, { size: 20 * k, align: 'center', color: K.dim });
    Z.T(ctx, '高电势', rx + 30 * k, ry1 - 20 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.T(ctx, '低电势', rx + 30 * k, ry2 + 24 * k, { size: 19 * k, align: 'center', color: K.dim });
    Z.chargeFlow(ctx, [[rx - 84 * k, ry2], [rx - 84 * k, ry1], [rx - 40 * k, ry1]], 4, 1 - S.flowPhase, { kind: 'pos', r: 4.4 * k, glow: false });
  }

  /* =====================================================================
     场景 5 · 冲突：导线内部有没有电场（环节③）
     ===================================================================== */
  function scField(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '静电平衡时内部 E = 0，可电路里导线内部 E ≠ 0', en: 'A cognitive conflict',
      card: [
        { label: '静电平衡', text: '内部 E = 0，无定向移动' },
        { label: '电路中', text: '内部 E ≠ 0，有定向移动', color: K.neg },
        { formula: 'E = U / L' },
        { note: '解法：不是"站住了"，是"队伍不停、队形不变"' }
      ],
      rings: [[mx(L, 0), my(L, 0.04), (L.mx1 - L.mx0) * 0.44, (L.my1 - L.my0) * 0.5],
              [mx(L, 0.52), my(L, 0.04), (L.mx1 - L.mx0) * 0.46, (L.my1 - L.my0) * 0.5]]
    });
    /* 左：静电平衡的导体（电荷"站住了"，一动不动） */
    var lx = mx(L, 0.22), ly = my(L, 0.26), bw = (L.mx1 - L.mx0) * 0.30, bh = 92 * k;
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[lx - bw / 2, ly - bh / 2], [lx + bw / 2, ly - bh / 2], [lx + bw / 2, ly + bh / 2], [lx - bw / 2, ly + bh / 2], [lx - bw / 2, ly - bh / 2]], { w: 2.6 * k });
      Z.T(ctx, '静电平衡：内部 E = 0', lx, ly, { size: 22 * k, align: 'center', color: K.text });
      Z.T(ctx, '电荷站住了（一动不动）', lx, ly + bh / 2 + 26 * k, { size: 19 * k, align: 'center', color: K.dim });
    });

    /* 右：电路中导线内部 E ≠ 0（同一批电荷，这次在动） */
    var rx = mx(L, 0.74), ry = my(L, 0.26), rw = (L.mx1 - L.mx0) * 0.42;
    D(ctx, S.r1, function () {
      Z.wirePath(ctx, [[rx - rw / 2, ry], [rx + rw / 2, ry]], { w: 4 * k });
      for (var i = 0; i < 5; i++) {
        var xx = rx - rw / 2 + rw * (i + 0.5) / 5;
        Z.wirePath(ctx, [[xx - 16 * k, ry - 30 * k], [xx + 16 * k, ry - 30 * k]], { color: K.neg, w: 2.2 * k });
      }
      Z.M(ctx, 'E', rx + rw / 2 + 18 * k, ry - 30 * k, { size: 26 * k, color: K.neg });
      Z.T(ctx, '电路中：内部 E ≠ 0', rx, ry + 42 * k, { size: 22 * k, align: 'center', color: K.neg });
    });
    D(ctx, S.r2, function () {
      Z.chargeFlow(ctx, [[rx - rw / 2, ry], [rx + rw / 2, ry]], 7, S.flowPhase, { kind: 'neg', r: 4.6 * k });
      Z.trailDot(ctx, [[rx - rw / 2, ry], [rx + rw / 2, ry]], S.flowPhase, { r: 5, k: k });
    });

    Z.T(ctx, 'U = ' + P.fmt(S.Uwire, 1) + ' V，L = 0.10 m ⇒ E = ' + P.fmt(S.Ewire, 1) + ' V/m',
      mx(L, 0.5), my(L, 0.86), { size: 20 * k, align: 'center', color: K.dim });
  }

  /* =====================================================================
     场景 6 · 动态平衡：你来我走、分布不变（环节③）
     ===================================================================== */
  function scFlow(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '电荷"你来我走"，但各处的分布不变', en: 'Dynamic equilibrium',
      card: [
        { label: '有的', text: '流走了' },
        { label: '另外的', text: '又来补上' },
        { label: '结果', text: '各处电荷量保持不变', color: K.text },
        { formula: 'E 不随时间变化' },
        { note: '⇒ 恒定电场（steady electric field）' }
      ],
      rings: [[mx(L, 0), my(L, 0.14), (L.mx1 - L.mx0), (L.my1 - L.my0) * 0.6]]
    });
    var y = my(L, 0.36), x0 = mx(L, 0.02), x1 = mx(L, 0.98), hh = 46 * k;
    Z.wirePath(ctx, [[x0, y - hh], [x1, y - hh]], { w: 3 * k });
    Z.wirePath(ctx, [[x0, y + hh], [x1, y + hh]], { w: 3 * k });
    for (var i = 0; i <= 8; i++) {
      var xx = x0 + (x1 - x0) * i / 8;
      Z.wirePath(ctx, [[xx, y - hh], [xx, y - hh + 12 * k]], { color: 'rgba(255,255,255,0.5)', w: 1.6 * k });
      Z.wirePath(ctx, [[xx, y + hh], [xx, y + hh - 12 * k]], { color: 'rgba(255,255,255,0.5)', w: 1.6 * k });
    }
    D(ctx, S.r2, function () {
      Z.chargeFlow(ctx, [[x1, y], [x0, y]], 10, S.flowPhase, { kind: 'neg', r: 4.8 * k });
      /* 前后接力：同一时刻把"前面走的"和"后面补的"配对显示 —— 分布不变就是这个意思 */
      var u = S.anim && !S.frozen ? Z2.wrap(S.T * 0.34) : 0.17;
      for (var q = 0; q < 5; q++) {
        var uu = Z2.wrap(u + q * 0.2);
        var p1 = Z.pathAt([[x1, y], [x0, y]], uu);
        var p2 = Z.pathAt([[x1, y], [x0, y]], Z2.wrap(uu + 0.5));
        ctx.save(); ctx.globalAlpha = 0.5;
        ctx.strokeStyle = K.negHi; ctx.lineWidth = 1.2 * k;
        ctx.beginPath(); ctx.moveTo(p1.x, y - hh + 6 * k); ctx.lineTo(p2.x, y - hh + 6 * k); ctx.stroke();
        ctx.restore();
      }
      Z.T(ctx, '电子一直在换，但每个刻度处的分布不变', (x0 + x1) / 2, y + hh + 48 * k,
        { size: 20 * k, align: 'center', color: K.text });
    });
  }

  /* =====================================================================
     场景 7 · 加速—碰撞（环节③）
     ===================================================================== */
  function scSawtooth(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '加速—碰撞—加速—碰撞：平均速率不随时间变化', en: 'Accelerate then collide',
      card: [
        { label: '静电力', text: '促使电荷运动（加速）' },
        { label: '碰撞', text: '阻碍电荷运动（减速）', color: K.neg },
        { note: '两者都有作用' },
        { formula: 'v̄ 不随时间变化' },
        { note: 'E = ' + P.fmt(S.EfieldmV, 1) + ' mV/m ⇒ v̄ = ' + P.sci(S.vavg, 2) + ' m/s' }
      ],
      rings: [[mx(L, 0), my(L, 0.04), (L.mx1 - L.mx0), (L.my1 - L.my0) * 0.72]]
    });
    var ax = mx(L, 0.06), ay = my(L, 0.12), aw = (L.mx1 - L.mx0) * 0.86, ah = (L.my1 - L.my0) * 0.62;
    Z.wirePath(ctx, [[ax, ay + ah], [ax + aw, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.wirePath(ctx, [[ax, ay], [ax, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.M(ctx, 'v', ax - 16 * k, ay, { size: 24 * k, color: K.dim });
    Z.M(ctx, 't', ax + aw + 16 * k, ay + ah, { size: 24 * k, color: K.dim });
    var nSeg = 6, segW = aw / nSeg;
    var yMax = ay + ah - ah * 0.62 * S.vScale;
    /* ① 先画出锯齿（每一段 = 一次"加速 → 碰撞"） */
    D(ctx, S.r0, function () {
      ctx.save();
      ctx.strokeStyle = K.neg; ctx.lineWidth = 2.6 * k; ctx.lineJoin = 'miter';
      ctx.beginPath();
      for (var i = 0; i < nSeg; i++) {
        var xa = ax + i * segW, xb = xa + segW;
        i ? ctx.lineTo(xa, ay + ah) : ctx.moveTo(xa, ay + ah);
        ctx.lineTo(xb, yMax);
        if (i < nSeg - 1) ctx.lineTo(xb, ay + ah);
      }
      ctx.stroke();
      ctx.restore();
    });
    var yAvg = ay + ah - ah * 0.31 * S.vScale;
    D(ctx, S.r1, function () {
      Z.wirePath(ctx, [[ax, yAvg], [ax + aw, yAvg]], { color: 'rgba(255,255,255,0.75)', w: 2.2 * k, dash: [7, 5] });
      Z.T(ctx, 'v̄', ax + aw + 24 * k, yAvg, { size: 22 * k, color: K.text });
    });
    /* ② 一个电子沿着锯齿轨迹反复跑：加速段越跑越快（点子间距变大），
          到折点"撞一下"（闪光 + 速度归零），再重新加速 —— 这就是 v̄ 不变的画面 */
    D(ctx, S.r2, function () {
      var u = S.anim && !S.frozen ? Z2.wrap(S.T * 0.42) : 0.30;
      var segIdx = Math.floor(u * nSeg), f = u * nSeg - segIdx;
      if (segIdx >= nSeg) segIdx = nSeg - 1;
      var xa = ax + segIdx * segW, xb = xa + segW;
      /* 加速段：位置按 f² 走（越到后面越快），这就是"加速"的直接证据 */
      var fx = f * f * 0.5 + f * 0.5;
      var px = xa + (xb - xa) * fx;
      var py = (ay + ah) - ((ay + ah) - yMax) * fx;
      /* 轨迹上的残影（最近经过的几段，用越来越淡的点表示） */
      for (var m = 5; m >= 1; m--) {
        var uu = Z2.wrap(u - m * 0.012);
        var si = Math.min(nSeg - 1, Math.floor(uu * nSeg)), ff = uu * nSeg - si;
        var fxx = ff * ff * 0.5 + ff * 0.5;
        ctx.save();
        ctx.globalAlpha = 0.45 * (1 - m / 6);
        ctx.fillStyle = K.neg;
        ctx.beginPath();
        ctx.arc(ax + si * segW + segW * fxx, (ay + ah) - ((ay + ah) - yMax) * fxx, 4.4 * k, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      Z.charge(ctx, px, py, 6.2 * k, 'neg', { color: '#FFFFFF' });
      /* ③ 折点碰撞：给一个明显的冲击波（"撞一下，速度归零"） */
      var sinceHit = f;                       /* 0 = 刚撞完 */
      if (sinceHit < 0.10) Z.burst111(ctx, xa, ay + ah, 1 - sinceHit / 0.10, { r: 26, color: K.negHi, k: k, a: 0.55 });
      Z.T(ctx, '加速 → 碰撞 → 加速 → 碰撞', (ax + ax + aw) / 2, ay + ah + 34 * k,
        { size: 20 * k, align: 'center', color: K.dim });
      Z.T(ctx, '每撞一次，速度归零重来 —— 平均速率才不变', (ax + ax + aw) / 2, ay + ah + 64 * k,
        { size: 19 * k, align: 'center', color: K.text });
    });
  }

  /* =====================================================================
     场景 8 · 电流表：示数恒定（环节③）
     ===================================================================== */
  function scAmmeter(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '串联一只电流表：读数保持恒定', en: 'Steady current',
      card: [
        { label: '定义', text: '大小、方向都不随时间变化' },
        { formula: 'I = ' + P.fmt(S.Iamm, 3) + ' A' },
        { note: '这一章研究的就是恒定电流' }
      ],
      rings: [[mx(L, 0.02), my(L, 0.10), (L.mx1 - L.mx0) * 0.96, (L.my1 - L.my0) * 0.62]]
    });
    var x0 = mx(L, 0.04), x1 = mx(L, 0.96), yT = my(L, 0.16), yB = my(L, 0.62);
    Z.wirePath(ctx, [[x0, yT], [x1, yT], [x1, yB], [x0, yB], [x0, yT]], { w: 3 * k });
    Z.battery(ctx, x0, (yT + yB) / 2, 92 * k, 34 * k, { k: k });
    Z.T(ctx, 'U = ' + P.fmt(S.Uamm, 1) + ' V', x0 - 60 * k, (yT + yB) / 2, { size: 20 * k, align: 'center', color: K.dim });
    /* 电流表 */
    var acx = mx(L, 0.5), acy = yB, r = 26 * k;
    D(ctx, S.r2, function () {
      ctx.save();
      ctx.beginPath(); ctx.arc(acx, acy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#0A0A0A'; ctx.fill();
      ctx.strokeStyle = K.neg; ctx.lineWidth = 2.6 * k; ctx.stroke();
      /* 指针阻尼摆动：先冲过去一点再收回 —— "稳定下来"这个过程本身有信息 */
      var settle = S.anim && !S.frozen ? (function () {
        var u = Z2.wrap(S.T / 3.2);
        return u < 0.5 ? (1 - Math.exp(-7 * u * 2) * Math.cos(9 * u * 2)) : 1;
      })() : 1;
      var a0 = Math.PI * 1.15, a1 = Math.PI * 1.85;
      var a = a0 + (a1 - a0) * Z.clamp(!S.anim ? S.needle : S.needle * (0.35 + 0.65 * settle), 0, 1.1);
      ctx.strokeStyle = K.text; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.moveTo(acx, acy); ctx.lineTo(acx + r * 0.66 * Math.cos(a), acy + r * 0.66 * Math.sin(a)); ctx.stroke();
      ctx.restore();
      Z.T(ctx, 'A', acx, acy + r * 0.5, { size: 20 * k, align: 'center', color: K.text });
    });
    /* 电流：整条回路上的电子在跑（含电流表这一段） */
    D(ctx, S.r1, function () {
      Z.chargeFlow(ctx, [[x0, yT], [x1, yT], [x1, yB]], 9, S.flowPhase, { kind: 'neg', r: 4.4 * k });
      Z.trailDot(ctx, [[x0, yT], [x1, yT], [x1, yB]], S.flowPhase, { r: 5, k: k });
    });
  }

  /* =====================================================================
     场景 9 · 恒定电流 vs 交变电流（环节③）
     ===================================================================== */
  function scSteady(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: S.mode ? '恒定电流：大小、方向都不随时间变化' : '交变电流：大小、方向都在变',
      en: S.mode ? 'Steady current' : 'Alternating current',
      card: S.mode ? [
        { label: '恒定', text: 'I 不随时间变化', color: K.text },
        { label: '方向', text: '也不随时间变化' },
        { note: '判据：是否随时间变化' }
      ] : [
        { label: '交变', text: 'I 随时间变化', color: K.neg },
        { label: '方向', text: '也在变' }
      ],
      rings: [[mx(L, 0), my(L, 0.06), (L.mx1 - L.mx0), (L.my1 - L.my0) * 0.7]]
    });
    var ax = mx(L, 0.06), ay = my(L, 0.16), aw = (L.mx1 - L.mx0) * 0.86, ah = (L.my1 - L.my0) * 0.52;
    Z.wirePath(ctx, [[ax, ay + ah], [ax + aw, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.wirePath(ctx, [[ax, ay], [ax, ay + ah]], { color: 'rgba(255,255,255,0.55)', w: 1.8 * k });
    Z.M(ctx, 'I', ax - 16 * k, ay, { size: 24 * k, color: K.dim });
    Z.M(ctx, 't', ax + aw + 16 * k, ay + ah, { size: 24 * k, color: K.dim });
    var mid = ay + ah / 2;
    Z.wirePath(ctx, [[ax, mid], [ax + aw, mid]], { color: 'rgba(255,255,255,0.22)', w: 1.4 * k, dash: [5, 5] });
    if (S.mode === 1) {
      var lv = ay + ah * 0.16;
      D(ctx, S.r1, function () {
        ctx.save();
        ctx.strokeStyle = K.text; ctx.lineWidth = 2.8 * k;
        ctx.beginPath(); ctx.moveTo(ax, lv); ctx.lineTo(ax + aw, lv); ctx.stroke();
        ctx.restore();
        /* 恒定电流的画法：点子沿着水平线匀速前进，方向永远一致 */
        Z.chargeFlow(ctx, [[ax, lv], [ax + aw, lv]], 8, S.flowPhase, { kind: 'neg', r: 4.2 * k });
        Z.trailDot(ctx, [[ax, lv], [ax + aw, lv]], S.flowPhase, { r: 4.6, k: k });
        /* 方向箭头：永远指向右（正电荷的定向移动方向） */
        var hx = ax + aw * 0.98;
        Z.wirePath(ctx, [[hx - 22 * k, lv - 12 * k], [hx, lv], [hx - 22 * k, lv + 12 * k]], { w: 2.6 * k });
      });
    } else {
      D(ctx, S.r1, function () {
        ctx.save();
        ctx.strokeStyle = K.neg; ctx.lineWidth = 2.6 * k;
        ctx.beginPath();
        for (var i = 0; i <= 60; i++) {
          var t = i / 60, x = ax + aw * t, y = mid - Math.sin(t * Math.PI * 4) * ah * 0.36;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
        /* 一个点沿正弦来回跑：方向一会儿向右、一会儿向左 —— "方向也在变"看出来了 */
        var u = S.anim && !S.frozen ? Z2.wrap(S.T * 0.22) : 0.2;
        for (var m = 0; m < 14; m++) {
          var x = ax + aw * u, y = mid - Math.sin(u * Math.PI * 4) * ah * 0.36;
          var dx = Math.cos(u * Math.PI * 4) >= 0 ? 1 : -1;   // 当前朝哪边走
          ctx.save();
          ctx.globalAlpha = m === 0 ? 1 : 0.30 * (1 - m / 14);
          ctx.fillStyle = m === 0 ? '#FFFFFF' : K.neg;
          if (m === 0) { ctx.shadowColor = K.neg; ctx.shadowBlur = 10 * k; }
          ctx.beginPath(); ctx.arc(x - dx * m * aw * 0.012, y, 4.6 * k, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          u = Z2.wrap(u - dx * 0.012);
        }
      });
    }
  }

  /* =====================================================================

    });
    /* 上排正离子向右、下排负离子向左：两股方向相反的定向移动 */
    D(ctx, S.r1, function () {
      Z.chargeFlow(ctx, [[x0 + 20 * k, y - 30 * k], [x1 - 20 * k, y - 30 * k]], 6, S.flowPhase, { kind: 'pos', r: 5 * k, glow: false });
      Z.chargeFlow(ctx, [[x1 - 20 * k, y + 30 * k], [x0 + 20 * k, y + 30 * k]], 6, 1 - S.flowPhase, { kind: 'neg', r: 5 * k });
      Z.trailDot(ctx, [[x0 + 20 * k, y - 30 * k], [x1 - 20 * k, y - 30 * k]], S.flowPhase, { r: 5, k: k, color: K.pos });
      Z.trailDot(ctx, [[x1 - 20 * k, y + 30 * k], [x0 + 20 * k, y + 30 * k]], 1 - S.flowPhase, { r: 5, k: k, color: K.neg });
      Z.T(ctx, '正离子 →', (x0 + x1) / 2, y - hh - 26 * k, { size: 20 * k, align: 'center', color: K.text });

    });

    D(ctx, S.r3, function () {
      var yy = y + hh + 74 * k;

      Z.wirePath(ctx, [[x1 - 62 * k, yy - 11 * k], [x1 - 40 * k, yy], [x1 - 62 * k, yy + 11 * k]], { color: K.negHi, w: 2.4 * k });
      Z.T(ctx, '两者形成的电流方向相同 ⇒ q = |q₁| + |q₂|', (x0 + x1) / 2, yy + 30 * k,

  }

  /* =====================================================================
     场景 14 · I = neSv 四步链（环节⑤）
     ===================================================================== */
  function scMicro(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: 'vt → Svt → nSvt → neSvt ⇒ I = neSv', en: 'Microscopic expression',
      card: [
        { label: 'vt', text: '导体的长度', color: S.chainOn > 0 ? K.text : K.dim },
        { label: 'Svt', text: '导体的体积', color: S.chainOn > 1 ? K.text : K.dim },

        { label: 'neSvt', text: '总电荷量', color: S.chainOn > 3 ? K.text : K.dim },
        { formula: 'I = neSv' }
      ],
      rings: [[mx(L, 0.02), my(L, 0.10), (L.mx1 - L.mx0) * 0.96, (L.my1 - L.my0) * 0.5]]
    });
    var y = my(L, 0.34), xr = mx(L, 0.96), xe = mx(L, 0.60), hh = 48 * k, x0 = mx(L, 0.02);
    D(ctx, S.r0, function () {
      Z.wirePath(ctx, [[x0, y - hh], [xr, y - hh]], { w: 3 * k });
      Z.wirePath(ctx, [[x0, y + hh], [xr, y + hh]], { w: 3 * k });
      Z.T(ctx, '左端横截面', xe, y - hh - 36 * k, { size: 19 * k, align: 'center', color: K.dim });
    });
    /* ① 电子柱随 t 生长：vt 那段体积里挤满自由电子 */
    var xL = xr - (xr - xe) * Math.max(0.04, S.tFrac);
    D(ctx, S.r1, function () {
      ctx.save();
      ctx.fillStyle = 'rgba(46,159,208,0.14)';
      ctx.fillRect(xL, y - hh, xe - xL, hh * 2);
      ctx.restore();
      Z.wirePath(ctx, [[xe, y - hh - 16 * k], [xe, y + hh + 16 * k]], { color: K.neg, w: 2.2 * k });
      Z.M(ctx, 'vt', (xL + xe) / 2, y, { size: 30 * k, color: K.text });
      for (var i = 0; i < 5; i++) for (var j = 0; j < 3; j++) {
        Z.charge(ctx, xL + (xe - xL) * (i + 0.5) / 5, y - hh * 0.55 + j * hh * 0.55, 3.8 * k, 'neg', {});
      }
    });
    /* ② 真正的主角：电子一个个穿过左端横截面（q 就是"数穿过去的电荷量"） */
    D(ctx, S.r2, function () {
      var seg = [[xr - 6 * k, y], [x0 + 6 * k, y]];
      Z.chargeFlow(ctx, seg, 12, S.flowPhase, { kind: 'neg', r: 4.2 * k });
      Z.trailDot(ctx, seg, S.flowPhase, { r: 5, k: k });
      /* 通过横截面的瞬间给一个计数闪光 */
      var u = S.anim && !S.frozen ? Z2.wrap(-S.T * 0.34) : 0.17;
      var p = Z.pathAt(seg, u);
      Z.burst111(ctx, p.x, p.y, Z2.wrap(u * 12), { r: 18, color: K.negHi, k: k, a: 0.4 });
    });
  }

  /* =====================================================================

        { size: 20 * k, align: 'center', color: K.dim });
      Z.wirePath(ctx, [[x0, y2], [x1, y2]], { w: 3 * k });
      Z.T(ctx, '同一根导线里的电子（速度被放大 10¹² 倍才看得见）', (x0 + x1) / 2, y2 + 44 * k,
        { size: 19 * k, align: 'center', color: K.dim });
    });
    /* ① 上排：电场波前以光速从左铺到右 —— 循环一来一回，看得见"铺满"这个动作 */
    D(ctx, S.r1, function () {
      var u = S.anim && !S.frozen ? Z2.wrap(S.T / 2.4) : 0.85;
      Z.front(ctx, wire, u, { k: k, color: K.negHi, w: 3.2, r: 7 });
      Z.T(ctx, '电场以光速铺开（L/c = ' + P.sci(S.tField, 2) + ' s）',
        (x0 + x1) / 2, y - 46 * k, { size: 21 * k, align: 'center', color: K.negHi });
    });
    /* ② 下排：电子只挪了一点点 —— 把真实位移夸张 10¹² 倍之后还是一个"几乎没动"的量 */
    D(ctx, S.r2, function () {
      var n = 9;
      for (var i = 0; i < n; i++) {
        var base = x0 + (x1 - x0) * (i + 0.5) / n;
        var wob = (S.anim && !S.frozen) ? Math.sin(S.T * 1.6 + i * 0.9) * 2.2 * k : 0;

    });
  }

  /* =====================================================================
     场景 17 · 电池容量就是电荷量（环节⑥）
     ===================================================================== */
  function scCapacity(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    shell(ctx, W, H, S, L, {
      cn: '容量就是电池能输出的总电荷量 q', en: 'Battery capacity',

        { label: '容量', text: P.fmt(S.capAh, 0) + ' A·h = ' + P.sci(S.capC, 3) + ' C' },

        { formula: 'I = q / t' },
        { note: '放电 ' + P.fmt(S.capT, 1) + ' h ⇒ I = ' + P.fmt(S.Icap, 2) + ' A' },
        { note: '续航 s = vt = ' + P.fmt(S.rangeKm, 0) + ' km', color: K.text }
      ],
      rings: [[mx(L, 0.02), my(L, 0.06), (L.mx1 - L.mx0) * 0.42, (L.my1 - L.my0) * 0.36]]
    });

    var bx = mx(L, 0.20), by = my(L, 0.24);
    D(ctx, S.r0, function () {
      Z.battery(ctx, bx, by, (L.mx1 - L.mx0) * 0.30, 56 * k, { k: k });
      Z.T(ctx, '动力电池组', bx, by - 56 * k, { size: 21 * k, align: 'center', color: K.text });
    });
    /* 电量条：随放电进度一点点掉（循环），电流越大部分掉得越快 */
    var bw = (L.mx1 - L.mx0) * 0.34, barX = mx(L, 0.56), barY = my(L, 0.20);
    D(ctx, S.r1, function () {
      var u = S.anim && !S.frozen ? Z2.wrap(S.T / 9) : 0.28;
      var soc = Z.clamp(S.soc * (1 - u), 0, 1);
      Z.wirePath(ctx, [[barX, barY], [barX + bw, barY]], { color: 'rgba(255,255,255,0.28)', w: 8 * k });
      Z.wirePath(ctx, [[barX, barY], [barX + bw * soc, barY]], { color: K.neg, w: 8 * k });
      Z.T(ctx, '放电进度 ' + Math.round(soc * 100) + '%', barX, barY - 26 * k, { size: 19 * k, color: K.dim });
      /* 掉的电荷：一个个从电池块往右滚出去（容量就是"能输出多少电荷"） */
      var out = [[bx + 30 * k, by], [barX + bw, by]];
      Z.chargeFlow(ctx, out, 5, S.flowPhase, { kind: 'neg', r: 4 * k });
    });
    /* 车 */
    var vx = mx(L, 0.20), vy = my(L, 0.62);
    Z.wirePath(ctx, [[vx, vy], [vx + 96 * k, vy], [vx + 84 * k, vy - 28 * k], [vx + 20 * k, vy - 28 * k], [vx, vy]], { w: 2.6 * k });
    ctx.save(); ctx.strokeStyle = K.text; ctx.lineWidth = 2.4 * k;
    ctx.beginPath(); ctx.arc(vx + 22 * k, vy + 8 * k, 9 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(vx + 72 * k, vy + 8 * k, 9 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    Z.T(ctx, '续航 ' + P.fmt(S.rangeKm, 0) + ' km', vx + 116 * k, vy - 12 * k, { size: 22 * k, color: K.text });
  }

  /* =====================================================================
     场景 18 · 因果链五格（环节⑦）
     ===================================================================== */
  function scChain(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, { card: false });
    shell(ctx, W, H, S, L, {
      cn: '一条因果链把全课串起来', en: 'Summary',

    });
    var items = ['电源搬运电荷', '两极电势差不变', '导体内部恒定电场', '定向移动＋碰撞', '恒定电流'];
    var x0 = mx(L, 0.06), bw = (L.mx1 - L.mx0) * 0.88, bh = (L.my1 - L.my0) * 0.155;
    for (var i = 0; i < items.length; i++) {
      var on = S.chainP > i, y = my(L, 0) + i * (bh + 14 * k);
      ctx.save();
      ctx.strokeStyle = on ? K.neg : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = on ? 2.4 * k : 1.4 * k;
      ctx.strokeRect(x0, y, bw, bh);
      /* 刚点亮的那一格持续呼吸 —— 一格格串起来的过程看得见 */
      if (on && i === S.chainP - 1 && S.anim && !S.frozen) {
        ctx.globalAlpha = 0.10 + 0.14 * (0.5 - 0.5 * Math.cos(S.T * 3));
        ctx.fillStyle = K.neg; ctx.fillRect(x0, y, bw, bh);
      }
      ctx.restore();
      Z.T(ctx, String(i + 1), x0 + 34 * k, y + bh / 2, { size: 26 * k, align: 'center', color: on ? K.neg : 'rgba(255,255,255,0.35)' });
      Z.T(ctx, items[i], x0 + 68 * k, y + bh / 2, { size: 26 * k, color: on ? K.text : 'rgba(255,255,255,0.4)' });
    }
  }

  var SCENES = {
    intro: scIntro, transient: scTransient, source: scSource, pump: scPump,
    field: scField, flow: scFlow, sawtooth: scSawtooth, ammeter: scAmmeter,
    steady: scSteady, define: scDefine, units: scUnits, crosssec: scCrossSec,
    electrolyte: scElectrolyte, micro: scMicro, driftnum: scDriftNum,
    lightspeed: scLightSpeed, capacity: scCapacity, chain: scChain

  global.DCREND = {
    SCENES: SCENES, layout: layout, mx: mx, my: my, shell: shell, tapRing: tapRing,

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  };
})(typeof window !== 'undefined' ? window : globalThis);

    var it = CTRL.items[key];

    }
    var a = it.a, v = st[key], unit = a.unit ? ' ' + a.unit : '';

      case 'tn': case 'driftPhase': case 'tFrac': return P.fmt(v, 2);

      case 'chainP': return P.fmt(v, 0) + ' / 5';
      case 'theta': return P.fmt(v, 0) + '°';
      case 'U0': case 'Uwire': return P.fmt(v, 1) + ' V';
      case 'Efield': return P.fmt(v, 1) + ' mV/m';
      case 'pump': case 'Idrift': case 'Idefine': return P.fmt(v, 2) + ' A';
      case 'q1': case 'q2': return P.fmt(v, 1) + ' C';
      case 'capAh': return P.fmt(v, 0) + ' A·h';

  var drag = null, downAt = null;

    var r = cv.getBoundingClientRect();

    if (downAt && Math.hypot(t.clientX - downAt.x, t.clientY - downAt.y) > 5) downAt.moved = true;
    if (!drag) return;
    var p = pos(ev);
    setByFraction(drag, p.x / p.w);

    if (downAt && !downAt.moved && ev && ev.clientX != null) {

      canvasClick({ clientX: ev.changedTouches[0].clientX, clientY: ev.changedTouches[0].clientY });

  }

  function key(ev) {
    if (ev.target && /INPUT|TEXTAREA|BUTTON/.test(ev.target.tagName)) return;
    if (ev.key === ' ' && !ev.shiftKey) { togglePlay(); ev.preventDefault(); return; }
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { next(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { prev(); ev.preventDefault(); }
    else if (ev.key === 'Home') go(0);
    else if (ev.key === 'End') go(STEPS.length - 1);
    else if (ev.key === 'r' || ev.key === 'R') resetStep();
  }

  /* 像素指纹：先把时钟钉在 3.0 s（入场早走完、相位固定），取完再恢复。
     这样"动画在跑"与"指纹可复现"两件事互不冲突。 */
  function hash() {
    var A = global.DCANIM, wasFrozen = A ? A.frozen : true;
    if (A) { A.freeze(3.0); draw(); }
    if (!lastFit) draw();
    var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
    var out = ('00000000' + h.toString(16)).slice(-8);
    if (A && !wasFrozen) { A.thaw(); draw(); }
    return out;
  }

  /* 物理专项：把教案里出现的每一个数字都过一遍 */
  function verifyDC() {
    var Rz = [];
    function chk(n, got, want, tol) {
      var ok = Math.abs(got - want) <= (tol == null ? 0 : tol);
      Rz.push({ name: n, got: got, want: want, ok: ok });
    }
    chk('练习1 q = 50μA×3.2s', P.charge(P.toAmpere(50, 'μA'), 3.2), 1.6e-4, 1e-12);
    chk('练习1 电子数', P.electrons(1.6e-4), 1.0e15, 1e10);
    chk('练习2 I = 0.3 A', 0.3, 0.3, 0);
    var nCu = P.copperCarrierDensity();
    chk('铜 n', nCu, 8.37156e28, 1e24);
    chk('铜 v(I=1A,S=1mm²)', P.driftSpeed(1, nCu, 1e-6), 7.47e-5, 1e-6);
    chk('加速—碰撞 v̄ 与 v 自洽', P.avgDrift(0.0175), P.driftSpeed(1, nCu, 1e-6), 2e-6);
    chk('94 A·h → C', P.capacityCharge(94), 3.384e5, 1e-6);
    chk('I = 3.384e5 C / 5 h', P.dischargeCurrent(P.capacityCharge(94), 5 * 3600), 18.8, 1e-9);
    chk('续航 72 km/h × 5 h', P.enduranceKm(72, P.capacityCharge(94), 18.8), 360, 1e-6);
    chk('手机视频电流 4000mAh/17h', P.standbyCurrent(4000, 17), 235.29, 0.01);
    chk('cos60° 有效占比', P.crossFactor(60), 0.5, 1e-12);
    chk('电解液 q = |q₁|+|q₂|', P.electrolyteCharge(2, -3), 5, 1e-12);
    var fails = Rz.filter(function (r) { return !r.ok; });
    return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
  }

  global.__viz = {
    state: st, count: STEPS.length,
    go: go, next: next, prev: prev, reset: resetStep, draw: draw, hash: hash,
    getS: function () { return S; },
    render: R, phys: P, steps: Sd,
    setParam: setParam, toggleParam: toggleParam, readRows: readRows,
    click: CLICK, clickAct: ACT, hotspots: HD.HOTSPOTS, hitTest: HD.hit,
    verifyDC: verifyDC,
    anim: global.DCANIM,
    animOn: startAnim, animOff: stopAnim, running: function () { return rafId != null; },
    /* 动画专项自检：每个场景的流动相位确实随时间推进（不是钉死的静止帧） */
    verifyAnim: function () {
      var A = global.DCANIM, Rz = [], fails = [];
      if (!A) return { pass: false, total: 0, failed: 1, note: '没有动画内核' };
      A.thaw();
      var s1 = Object.assign(st, {}), o1, o2;
      A.t = 1.0; o1 = derive(st);
      A.t = 2.0; o2 = derive(st);
      var keys = ['flowPhase', 'pumpPhase', 'wirePhase', 'slowPhase', 'advPhase'];
      keys.forEach(function (k) {
        var ok = Math.abs(o1[k] - o2[k]) > 1e-6;
        Rz.push({ name: k + ' 随时间推进', got: o1[k], want: '≠ ' + o2[k], ok: ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      });
      /* 路径几何自检：路径插值真的在移动 */
      var pts = [[0, 0], [100, 0]];
      var p1 = Z.pathAt(pts, 0.2), p2 = Z.pathAt(pts, 0.7);
      var ok2 = Math.abs(p1.x - 20) < 1e-6 && Math.abs(p2.x - 70) < 1e-6;
      Rz.push({ name: '路径插值 pathAt', got: p1.x + '/' + p2.x, want: '20/70', ok: ok2 });
      if (!ok2) fails.push(Rz[Rz.length - 1]);
      A.freeze(3.0);
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    /* 点选专项自检：每个场景的每个热区都能命中、都有动作、且点了有反馈 */
    verifyTap: function () {
      var Rz = [], fails = [], scenes = Object.keys(HD.HOTSPOTS);
      var i, j;
      for (i = 0; i < STEPS.length; i++) {
        var sc = STEPS[i].scene, list = HD.HOTSPOTS[sc] || [];
        for (j = 0; j < list.length; j++) {
          var h = list[j];
          var cx = h.x + h.w / 2, cy = h.y + h.h / 2;
          var got = HD.hit(sc, cx, cy);
          var ok = got === h && typeof ACT[h.act] === 'function';
          Rz.push({ step: i + 1, scene: sc, label: h.label, hit: !!got, act: typeof ACT[h.act] === 'function', ok: ok });
          if (!ok) fails.push(Rz[Rz.length - 1]);
        }
      }
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    selfTest: function () { return P.runSelfTest(); },
    stepMeta: function () {
      return STEPS.map(function (d, i) {
        return { i: i, act: d.act, title: d.title, scene: d.scene, allow: Object.keys(d.allow || {}), hint: d.hint || '' };
      });
    },
    consistency: function () {
      var fwd = [], bwd = [], out = [], i;
      for (i = 0; i < STEPS.length; i++) { go(i); fwd.push(hash()); }
      for (i = STEPS.length - 1; i >= 0; i--) { go(i); bwd[i] = hash(); }
      for (i = 0; i < STEPS.length; i++) if (fwd[i] !== bwd[i]) out.push({ step: i, fwd: fwd[i], bwd: bwd[i] });
      return { steps: STEPS.length, mismatches: out.length, detail: out };
    }
  };

  /* 播放控制：暂停时时钟停走 → 画面定格在当前帧（但拖动/点选照常可用） */
  var SPEEDS = [0.5, 1, 1.6, 2.4], speedIdx = 1;
  function syncPlayBtn() {
    var A = global.DCANIM;
    var b = $('btnPlay');
    if (b) b.textContent = (A && A.playing) ? '❚❚ 暂停动画' : '▶ 继续播放';
    var s = $('btnSpeed');
    if (s) s.textContent = (A ? A.speed : 1).toFixed(1) + '×';
  }
  function togglePlay() {
    var A = global.DCANIM;
    if (!A) return;
    A.playing = !A.playing;
    if (A.playing) { A.hold(0.4); startAnim(); } else { lastTs = 0; }
    syncPlayBtn();
    draw();
  }
  function cycleSpeed() {
    var A = global.DCANIM;
    if (!A) return;
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    A.speed = SPEEDS[speedIdx];
    syncPlayBtn();
  }
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnSpeed').addEventListener('click', cycleSpeed);
  syncPlayBtn();

  $('btnNext').addEventListener('click', next);
  $('btnPrev').addEventListener('click', prev);
  $('btnReset').addEventListener('click', resetStep);
  $('prog').addEventListener('click', function (ev) {
    var r = this.getBoundingClientRect();
    go(Math.floor(clamp((ev.clientX - r.left) / r.width, 0, 0.999) * STEPS.length));
  });
  cv.addEventListener('mousedown', startDrag);
  cv.addEventListener('touchstart', startDrag, { passive: false });
  global.addEventListener('mousemove', moveDrag);
  global.addEventListener('touchmove', moveDrag, { passive: false });
  global.addEventListener('mouseup', endDrag);
  global.addEventListener('touchend', endDrag);
  global.addEventListener('keydown', key);
  global.addEventListener('resize', function () { draw(); });

  buildToc();
  apply(st, 0);
  draw();
  setTimeout(draw, 80);
  startAnim();                       /* 交互动画：每帧推进时钟，电子真的在跑 */
  global.addEventListener('pointerdown', function () { var A = global.DCANIM; if (A) A.hold(3.5); }, true);
  global.addEventListener('pointerup', function () { mDown = false; }, true);
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
