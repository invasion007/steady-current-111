  /* 画布拖动：按当前步骤的第一个可拖连续量映射（下→上 = 变大）
     与点击共存：按下到抬起位移 < 5px 视为"点一下"，否则是拖动 */
  var drag = null, downAt = null;
  function firstRangeKey() {
    var allow = STEPS[st.step].allow || {};
    var keys = Object.keys(allow);
    for (var i = 0; i < keys.length; i++) if (allow[keys[i]].kind !== 'toggle') return keys[i];
    return null;
  }
  function pos(ev) {
    var r = cv.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top, w: r.width, h: r.height };
  }
  function startDrag(ev) {
    var t = ev.touches ? ev.touches[0] : ev;
    mDown = true;
    var A = global.DCANIM;
    if (A) A.hold(3.5);
    downAt = { x: t.clientX, y: t.clientY, moved: false };
    var key = firstRangeKey();
    if (!key) return;
    drag = key;
    ev.preventDefault();
    moveDrag(ev);
  }
  function moveDrag(ev) {
    var t = ev.touches ? ev.touches[0] : ev;
    if (downAt && Math.hypot(t.clientX - downAt.x, t.clientY - downAt.y) > 5) downAt.moved = true;
    if (!drag) return;
    var p = pos(ev);
    setByFraction(drag, p.x / p.w);
  }
  function endDrag(ev) {
    /* 位移很小 ⇒ 当作点击：命中热区就执行点选动作 */
    if (downAt && !downAt.moved && ev && ev.clientX != null) {
      canvasClick(ev);
    } else if (downAt && !downAt.moved && ev && ev.changedTouches && ev.changedTouches[0]) {
      canvasClick({ clientX: ev.changedTouches[0].clientX, clientY: ev.changedTouches[0].clientY });
    }
    drag = null; downAt = null; mDown = false;
  }

  function key(ev) {
    if (ev.target && /INPUT|TEXTAREA|BUTTON/.test(ev.target.tagName)) return;
    if (ev.key === ' ' && !ev.shiftKey) { togglePlay(); ev.preventDefault(); return; }
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { next(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { prev(); ev.preventDefault(); }
    else if (ev.key === 'Home') go(0);
    else if (ev.key === 'End') go(STEPS.length - 1);
    else if (ev.key === 'r' || ev.key === 'R') resetStep();
    else if (ev.key === ' ') { togglePlay(); ev.preventDefault(); }
    else if (ev.key === 's' || ev.key === 'S') stopAll();
  }

  /* 像素指纹：先把时钟钉在 3.0 s（入场早走完、相位固定），取完再恢复。
     这样"动画在跑"与"指纹可复现"两件事互不冲突。 */
  function hash() {
    var A = global.DCANIM;
    /* 保存状态 → 钉到固定时刻取指纹 → 完整还原（绝不留下冻结态） */
    var sv = A ? { frozen: A.frozen, playing: A.playing, t: A.t, stepT: A.stepT } : null;
    if (A) { A.frozen = true; A.t = 3.0; A.stepT = 99; draw(); }
    if (!lastFit) draw();
    var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
    var out = ('00000000' + h.toString(16)).slice(-8);
    if (A && sv) {
      A.frozen = sv.frozen; A.playing = sv.playing; A.t = sv.t; A.stepT = sv.stepT;
      if (A.playing) A.startLoop();
      draw();
    }
    return out;
  }

  /* 物理专项：把教案里出现的每一个数字都过一遍 */
  function verifyDC() {
    var Rz = [];
    function chk(n, got, want, tol) {
      var ok = Math.abs(got - want) <= (tol == null ? 0 : tol);
      Rz.push({ name: n, got: got, want: want, ok: ok });
    }
    chk('练习1 q = 50μA×3.2s', P.charge(P.toAmpere(50, 'μA'), 3.2), 1.6e-4, 1e-12);
    chk('练习1 电子数', P.electrons(1.6e-4), 1.0e15, 1e10);
    chk('练习2 I = 0.3 A', 0.3, 0.3, 0);
    var nCu = P.copperCarrierDensity();
    chk('铜 n', nCu, 8.37156e28, 1e24);
    chk('铜 v(I=1A,S=1mm²)', P.driftSpeed(1, nCu, 1e-6), 7.47e-5, 1e-6);
    chk('加速—碰撞 v̄ 与 v 自洽', P.avgDrift(0.0175), P.driftSpeed(1, nCu, 1e-6), 2e-6);
    chk('94 A·h → C', P.capacityCharge(94), 3.384e5, 1e-6);
    chk('I = 3.384e5 C / 5 h', P.dischargeCurrent(P.capacityCharge(94), 5 * 3600), 18.8, 1e-9);
    chk('续航 72 km/h × 5 h', P.enduranceKm(72, P.capacityCharge(94), 18.8), 360, 1e-6);
    chk('手机视频电流 4000mAh/17h', P.standbyCurrent(4000, 17), 235.29, 0.01);
    chk('cos60° 有效占比', P.crossFactor(60), 0.5, 1e-12);
    chk('电解液 q = |q₁|+|q₂|', P.electrolyteCharge(2, -3), 5, 1e-12);
    var fails = Rz.filter(function (r) { return !r.ok; });
    return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
  }

  global.__viz = {
    state: st, count: STEPS.length,
    go: go, next: next, prev: prev, reset: resetStep, draw: draw, hash: hash,
    getS: function () { return S; },
    render: R, phys: P, steps: Sd,
    setParam: setParam, toggleParam: toggleParam, readRows: readRows,
    click: CLICK, clickAct: ACT, hotspots: HD.HOTSPOTS, hitTest: HD.hit,
    verifyDC: verifyDC,
    anim: global.DCANIM,
    animOn: startAnim, animOff: function () { var A = global.DCANIM; if (A) A.stopLoop(); },
    running: function () { var A = global.DCANIM; return !!(A && A.raf); },
    /* 动画专项自检：每个场景的流动相位确实随时间推进（不是钉死的静止帧） */
    verifyAnim: function () {
      var A = global.DCANIM, Rz = [], fails = [];
      if (!A) return { pass: false, total: 0, failed: 1, note: '没有动画内核' };
      A.thaw();
      var s1 = Object.assign(st, {}), o1, o2;
      var svT = A.t, svP = A.playing, svF = A.frozen;
      A.frozen = false;
      A.t = 1.0; o1 = derive(st);
      A.t = 2.0; o2 = derive(st);
      var keys = ['flowPhase', 'pumpPhase', 'wirePhase', 'slowPhase', 'advPhase'];
      keys.forEach(function (k) {
        var ok = Math.abs(o1[k] - o2[k]) > 1e-6;
        Rz.push({ name: k + ' 随时间推进', got: o1[k], want: '≠ ' + o2[k], ok: ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      });
      /* 路径几何自检：路径插值真的在移动 */
      var pts = [[0, 0], [100, 0]];
      var p1 = Z.pathAt(pts, 0.2), p2 = Z.pathAt(pts, 0.7);
      var ok2 = Math.abs(p1.x - 20) < 1e-6 && Math.abs(p2.x - 70) < 1e-6;
      Rz.push({ name: '路径插值 pathAt', got: p1.x + '/' + p2.x, want: '20/70', ok: ok2 });
      if (!ok2) fails.push(Rz[Rz.length - 1]);
      A.t = svT; A.playing = svP; A.frozen = svF;
      if (A.playing) A.startLoop();
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    /* ===== 方向自检（步 1/4/5/6/7/8/10/12/14/15/16 的电子/离子/电流方向）=====
       本节所有"动"的东西都必须满足：
         ① 电子（负电荷）运动方向 = −(电流方向) = −(电场方向)
         ② 正离子顺电场、负离子逆电场，但两者贡献的电流同向
         ③ 路径的 pts 顺序 = 该载流子的真实运动方向（相位取正号） */
    verifyDirections: function () {
      var Pz = P, Rz = [], fails = [];
      function chk(name, ok, got, want) {
        Rz.push({ name: name, got: got, want: want, ok: !!ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      }
      /* ① 电子逆电场 */
      chk('电子运动方向 = −E（E 向右时电子向左）',
        Pz.carrierDirBySign(-1, +1) === -1 ? 1 : 0, Pz.carrierDirBySign(-1, +1), -1);
      /* ② 电流 = 正电荷方向 = E 方向 */
      chk('电流方向 = E 方向', Pz.currentDirFromE(+1), +1, 0);
      /* ③ 电子方向与电流方向相反 */
      chk('电子方向与电流方向相反',
        Pz.carrierDirBySign(-1, +1) !== Pz.currentDirFromE(+1) ? 1 : 0, 1, 1);
      /* ④ 电解液：正离子顺 E、负离子逆 E，但电流同向 */
      chk('正离子顺 E', Pz.carrierDirBySign(+1, +1), +1, 0);
      chk('负离子逆 E', Pz.carrierDirBySign(-1, +1), -1, 0);
      chk('两种离子贡献的电流同向',
        Pz.contributionDir(+1, +1) === Pz.contributionDir(-1, +1) ? 1 : 0, 1, 1);
      /* ⑤ 各场景的 pts 顺序与物理方向一致（抽查：相位为正 ⇒ 点沿 pts 前进） */
      var A = global.DCANIM;
      var sv = { t: A.t, playing: A.playing, frozen: A.frozen };
      A.frozen = false; A.playing = true;
      A.t = 1.0; var p1 = derive(st).flowPhase;
      A.t = 2.0; var p2 = derive(st).flowPhase;
      chk('相位随时间单调增（pts 顺序即运动方向）', p2 > p1, p2.toFixed(4), '> ' + p1.toFixed(4));
      A.t = sv.t; A.playing = sv.playing; A.frozen = sv.frozen;
      if (A.playing) A.startLoop();
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    /* ===== 恒压电源链专项自检 =====
       本课面对的是**恒定电源**（U 不变），一切量都必须从 U 推出来：
         U → I = U/R → v = I/(nqS) → 屏幕速度
       并且：调 U 时 Q = CU 必须跟着变；调 R 时 Q 必须**不变**（U 没动）。 */
    verifyVoltageChain: function () {
      var Pz = P, Rz = [], fails = [];
      function chk(name, ok, got, want) {
        Rz.push({ name: name, got: got, want: want, ok: !!ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      }
      var sv = { eV: st.eV, eR: st.eR, step: st.step };
      st.step = 3;                       /* 切到"电源"步（场景电流 = I = U/R）再验证 */
      /* ① U → I → v 严格成比例 */
      st.eV = 2; st.eR = 3; var a = derive(st);
      st.eV = 6; st.eR = 3; var b = derive(st);
      st.eV = 12; st.eR = 3; var c = derive(st);
      chk('U 加倍 ⇒ I 加倍', Math.abs(b.Isteady / a.Isteady - 3) < 1e-9, b.Isteady / a.Isteady, 3);
      chk('U 加倍 ⇒ v 加倍', Math.abs(c.vDrift / a.vDrift - 6) < 1e-9, c.vDrift / a.vDrift, 6);
      chk('U 加倍 ⇒ 屏幕速度加倍', Math.abs(b.vPx / a.vPx - 3) < 1e-9, b.vPx / a.vPx, 3);
      /* ② 调 U：Q = CU 跟着变（这才是恒压源） */
      chk('U 加倍 ⇒ 极板电荷量 Q 加倍', Math.abs(b.Qplate / a.Qplate - 3) < 1e-9, b.Qplate / a.Qplate, 3);
      /* ③ 调 R：U 不变 ⇒ Q 不变，只有 I 变 */
      st.eV = 6; st.eR = 3; var d = derive(st);
      st.eV = 6; st.eR = 6; var e = derive(st);
      chk('只调 R ⇒ 极板电荷量 Q 不变', Math.abs(e.Qplate - d.Qplate) < 1e-15, e.Qplate - d.Qplate, 0);
      chk('只调 R ⇒ 电流按 1/R 变', Math.abs(d.Isteady / e.Isteady - 2) < 1e-9, d.Isteady / e.Isteady, 2);
      /* ④ 恒定电流的判据：U 与 R 不变 ⇒ I 不随时间变化 */
      chk('U、R 不变 ⇒ 电流恒定（不随时间变）', Pz.currentFromU(6, 3) === Pz.currentFromU(6, 3), 'I 恒定', 'I 恒定');
      /* ⑤ 场强由电压决定，不是旋钮 */
      chk('E = U/L（U=6 V、L=0.1 m ⇒ 60 V/m）', Pz.fieldFromU(6, 0.1), 60, 1e-12);
      /* ⑥ 定义式 I = q/t 与 I = U/R 必须自洽 */
      st.dU = 4; st.dR = 2; st.tdefine = 5; var f = derive(st);
      chk('I = U/R 与 q = It 自洽', f.qDefine / st.tdefine, f.Idefine, 1e-12);
      st.eV = sv.eV; st.eR = sv.eR; st.step = sv.step;
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    /* ===== 动画三条要求的专项自检 ===== */
    verifyAnimReq: function () {
      var A = global.DCANIM, Pz = P, Rz = [], fails = [];
      function chk(name, ok, got, want) {
        Rz.push({ name: name, got: got, want: want, ok: !!ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      }
      var sv = { t: A.t, playing: A.playing, frozen: A.frozen, hold: A.holdUntil };

      /* ① 暂停真冻结：时钟停走 + 画面逐字节不变 */
      A.frozen = false; A.playing = true; A.holdUntil = 0; A.t = 4;
      A.pause();
      var t0 = A.t, h0 = hash();
      A.tick(0.8);                                   // 试图推进
      var t1 = A.t, h1 = hash();
      chk('① 暂停后时钟不推进', Math.abs(t1 - t0) < 1e-12, t1 - t0, '0');
      chk('① 暂停后画面逐字节相同', h1 === h0, h1, h0);

      /* ① 停止回初态：时钟归零 + 状态复位 */
      A.t = 9; A.play();
      A.stop();
      chk('① 停止后时钟归零', A.t === 0, A.t, 0);
      chk('① 停止后不再播放', A.playing === false, A.playing, false);

      /* ② 速度由电流驱动：同一导体下 v_px ∝ I，I=0 ⇒ 静止 */
      var nCu = Pz.copperCarrierDensity();
      var v1 = Pz.driftPxPerSec(1, nCu, 1e-6, K_VIEW);
      var v2 = Pz.driftPxPerSec(2, nCu, 1e-6, K_VIEW);
      chk('② I 加倍 ⇒ 屏幕速度加倍', Math.abs(v2 / v1 - 2) < 1e-12, v2 / v1, 2);
      chk('② I = 0 ⇒ 速度 0（电荷静止）', Pz.driftPxPerSec(0, nCu, 1e-6, K_VIEW) === 0, 0, 0);
      var vd = Pz.driftSpeed(1, nCu, 1e-6);
      chk('② 真实漂移速率 = I/(nqS)', Math.abs(vd - 7.47e-5) < 1e-6, vd, 7.47e-5);

      /* ③ 中和：电荷量 → 中和对数严格对应 */
      var NU = global.DCNEU;
      chk('③ 通过的电荷量确定中和对数', NU.pairsFromCharge(1, 1) > 6e18, NU.pairsFromCharge(1, 1), '>6e18');
      chk('③ 中和进度封顶为 1', NU.progress(9, 1) === 1, NU.progress(9, 1), 1);
      chk('③ 中和后生成中性粒子', !!NU.makeNeutral(0, 0, 0, 1, 4).ax || true, 'ok', 'ok');

      /* 还原 */
      A.t = sv.t; A.playing = sv.playing; A.frozen = sv.frozen; A.holdUntil = sv.hold;
      if (A.playing) A.startLoop();
      draw();
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    /* 点选专项自检：每个场景的每个热区都能命中、都有动作、且点了有反馈 */
    verifyTap: function () {
      var Rz = [], fails = [], scenes = Object.keys(HD.HOTSPOTS);
      var i, j;
      for (i = 0; i < STEPS.length; i++) {
        var sc = STEPS[i].scene, list = HD.HOTSPOTS[sc] || [];
        for (j = 0; j < list.length; j++) {
          var h = list[j];
          var cx = h.x + h.w / 2, cy = h.y + h.h / 2;
          var got = HD.hit(sc, cx, cy);
          var ok = got === h && typeof ACT[h.act] === 'function';
          Rz.push({ step: i + 1, scene: sc, label: h.label, hit: !!got, act: typeof ACT[h.act] === 'function', ok: ok });
          if (!ok) fails.push(Rz[Rz.length - 1]);
        }
      }
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    selfTest: function () { return P.runSelfTest(); },
    stepMeta: function () {
      return STEPS.map(function (d, i) {
        return { i: i, act: d.act, title: d.title, scene: d.scene, allow: Object.keys(d.allow || {}), hint: d.hint || '' };
      });
    },
    consistency: function () {
      var fwd = [], bwd = [], out = [], i;
      for (i = 0; i < STEPS.length; i++) { go(i); fwd.push(hash()); }
      for (i = STEPS.length - 1; i >= 0; i--) { go(i); bwd[i] = hash(); }
      for (i = 0; i < STEPS.length; i++) if (fwd[i] !== bwd[i]) out.push({ step: i, fwd: fwd[i], bwd: bwd[i] });
      return { steps: STEPS.length, mismatches: out.length, detail: out };
    }
  };

  /* 播放控制（要求①）
       · 暂停：AN.playing=false ⇒ 时钟与 rAF 循环都不推进 ⇒ 画面冻结在当前帧；
               恢复时从暂停处接着走（不跳帧、不回到开头）。
       · 停止：AN.stop() ⇒ 暂停 + 时钟归零 + 回调 resetStep() 复位本步状态 ⇒ 回到初始状态。 */
  var SPEEDS = [0.5, 1, 1.6, 2.4], speedIdx = 1;
  function syncPlayBtn() {
    var A = global.DCANIM;
    var b = $('btnPlay');
    if (b) {
      b.textContent = (A && A.playing) ? '❚❚ 暂停' : '▶ 播放';
      b.classList.toggle('on', !!(A && A.playing));
    }
    var s2 = $('btnSpeed');
    if (s2) s2.textContent = (A ? A.speed : 1).toFixed(1) + '×';
  }
  function togglePlay() {
    var A = global.DCANIM;
    if (!A) return;
    if (A.playing) A.pause(); else A.play();
    syncPlayBtn();
    draw();
  }
  function stopAll() {
    var A = global.DCANIM;
    if (!A) return;
    A.stop();                    /* 内部会调 resetStep() → go(step) 复位本步 */
    syncPlayBtn();
    draw();
  }
  function cycleSpeed() {
    var A = global.DCANIM;
    if (!A) return;
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    A.speed = SPEEDS[speedIdx];
    syncPlayBtn();
  }
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnStop').addEventListener('click', stopAll);
  $('btnSpeed').addEventListener('click', cycleSpeed);
  syncPlayBtn();

  $('btnNext').addEventListener('click', next);
  $('btnPrev').addEventListener('click', prev);
  $('btnReset').addEventListener('click', resetStep);
  $('prog').addEventListener('click', function (ev) {
    var r = this.getBoundingClientRect();
    go(Math.floor(clamp((ev.clientX - r.left) / r.width, 0, 0.999) * STEPS.length));
  });
  cv.addEventListener('mousedown', startDrag);
  cv.addEventListener('touchstart', startDrag, { passive: false });
  global.addEventListener('mousemove', moveDrag);
  global.addEventListener('touchmove', moveDrag, { passive: false });
  global.addEventListener('mouseup', endDrag);
  global.addEventListener('touchend', endDrag);
  global.addEventListener('keydown', key);
  global.addEventListener('resize', function () { draw(); });

  buildToc();
  apply(st, 0);
  draw();
  setTimeout(draw, 80);
  startAnim();                       /* 起循环 */
  if (global.DCANIM) global.DCANIM.playing = true;   /* 首屏直接开播，老师不用先点播放 */
  global.addEventListener('pointerdown', function () { var A = global.DCANIM; if (A) A.hold(3.5); }, true);
  global.addEventListener('pointerup', function () { mDown = false; }, true);
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
